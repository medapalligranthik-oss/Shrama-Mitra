hi:{br:"श्रम मित्र",tg:"हर मेहनतकश हाथ का हिसाब और हक",sub1:"आपकी मज़दूरी, बचत और अधिकार – एक जगह",wl:"आज कितनी मज़दूरी मिली? (₹)",wp:"0 = काम किया, पैसा नहीं मिला",sv:"✔ दर्ज करें",d1:"काम के दिन (30 दिन में)",d2:"औसत मज़दूरी",d3:"कुल कमाई",d4:"बचत सुझाव / दिन",ls:"🔊 सुनें",ml:"न्यूनतम मज़दूरी ₹/दिन (नमूना – अपने राज्य की सरकारी दर डालें)",rc:"हाल की प्रविष्टियाँ",ne:"अभी कोई प्रविष्टि नहीं।",n1:"मेरी मज़दूरी",n2:"योजनाएँ",n3:"मदद",st:"योजनाएँ और सुरक्षा",sn:"जानकारी बदल सकती है। आवेदन से पहले सरकारी कार्यालय में पुष्टि करें।",sf:"🦺 सुरक्षित काम",ah:"सहायक",as:"माइक दबाकर अपनी भाषा में पूछें",mh:"दबाकर बोलें",ml2:"सुन रहा हूँ…",mn:"इस फ़ोन पर माइक काम नहीं करता। नीचे का सवाल दबाएँ।",q1:"कम मज़दूरी मिली",q2:"पेंशन योजना",cc:"📞 कस्टमर केयर को कॉल करें",gr:"नमस्ते! मज़दूरी और योजनाओं के बारे में पूछें।",fb:"क्षमा करें, सहायक अभी उपलब्ध नहीं है। कस्टमर केयर से बात करने के लिए कॉल बटन दबाएँ।",hd:"📞 और मदद के लिए नीचे कॉल बटन दबाएँ।",sg1:"पहला दिन दर्ज करें, बचत सुझाव मिलेगा।",sg2:"काम वाले हर दिन ₹{sv} अलग रखें। इस हिसाब से महीने में लगभग ₹{m} बचेंगे। काम न हो तो कोई दबाव नहीं।",fe:"💳 पिछले 30 दिनों की फ़ीस: <b>₹{f}</b><small>₹10 × {n} काम के दिन ÷ 30। काम नहीं तो फ़ीस नहीं। पहले 3 महीने मुफ़्त।</small>",al_t:"⚠ कम मज़दूरी",al_b:"{bad} दिन आपको न्यूनतम मज़दूरी ₹{mw} से कम मिली। न्यूनतम मज़दूरी पाना आपका हक़ है। शिकायत करना या नहीं, यह पूरी तरह आपकी मर्ज़ी है।",al_s:"{bad} दिन आपको न्यूनतम मज़दूरी {mw} रुपये से कम मिली। शिकायत करना आपकी मर्ज़ी है।",hp:"मदद लें",
sch:[["e-श्रम पंजीकरण","मुफ़्त पंजीकरण से 12 अंकों का UAN मिलता है। असंगठित मज़दूरों की कई योजनाओं का यही रास्ता है।"],["PM-SYM पेंशन","18 से 40 साल के मज़दूरों के लिए। 60 साल के बाद लगभग ₹3,000 मासिक पेंशन। आपके योगदान के बराबर सरकार भी देती है।"],["PMJJBY जीवन बीमा","किसी भी कारण से मृत्यु पर ₹2 लाख का बीमा (शर्तों के साथ)। PMSBY दुर्घटना बीमा भी है।"],["आयुष्मान भारत (PM-JAY)","पात्र परिवारों को अस्पताल के इलाज के लिए ₹5 लाख तक का स्वास्थ्य कवर।"],["निर्माण मज़दूर कल्याण बोर्ड","निर्माण मज़दूर अपने राज्य के बोर्ड में पंजीकरण कराएँ तो कल्याण लाभ मिलते हैं। नियम राज्य के अनुसार अलग हैं।"]],
safe:["ऊँचाई पर या मशीनों के पास काम करते समय हेलमेट और दस्ताने माँगें।","पीने का पानी और आराम माँगना आपका हक़ है।","चोट लगे तो तुरंत इलाज कराएँ। तारीख और जगह नोट करें।","खतरनाक काम के बारे में मेस्त्री या मदद में बताएँ।"]},
ta:{br:"ஸ்ரம் மித்ரா",tg:"உழைக்கும் ஒவ்வொரு கைக்கும் கணக்கு, உரிமை",sub1:"உங்கள் கூலி, சேமிப்பு, உரிமைகள் – ஒரே இடத்தில்",wl:"இன்று எவ்வளவு கூலி கிடைத்தது? (₹)",wp:"0 = வேலை செய்தேன், பணம் வரவில்லை",sv:"✔ பதிவு செய்",d1:"வேலை நாட்கள் (30 நாட்களில்)",d2:"சராசரி கூலி",d3:"மொத்த வருமானம்",d4:"சேமிப்பு குறிப்பு / நாள்",ls:"🔊 கேளுங்கள்",ml:"குறைந்தபட்ச கூலி ₹/நாள் (மாதிரி – உங்கள் மாநில அதிகாரப்பூர்வ விகிதத்தை உள்ளிடவும்)",rc:"சமீபத்திய பதிவுகள்",ne:"இன்னும் பதிவுகள் இல்லை.",n1:"என் கூலி",n2:"திட்டங்கள்",n3:"உதவி",st:"திட்டங்களும் பாதுகாப்பும்",sn:"விவரங்கள் மாறலாம். விண்ணப்பிக்கும் முன் அதிகாரப்பூர்வ அலுவலகத்தில் உறுதி செய்யுங்கள்.",sf:"🦺 பாதுகாப்பான வேலை",ah:"உதவியாளர்",as:"மைக்கை அழுத்தி உங்கள் மொழியில் கேளுங்கள்",mh:"அழுத்திப் பேசுங்கள்",ml2:"கேட்கிறேன்…",mn:"இந்த போனில் மைக் வேலை செய்யாது. கீழே உள்ள கேள்வியை அழுத்துங்கள்.",q1:"குறைவாகக் கூலி கொடுத்தார்கள்",q2:"ஓய்வூதியத் திட்டம்",cc:"📞 வாடிக்கையாளர் சேவைக்கு அழைக்கவும்",gr:"வணக்கம்! கூலி, திட்டங்கள் பற்றிக் கேளுங்கள்.",fb:"மன்னிக்கவும், உதவியாளர் இப்போது இல்லை. வாடிக்கையாளர் சேவையுடன் பேச அழைப்பு பட்டனை அழுத்துங்கள்.",hd:"📞 மேலும் உதவிக்கு கீழே உள்ள அழைப்பு பட்டனை அழுத்துங்கள்.",sg1:"முதல் நாளைப் பதிவு செய்யுங்கள், சேமிப்பு குறிப்பு வரும்.",sg2:"வேலை செய்த ஒவ்வொரு நாளும் ₹{sv} ஒதுக்குங்கள். மாதத்துக்கு சுமார் ₹{m} சேரும். வேலை இல்லாத நாட்களில் கவலை வேண்டாம்.",fe:"💳 கடந்த 30 நாட்களின் கட்டணம்: <b>₹{f}</b><small>₹10 × {n} வேலை நாட்கள் ÷ 30. வேலை இல்லையெனில் கட்டணம் இல்லை. முதல் 3 மாதங்கள் இலவசம்.</small>",al_t:"⚠ குறைவான கூலி",al_b:"{bad} நாட்களில் உங்கள் கூலி குறைந்தபட்ச கூலி ₹{mw}-ஐ விடக் குறைவு. குறைந்தபட்ச கூலி பெறுவது உங்கள் உரிமை. புகார் செய்வதா வேண்டாமா என்பது முழுமையாக உங்கள் விருப்பம்.",al_s:"{bad} நாட்களில் உங்கள் கூலி குறைந்தபட்ச கூலி {mw} ரூபாயை விடக் குறைவு. புகார் செய்வது உங்கள் விருப்பம்.",hp:"உதவி பெறுங்கள்",
sch:[["e-ஸ்ரம் பதிவு","இலவசப் பதிவின் மூலம் 12 இலக்க UAN எண் கிடைக்கும். அமைப்புசாரா தொழிலாளர்களுக்கான பல திட்டங்களுக்கு இதுவே வாசல்."],["PM-SYM ஓய்வூதியம்","18 முதல் 40 வயது தொழிலாளர்களுக்கு. 60 வயதுக்குப் பிறகு மாதம் சுமார் ₹3,000 ஓய்வூதியம். உங்கள் பங்குக்கு இணையாக அரசும் செலுத்தும்."],["PMJJBY ஆயுள் காப்பீடு","எந்தக் காரணத்தாலும் இறந்தால் ₹2 லட்சம் காப்பீடு (நிபந்தனைகளுடன்). PMSBY விபத்துக் காப்பீடும் உள்ளது."],["ஆயுஷ்மான் பாரத் (PM-JAY)","தகுதியுள்ள குடும்பங்களுக்கு மருத்துவமனை சிகிச்சைக்கு ₹5 லட்சம் வரை சுகாதாரப் பாதுகாப்பு."],["கட்டுமானத் தொழிலாளர் நல வாரியம்","கட்டுமானத் தொழிலாளர்கள் மாநில வாரியத்தில் பதிவு செய்தால் நலன்கள் கிடைக்கும். பதிவு விதிகள் மாநிலத்துக்கு மாநிலம் மாறும்."]],
safe:["உயரத்திலோ இயந்திரங்கள் அருகிலோ வேலை செய்யும்போது ஹெல்மெட், கையுறை கேளுங்கள்.","குடிநீர், ஓய்வு கேட்பது உங்கள் உரிமை.","காயம் ஏற்பட்டால் உடனே சிகிச்சை பெறுங்கள். தேதி, இடத்தைக் குறித்துக் கொள்ளுங்கள்.","ஆபத்தான வேலை பற்றி மேஸ்திரியிடமோ உதவியிலோ சொல்லுங்கள்."]},
kn:{br:"ಶ್ರಮ ಮಿತ್ರ",tg:"ದುಡಿಯುವ ಪ್ರತಿ ಕೈಗೂ ಲೆಕ್ಕ, ಹಕ್ಕು",sub1:"ನಿಮ್ಮ ಕೂಲಿ, ಉಳಿತಾಯ, ಹಕ್ಕುಗಳು – ಒಂದೇ ಕಡೆ",wl:"ಇಂದು ಎಷ್ಟು ಕೂಲಿ ಸಿಕ್ಕಿತು? (₹)",wp:"0 = ಕೆಲಸ ಮಾಡಿದೆ, ಹಣ ಬಂದಿಲ್ಲ",sv:"✔ ದಾಖಲಿಸಿ",d1:"ಕೆಲಸದ ದಿನಗಳು (30 ದಿನಗಳಲ್ಲಿ)",d2:"ಸರಾಸರಿ ಕೂಲಿ",d3:"ಒಟ್ಟು ಗಳಿಕೆ",d4:"ಉಳಿತಾಯ ಸಲಹೆ / ದಿನ",ls:"🔊 ಕೇಳಿ",ml:"ಕನಿಷ್ಠ ಕೂಲಿ ₹/ದಿನ (ಮಾದರಿ – ನಿಮ್ಮ ರಾಜ್ಯದ ಅಧಿಕೃತ ದರ ನಮೂದಿಸಿ)",rc:"ಇತ್ತೀಚಿನ ದಾಖಲೆಗಳು",ne:"ಇನ್ನೂ ದಾಖಲೆಗಳಿಲ್ಲ.",n1:"ನನ್ನ ಕೂಲಿ",n2:"ಯೋಜನೆಗಳು",n3:"ಸಹಾಯ",st:"ಯೋಜನೆಗಳು ಮತ್ತು ಸುರಕ್ಷತೆ",sn:"ವಿವರಗಳು ಬದಲಾಗಬಹುದು. ಅರ್ಜಿ ಹಾಕುವ ಮುನ್ನ ಅಧಿಕೃತ ಕಚೇರಿಯಲ್ಲಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ.",sf:"🦺 ಸುರಕ್ಷಿತ ಕೆಲಸ",ah:"ಸಹಾಯಕ",as:"ಮೈಕ್ ಒತ್ತಿ ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ಕೇಳಿ",mh:"ಒತ್ತಿ ಮಾತನಾಡಿ",ml2:"ಕೇಳುತ್ತಿದ್ದೇನೆ…",mn:"ಈ ಫೋನ್‌ನಲ್ಲಿ ಮೈಕ್ ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ. ಕೆಳಗಿನ ಪ್ರಶ್ನೆ ಒತ್ತಿ.",q1:"ಕಡಿಮೆ ಕೂಲಿ ಕೊಟ್ಟರು",q2:"ಪಿಂಚಣಿ ಯೋಜನೆ",cc:"📞 ಗ್ರಾಹಕ ಸೇವೆಗೆ ಕರೆ ಮಾಡಿ",gr:"ನಮಸ್ಕಾರ! ಕೂಲಿ, ಯೋಜನೆಗಳ ಬಗ್ಗೆ ಕೇಳಿ.",fb:"ಕ್ಷಮಿಸಿ, ಸಹಾಯಕ ಈಗ ಲಭ್ಯವಿಲ್ಲ. ಗ್ರಾಹಕ ಸೇವೆಯೊಂದಿಗೆ ಮಾತನಾಡಲು ಕರೆ ಬಟನ್ ಒತ್ತಿ.",hd:"📞 ಹೆಚ್ಚಿನ ಸಹಾಯಕ್ಕೆ ಕೆಳಗಿನ ಕರೆ ಬಟನ್ ಒತ್ತಿ.",sg1:"ಮೊದಲ ದಿನ ದಾಖಲಿಸಿ, ಉಳಿತಾಯ ಸಲಹೆ ಬರುತ್ತದೆ.",sg2:"ಕೆಲಸ ಮಾಡಿದ ಪ್ರತಿ ದಿನ ₹{sv} ಪಕ್ಕಕ್ಕಿಡಿ. ತಿಂಗಳಿಗೆ ಸುಮಾರು ₹{m} ಉಳಿಯುತ್ತದೆ. ಕೆಲಸ ಇಲ್ಲದ ದಿನ ಒತ್ತಡ ಬೇಡ.",fe:"💳 ಕಳೆದ 30 ದಿನಗಳ ಶುಲ್ಕ: <b>₹{f}</b><small>₹10 × {n} ಕೆಲಸದ ದಿನ ÷ 30. ಕೆಲಸ ಇಲ್ಲದಿದ್ದರೆ ಶುಲ್ಕ ಇಲ್ಲ. ಮೊದಲ 3 ತಿಂಗಳು ಉಚಿತ.</small>",al_t:"⚠ ಕಡಿಮೆ ಕೂಲಿ",al_b:"{bad} ದಿನ ನಿಮಗೆ ಸಿಕ್ಕ ಕೂಲಿ ಕನಿಷ್ಠ ಕೂಲಿ ₹{mw} ಗಿಂತ ಕಡಿಮೆ. ಕನಿಷ್ಠ ಕೂಲಿ ಪಡೆಯುವುದು ನಿಮ್ಮ ಹಕ್ಕು. ದೂರು ನೀಡಬೇಕೇ ಬೇಡವೇ ಎಂಬುದು ಸಂಪೂರ್ಣ ನಿಮ್ಮ ಆಯ್ಕೆ.",al_s:"{bad} ದಿನ ನಿಮಗೆ ಸಿಕ್ಕ ಕೂಲಿ ಕನಿಷ್ಠ ಕೂಲಿ {mw} ರೂಪಾಯಿಗಿಂತ ಕಡಿಮೆ. ದೂರು ನೀಡುವುದು ನಿಮ್ಮ ಆಯ್ಕೆ.",hp:"ಸಹಾಯ ಪಡೆಯಿರಿ",
sch:[["e-ಶ್ರಮ ನೋಂದಣಿ","ಉಚಿತ ನೋಂದಣಿಯಿಂದ 12 ಅಂಕಿಯ UAN ಸಿಗುತ್ತದೆ. ಅಸಂಘಟಿತ ಕಾರ್ಮಿಕರ ಹಲವು ಯೋಜನೆಗಳಿಗೆ ಇದೇ ಬಾಗಿಲು."],["PM-SYM ಪಿಂಚಣಿ","18 ರಿಂದ 40 ವರ್ಷದ ಕಾರ್ಮಿಕರಿಗೆ. 60 ವರ್ಷದ ನಂತರ ತಿಂಗಳಿಗೆ ಸುಮಾರು ₹3,000 ಪಿಂಚಣಿ. ನಿಮ್ಮ ಪಾಲಿಗೆ ಸಮನಾಗಿ ಸರ್ಕಾರವೂ ಕಟ್ಟುತ್ತದೆ."],["PMJJBY ಜೀವ ವಿಮೆ","ಯಾವುದೇ ಕಾರಣದಿಂದ ಮರಣ ಹೊಂದಿದರೆ ₹2 ಲಕ್ಷ ವಿಮೆ (ಷರತ್ತುಗಳಿಗೆ ಒಳಪಟ್ಟು). PMSBY ಅಪಘಾತ ವಿಮೆಯೂ ಇದೆ."],["ಆಯುಷ್ಮಾನ್ ಭಾರತ್ (PM-JAY)","ಅರ್ಹ ಕುಟುಂಬಗಳಿಗೆ ಆಸ್ಪತ್ರೆ ಚಿಕಿತ್ಸೆಗೆ ₹5 ಲಕ್ಷದವರೆಗೆ ಆರೋಗ್ಯ ರಕ್ಷಣೆ."],["ಕಟ್ಟಡ ಕಾರ್ಮಿಕರ ಕಲ್ಯಾಣ ಮಂಡಳಿ","ಕಟ್ಟಡ ಕಾರ್ಮಿಕರು ರಾಜ್ಯದ ಮಂಡಳಿಯಲ್ಲಿ ನೋಂದಾಯಿಸಿದರೆ ಕಲ್ಯಾಣ ಸೌಲಭ್ಯ ಸಿಗುತ್ತದೆ. ನೋಂದಣಿ ನಿಯಮಗಳು ರಾಜ್ಯಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಾಗುತ್ತವೆ."]],
safe:["ಎತ್ತರದಲ್ಲಿ ಅಥವಾ ಯಂತ್ರಗಳ ಬಳಿ ಕೆಲಸ ಮಾಡುವಾಗ ಹೆಲ್ಮೆಟ್, ಕೈಗವಸು ಕೇಳಿ.","ಕುಡಿಯುವ ನೀರು, ವಿಶ್ರಾಂತಿ ಕೇಳುವುದು ನಿಮ್ಮ ಹಕ್ಕು.","ಗಾಯವಾದರೆ ತಕ್ಷಣ ಚಿಕಿತ್ಸೆ ಪಡೆಯಿರಿ. ದಿನಾಂಕ, ಸ್ಥಳ ಬರೆದಿಟ್ಟುಕೊಳ್ಳಿ.","ಅಪಾಯಕಾರಿ ಕೆಲಸದ ಬಗ್ಗೆ ಮೇಸ್ತ್ರಿಗೆ ಅಥವಾ ಸಹಾಯದಲ್ಲಿ ತಿಳಿಸಿ."]},
mr:{br:"श्रम मित्र",tg:"प्रत्येक कष्टकरी हाताचा हिशोब आणि हक्क",sub1:"तुमची मजुरी, बचत आणि हक्क – एकाच ठिकाणी",wl:"आज किती मजुरी मिळाली? (₹)",wp:"0 = काम केले, पैसे मिळाले नाहीत",sv:"✔ नोंदवा",d1:"कामाचे दिवस (30 दिवसांत)",d2:"सरासरी मजुरी",d3:"एकूण कमाई",d4:"बचत सूचना / दिवस",ls:"🔊 ऐका",ml:"किमान मजुरी ₹/दिवस (नमुना – तुमच्या राज्याचा अधिकृत दर टाका)",rc:"अलीकडील नोंदी",ne:"अजून नोंदी नाहीत.",n1:"माझी मजुरी",n2:"योजना",n3:"मदत",st:"योजना आणि सुरक्षा",sn:"माहिती बदलू शकते. अर्ज करण्यापूर्वी अधिकृत कार्यालयात खात्री करा.",sf:"🦺 सुरक्षित काम",ah:"सहाय्यक",as:"माइक दाबून तुमच्या भाषेत विचारा",mh:"दाबून बोला",ml2:"ऐकत आहे…",mn:"या फोनवर माइक चालत नाही. खालील प्रश्न दाबा.",q1:"कमी मजुरी दिली",q2:"पेन्शन योजना",cc:"📞 ग्राहक सेवेला कॉल करा",gr:"नमस्कार! मजुरी आणि योजनांबद्दल विचारा.",fb:"क्षमस्व, सहाय्यक सध्या उपलब्ध नाही. ग्राहक सेवेशी बोलण्यासाठी कॉल बटन दाबा.",hd:"📞 अधिक मदतीसाठी खालील कॉल बटन दाबा.",sg1:"पहिला दिवस नोंदवा, बचत सूचना मिळेल.",sg2:"काम केलेल्या प्रत्येक दिवशी ₹{sv} बाजूला ठेवा. यानुसार महिन्याला सुमारे ₹{m} बचत होईल. काम नसलेल्या दिवशी ताण नको.",fe:"💳 गेल्या 30 दिवसांचे शुल्क: <b>₹{f}</b><small>₹10 × {n} कामाचे दिवस ÷ 30. काम नसेल तर शुल्क नाही. पहिले 3 महिने मोफत.</small>",al_t:"⚠ कमी मजुरी",al_b:"{bad} दिवस तुम्हाला मिळालेली मजुरी किमान मजुरी ₹{mw} पेक्षा कमी होती. किमान मजुरी मिळवणे हा तुमचा हक्क आहे. तक्रार करायची की नाही हे पूर्णपणे तुमच्या मर्जीवर आहे.",al_s:"{bad} दिवस तुम्हाला मिळालेली मजुरी किमान मजुरी {mw} रुपयांपेक्षा कमी होती. तक्रार करणे तुमच्या मर्जीवर आहे.",hp:"मदत घ्या",
sch:[["e-श्रम नोंदणी","मोफत नोंदणी केल्यास 12 अंकी UAN मिळतो. असंघटित कामगारांच्या अनेक योजनांचे हेच प्रवेशद्वार आहे."],["PM-SYM पेन्शन","18 ते 40 वर्षांच्या कामगारांसाठी. 60 वर्षांनंतर दरमहा सुमारे ₹3,000 पेन्शन. तुमच्या वाट्याइतकीच रक्कम सरकारही भरते."],["PMJJBY जीवन विमा","कोणत्याही कारणाने मृत्यू झाल्यास ₹2 लाखांचे विमा संरक्षण (अटींसह). PMSBY अपघात विमाही आहे."],["आयुष्मान भारत (PM-JAY)","पात्र कुटुंबांना रुग्णालयातील उपचारांसाठी ₹5 लाखांपर्यंत आरोग्य संरक्षण."],["बांधकाम कामगार कल्याण मंडळ","बांधकाम कामगारांनी राज्य मंडळाकडे नोंदणी केल्यास कल्याणकारी लाभ मिळतात. नोंदणीचे नियम राज्यानुसार वेगळे असतात."]],

ml:{br:"ശ്രമ മിത്ര",tg:"അധ്വാനിക്കുന്ന ഓരോ കൈക്കും കണക്കും അവകാശവും",sub1:"നിങ്ങളുടെ കൂലി, സമ്പാദ്യം, അവകാശങ്ങൾ – ഒരിടത്ത്",wl:"ഇന്ന് എത്ര കൂലി കിട്ടി? (₹)",wp:"0 = പണിയെടുത്തു, പണം കിട്ടിയില്ല",sv:"✔ രേഖപ്പെടുത്തുക",d1:"പണിയെടുത്ത ദിവസങ്ങൾ (30 ദിവസത്തിൽ)",d2:"ശരാശരി കൂലി",d3:"ആകെ വരുമാനം",d4:"സമ്പാദ്യ നിർദ്ദേശം / ദിവസം",ls:"🔊 കേൾക്കുക",ml:"മിനിമം കൂലി ₹/ദിവസം (മാതൃക – നിങ്ങളുടെ സംസ്ഥാനത്തെ ഔദ്യോഗിക നിരക്ക് നൽകുക)",rc:"സമീപകാല രേഖകൾ",ne:"ഇതുവരെ രേഖകളില്ല.",n1:"എന്റെ കൂലി",n2:"പദ്ധതികൾ",n3:"സഹായം",st:"പദ്ധതികളും സുരക്ഷയും",sn:"വിവരങ്ങൾ മാറാം. അപേക്ഷിക്കും മുമ്പ് ഔദ്യോഗിക ഓഫീസിൽ ഉറപ്പാക്കുക.",sf:"🦺 സുരക്ഷിത ജോലി",ah:"സഹായി",as:"മൈക്ക് അമർത്തി നിങ്ങളുടെ ഭാഷയിൽ ചോദിക്കൂ",mh:"അമർത്തി സംസാരിക്കൂ",ml2:"കേൾക്കുന്നു…",mn:"ഈ ഫോണിൽ മൈക്ക് പ്രവർത്തിക്കില്ല. താഴെയുള്ള ചോദ്യം അമർത്തുക.",q1:"കുറവ് കൂലി തന്നു",q2:"പെൻഷൻ പദ്ധതി",cc:"📞 കസ്റ്റമർ കെയറിൽ വിളിക്കുക",gr:"നമസ്കാരം! കൂലിയെയും പദ്ധതികളെയും കുറിച്ച് ചോദിക്കൂ.",fb:"ക്ഷമിക്കണം, സഹായി ഇപ്പോൾ ലഭ്യമല്ല. കസ്റ്റമർ കെയറുമായി സംസാരിക്കാൻ കോൾ ബട്ടൺ അമർത്തുക.",hd:"📞 കൂടുതൽ സഹായത്തിന് താഴെയുള്ള കോൾ ബട്ടൺ അമർത്തുക.",sg1:"ആദ്യ ദിവസം രേഖപ്പെടുത്തൂ, സമ്പാദ്യ നിർദ്ദേശം ലഭിക്കും.",sg2:"പണിയെടുത്ത ഓരോ ദിവസവും ₹{sv} മാറ്റിവയ്ക്കൂ. മാസം ഏകദേശം ₹{m} സമ്പാദിക്കാം. പണിയില്ലാത്ത ദിവസങ്ങളിൽ സമ്മർദ്ദം വേണ്ട.",fe:"💳 കഴിഞ്ഞ 30 ദിവസത്തെ ഫീസ്: <b>₹{f}</b><small>₹10 × {n} പണിദിവസങ്ങൾ ÷ 30. പണിയില്ലെങ്കിൽ ഫീസില്ല. ആദ്യ 3 മാസം സൗജന്യം.</small>",al_t:"⚠ കുറഞ്ഞ കൂലി",al_b:"{bad} ദിവസം നിങ്ങൾക്ക് കിട്ടിയ കൂലി മിനിമം കൂലിയായ ₹{mw}-ൽ കുറവായിരുന്നു. മിനിമം കൂലി ലഭിക്കുന്നത് നിങ്ങളുടെ അവകാശമാണ്. പരാതി നൽകണോ വേണ്ടയോ എന്നത് പൂർണ്ണമായും നിങ്ങളുടെ തീരുമാനം.",al_s:"{bad} ദിവസം നിങ്ങൾക്ക് കിട്ടിയ കൂലി മിനിമം കൂലിയായ {mw} രൂപയിൽ കുറവായിരുന്നു. പരാതി നൽകുന്നത് നിങ്ങളുടെ തീരുമാനം.",hp:"സഹായം തേടുക",
sch:[["e-ശ്രം രജിസ്ട്രേഷൻ","സൗജന്യമായി രജിസ്റ്റർ ചെയ്താൽ 12 അക്ക UAN കിട്ടും. അസംഘടിത തൊഴിലാളികളുടെ പല പദ്ധതികൾക്കും ഇതാണ് വാതിൽ."],["PM-SYM പെൻഷൻ","18 മുതൽ 40 വയസ്സുവരെയുള്ള തൊഴിലാളികൾക്ക്. 60 വയസ്സിനു ശേഷം മാസം ഏകദേശം ₹3,000 പെൻഷൻ. നിങ്ങളുടെ വിഹിതത്തിന് തുല്യമായി സർക്കാരും അടയ്ക്കും."],["PMJJBY ജീവൻ ഇൻഷുറൻസ്","ഏതു കാരണത്താലും മരിച്ചാൽ ₹2 ലക്ഷം ഇൻഷുറൻസ് (വ്യവസ്ഥകൾക്ക് വിധേയമായി). PMSBY അപകട ഇൻഷുറൻസും ഉണ്ട്."],["ആയുഷ്മാൻ ഭാരത് (PM-JAY)","അർഹരായ കുടുംബങ്ങൾക്ക് ആശുപത്രി ചികിത്സയ്ക്ക് ₹5 ലക്ഷം വരെ ആരോഗ്യ പരിരക്ഷ."],["നിർമ്മാണ തൊഴിലാളി ക്ഷേമ ബോർഡ്","നിർമ്മാണ തൊഴിലാളികൾ സംസ്ഥാന ബോർഡിൽ രജിസ്റ്റർ ചെയ്താൽ ക്ഷേമ ആനുകൂല്യങ്ങൾ കിട്ടും. രജിസ്ട്രേഷൻ നിയമങ്ങൾ സംസ്ഥാനം അനുസരിച്ച് മാറും."]],
safe:["ഉയരത്തിലോ യന്ത്രങ്ങൾക്കടുത്തോ പണിയെടുക്കുമ്പോൾ ഹെൽമെറ്റും കൈയുറയും ചോദിക്കൂ.","കുടിവെള്ളവും വിശ്രമവും ചോദിക്കുന്നത് നിങ്ങളുടെ അവകാശമാണ്.","പരിക്കേറ്റാൽ ഉടൻ ചികിത്സ തേടൂ. തീയതിയും സ്ഥലവും കുറിച്ചുവയ്ക്കൂ.","അപകടകരമായ പണിയെക്കുറിച്ച് മേസ്തിരിയോടോ സഹായത്തിലോ പറയൂ."]},

sch:[["e-શ્રમ નોંધણી","મફત નોંધણીથી 12 આંકડાનો UAN મળે છે. અસંગઠિત કામદારોની ઘણી યોજનાઓનું આ પ્રવેશદ્વાર છે."],["PM-SYM પેન્શન","18 થી 40 વર્ષના કામદારો માટે. 60 વર્ષ પછી દર મહિને આશરે ₹3,000 પેન્શન. તમારા હિસ્સા જેટલી રકમ સરકાર પણ ભરે છે."],["PMJJBY જીવન વીમો","કોઈ પણ કારણે મૃત્યુ થાય તો ₹2 લાખનું વીમા કવચ (શરતો સાથે). PMSBY અકસ્માત વીમો પણ છે."],["આયુષ્માન ભારત (PM-JAY)","પાત્ર પરિવારોને હોસ્પિટલ સારવાર માટે ₹5 લાખ સુધીનું આરોગ્ય કવચ."],["બાંધકામ કામદાર કલ્યાણ બોર્ડ","બાંધકામ કામદારો રાજ્યના બોર્ડમાં નોંધણી કરાવે તો કલ્યાણ લાભ મળે છે. નોંધણીના નિયમો રાજ્ય પ્રમાણે જુદા હોય છે."]],

sch:[["e-ਸ਼੍ਰਮ ਰਜਿਸਟ੍ਰੇਸ਼ਨ","ਮੁਫ਼ਤ ਰਜਿਸਟ੍ਰੇਸ਼ਨ ਨਾਲ 12 ਅੰਕਾਂ ਦਾ UAN ਮਿਲਦਾ ਹੈ। ਗ਼ੈਰ-ਸੰਗਠਿਤ ਕਾਮਿਆਂ ਦੀਆਂ ਕਈ ਯੋਜਨਾਵਾਂ ਦਾ ਇਹੀ ਦਰਵਾਜ਼ਾ ਹੈ।"],["PM-SYM ਪੈਨਸ਼ਨ","18 ਤੋਂ 40 ਸਾਲ ਦੇ ਕਾਮਿਆਂ ਲਈ। 60 ਸਾਲ ਤੋਂ ਬਾਅਦ ਮਹੀਨੇ ਦੀ ਲਗਭਗ ₹3,000 ਪੈਨਸ਼ਨ। ਤੁਹਾਡੇ ਹਿੱਸੇ ਦੇ ਬਰਾਬਰ ਸਰਕਾਰ ਵੀ ਪਾਉਂਦੀ ਹੈ।"],["PMJJBY ਜੀਵਨ ਬੀਮਾ","ਕਿਸੇ ਵੀ ਕਾਰਨ ਮੌਤ ਹੋਣ 'ਤੇ ₹2 ਲੱਖ ਦਾ ਬੀਮਾ (ਸ਼ਰਤਾਂ ਸਮੇਤ)। PMSBY ਹਾਦਸਾ ਬੀਮਾ ਵੀ ਹੈ।"],["ਆਯੁਸ਼ਮਾਨ ਭਾਰਤ (PM-JAY)","ਯੋਗ ਪਰਿਵਾਰਾਂ ਨੂੰ ਹਸਪਤਾਲ ਦੇ ਇਲਾਜ ਲਈ ₹5 ਲੱਖ ਤੱਕ ਦੀ ਸਿਹਤ ਸੁਰੱਖਿਆ।"],["ਉਸਾਰੀ ਕਾਮਾ ਭਲਾਈ ਬੋਰਡ","ਉਸਾਰੀ ਕਾਮੇ ਰਾਜ ਦੇ ਬੋਰਡ ਵਿੱਚ ਰਜਿਸਟਰ ਹੋਣ ਤਾਂ ਭਲਾਈ ਲਾਭ ਮਿਲਦੇ ਹਨ। ਰਜਿਸਟ੍ਰੇਸ਼ਨ ਦੇ ਨਿਯਮ ਰਾਜ ਅਨੁਸਾਰ ਵੱਖਰੇ ਹਨ।"]],

tcs:["వయసు 16–59. ఆదాయపు పన్ను చెల్లించని, EPFO/ESIC సభ్యులు కాని అసంఘటిత కార్మికులకు. ఆధార్, దానికి అనుసంధానమైన మొబైల్ నంబర్ కావాలి. నమోదు ఉచితం.","వయసు 18–40, నెలవారీ ఆదాయం ₹15,000 వరకు, EPFO/ESIC/NPS సభ్యులు కాకూడదు. వయసును బట్టి నెలవారీ మొత్తాన్ని బ్యాంక్ ఆటో-డెబిట్ ద్వారా మీరు చెల్లిస్తారు, ప్రభుత్వం అంతే మొత్తం చెల్లిస్తుంది. చెల్లింపు ఆపితే ప్రయోజనాలపై ప్రభావం ఉంటుంది.","PMJJBY: వయసు 18–50, ఏ కారణంతో మరణించినా ₹2 లక్షలు. PMSBY: వయసు 18–70, ప్రమాద బీమా. రెండింటికీ ఆటో-డెబిట్‌తో బ్యాంక్ ఖాతా కావాలి, ప్రతి సంవత్సరం పునరుద్ధరించాలి. వార్షిక ప్రీమియం చిన్నది; ప్రస్తుత మొత్తం బ్యాంక్‌లో నిర్ధారించుకోండి.","అర్హత మీ ఉద్యోగంపై కాదు, మీ కుటుంబం రాష్ట్ర/కేంద్ర లబ్ధిదారుల జాబితాలో ఉండటంపై ఆధారపడి ఉంటుంది. ఎంపానెల్ ఆసుపత్రుల్లో కుటుంబానికి సంవత్సరానికి ₹5 లక్షల వరకు. ఆయుష్మాన్ కార్డు తీసుకుని, ప్రభుత్వ కేంద్రంలో అర్హత చూసుకోండి.","సాధారణంగా గత 12 నెలల్లో కనీసం 90 రోజులు పని చేసిన 18–60 ఏళ్ల నిర్మాణ కార్మికులకు. నియమాలు, ప్రయోజనాలు రాష్ట్రాన్ని బట్టి మారతాయి, మీ రాష్ట్ర బోర్డులో నిర్ధారించుకోండి."]},
en:{off:"😴 No work today",tdw:"Today: worked, {a} recorded",tdo:"Today: no work recorded",ed:"You can change this for {t} more (hh:mm).",lk:"🔒 Locked – 6 hours have passed.",fe:"💳 This month's fee so far: <b>{f}</b><small>₹10 × {n} paid days ÷ 30. Unpaid and no-work days are free. The total is final at month end.</small>",fef:"💳 This month's fee: <b>Free</b><small>Your first 3 months are free. Paid days so far: {n}.</small>",fr:"Free",lc:"Your state",s0:"Select state",s1:"Telangana",s2:"Other state",zn:"Your area",z1:"Municipal corporation",z2:"Municipality",z3:"Rural / urban panchayat",sk:"Skill level",k1:"Unskilled",k2:"Semi-skilled",k3:"Skilled",k4:"Highly skilled",mwa:"Minimum wage for you: <b>{w}</b> per day ({m} a month ÷ 26), from Telangana's order effective 1 June 2026. Variable DA, revised every April and October, may add more. Agriculture and some sectors have separate rates.",mwo:"Automatic rates are not loaded for this state yet. Enter the daily minimum wage yourself below, or ask the assistant or customer care.",n4:"History",hi:"History",hs:"Every record and edit is saved. You can change an entry for 6 hours after recording it.",m1:"Paid days",m2:"Unpaid days",m3:"No-work days",m4:"Total earned",m5:"Fee",m6:"Saving (10%)",sw:"Worked",su:"Worked, unpaid",so:"No work",rcd:"Recorded {t}",edn:"Edited {n}×",eb:"Edit",sb:"Save",cb:"Cancel",lg:"Change log",la:"Recorded",le:"Edited",nh:"No records yet.",fin:"final",sofar:"so far",tc:"Terms & conditions",d1:"Days worked (this month)",
tcs:["Age 16–59. For unorganised workers who are not income-tax payers or members of EPFO/ESIC. Needs Aadhaar and a mobile number linked to it. Registration is free.","Age 18–40 with monthly income up to ₹15,000, not a member of EPFO, ESIC or NPS. You pay a monthly amount by bank auto-debit (it depends on your age) and the government pays an equal amount. If you stop paying, benefits can be affected.","PMJJBY: age 18–50, ₹2 lakh on death from any cause. PMSBY: age 18–70, accident cover. Both need a bank account with auto-debit and are renewed every year. The yearly premium is small; confirm the current amount at your bank.","Eligibility depends on your family being on the state/central beneficiary list, not on your job. Cover is up to ₹5 lakh per family a year at empanelled hospitals. Get your Ayushman card and check eligibility at a government centre.","Usually for construction workers aged 18–60 who have worked at least 90 days in the last 12 months. Rules and benefits differ by state, so confirm with your state board."]},
hi:{off:"😴 आज काम नहीं",tdw:"आज: काम किया, {a} दर्ज",tdo:"आज: काम नहीं, दर्ज किया गया",ed:"अगले {t} (घं:मि) तक बदल सकते हैं।",lk:"🔒 लॉक – 6 घंटे बीत गए।",fe:"💳 इस महीने अब तक की फ़ीस: <b>{f}</b><small>₹10 × {n} भुगतान वाले दिन ÷ 30। बिना भुगतान वाले और काम-रहित दिन मुफ़्त। महीने के अंत में अंतिम राशि तय होगी।</small>",fef:"💳 इस महीने की फ़ीस: <b>मुफ़्त</b><small>पहले 3 महीने मुफ़्त हैं। अब तक भुगतान वाले दिन: {n}।</small>",fr:"मुफ़्त",lc:"आपका राज्य",s0:"राज्य चुनें",s1:"तेलंगाना",s2:"अन्य राज्य",zn:"आपका क्षेत्र",z1:"नगर निगम",z2:"नगरपालिका",z3:"ग्रामीण / नगर पंचायत",sk:"कौशल स्तर",k1:"अकुशल",k2:"अर्ध-कुशल",k3:"कुशल",k4:"उच्च कुशल",mwa:"आपके लिए न्यूनतम मज़दूरी: <b>{w}</b> प्रति दिन (महीने के {m} ÷ 26), तेलंगाना के 1 जून 2026 के आदेश से। हर अप्रैल और अक्टूबर में बदलने वाला VDA और जुड़ सकता है। खेती और कुछ क्षेत्रों की दरें अलग हैं।",mwo:"इस राज्य की दरें अभी स्वचालित रूप से उपलब्ध नहीं हैं। नीचे दैनिक न्यूनतम मज़दूरी खुद डालें, या सहायक/कस्टमर केयर से पूछें।",n4:"इतिहास",hi:"इतिहास",hs:"हर प्रविष्टि और हर बदलाव सुरक्षित रहता है। दर्ज करने के 6 घंटे तक बदल सकते हैं।",m1:"भुगतान वाले दिन",m2:"बिना भुगतान के दिन",m3:"काम-रहित दिन",m4:"कुल कमाई",m5:"फ़ीस",m6:"बचत (10%)",sw:"काम किया",su:"काम किया, पैसा नहीं मिला",so:"काम नहीं",rcd:"दर्ज: {t}",edn:"{n} बार बदला",eb:"बदलें",sb:"सेव",cb:"रद्द",lg:"बदलाव का रिकॉर्ड",la:"दर्ज",le:"बदलाव",nh:"अभी कोई रिकॉर्ड नहीं।",fin:"अंतिम",sofar:"अब तक",tc:"नियम और शर्तें",d1:"काम के दिन (इस महीने)",
tcs:["उम्र 16–59। आयकर न देने वाले और EPFO/ESIC के सदस्य न होने वाले असंगठित मज़दूरों के लिए। आधार और उससे जुड़ा मोबाइल नंबर चाहिए। पंजीकरण मुफ़्त है।","उम्र 18–40, मासिक आय ₹15,000 तक, EPFO/ESIC/NPS के सदस्य न हों। उम्र के अनुसार तय मासिक राशि आप बैंक ऑटो-डेबिट से देते हैं और सरकार उतनी ही राशि देती है। भुगतान रोकने पर लाभ प्रभावित हो सकते हैं।","PMJJBY: उम्र 18–50, किसी भी कारण से मृत्यु पर ₹2 लाख। PMSBY: उम्र 18–70, दुर्घटना बीमा। दोनों के लिए ऑटो-डेबिट वाला बैंक खाता चाहिए और हर साल नवीनीकरण होता है। सालाना प्रीमियम छोटा है; मौजूदा राशि बैंक से पक्का करें।","पात्रता आपके काम पर नहीं, बल्कि आपके परिवार के राज्य/केंद्र की लाभार्थी सूची में होने पर निर्भर है। सूचीबद्ध अस्पतालों में परिवार को साल में ₹5 लाख तक। आयुष्मान कार्ड बनवाएँ और सरकारी केंद्र पर पात्रता जाँचें।","आमतौर पर 18–60 साल के उन निर्माण मज़दूरों के लिए जिन्होंने पिछले 12 महीनों में कम से कम 90 दिन काम किया हो। नियम और लाभ राज्य के अनुसार अलग हैं, अपने राज्य बोर्ड से पुष्टि करें।"]},
ta:{off:"😴 இன்று வேலை இல்லை",tdw:"இன்று: வேலை செய்தேன், {a} பதிவு",tdo:"இன்று: வேலை இல்லை என பதிவு",ed:"இன்னும் {t} (மணி:நிமி) வரை மாற்றலாம்.",lk:"🔒 பூட்டப்பட்டது – 6 மணி நேரம் கடந்தது.",fe:"💳 இந்த மாதம் இதுவரை கட்டணம்: <b>{f}</b><small>₹10 × {n} கூலி கிடைத்த நாட்கள் ÷ 30. கூலி கிடைக்காத நாட்களும் வேலை இல்லாத நாட்களும் இலவசம். மாத இறுதியில் இறுதித் தொகை தெரியும்.</small>",fef:"💳 இந்த மாதக் கட்டணம்: <b>இலவசம்</b><small>முதல் 3 மாதங்கள் இலவசம். இதுவரை கூலி கிடைத்த நாட்கள்: {n}.</small>",fr:"இலவசம்",lc:"உங்கள் மாநிலம்",s0:"மாநிலத்தைத் தேர்வு செய்யுங்கள்",s1:"தெலங்கானா",s2:"வேறு மாநிலம்",zn:"உங்கள் பகுதி",z1:"மாநகராட்சி",z2:"நகராட்சி",z3:"கிராமம் / பேரூராட்சி",sk:"திறன் நிலை",k1:"திறனற்றவர்",k2:"அரைத் திறன்",k3:"திறமையானவர்",k4:"உயர் திறமை",mwa:"உங்களுக்கான குறைந்தபட்ச கூலி: <b>{w}</b> நாளுக்கு (மாதம் {m} ÷ 26), தெலங்கானாவின் 1 ஜூன் 2026 உத்தரவுப்படி. ஒவ்வொரு ஏப்ரல், அக்டோபரிலும் மாறும் VDA கூடுதலாக வரலாம். விவசாயம், சில துறைகளுக்கு தனி விகிதங்கள் உள்ளன.",mwo:"இந்த மாநிலத்துக்கான தானியங்கி விகிதங்கள் இன்னும் இல்லை. கீழே தினசரி குறைந்தபட்ச கூலியை நீங்களே உள்ளிடுங்கள், அல்லது உதவியாளர்/வாடிக்கையாளர் சேவையிடம் கேளுங்கள்.",n4:"வரலாறு",hi:"வரலாறு",hs:"ஒவ்வொரு பதிவும் ஒவ்வொரு மாற்றமும் சேமிக்கப்படும். பதிவு செய்த 6 மணி நேரம் வரை மாற்றலாம்.",m1:"கூலி கிடைத்த நாட்கள்",m2:"கூலி கிடைக்காத நாட்கள்",m3:"வேலை இல்லாத நாட்கள்",m4:"மொத்த வருமானம்",m5:"கட்டணம்",m6:"சேமிப்பு (10%)",sw:"வேலை செய்தேன்",su:"வேலை செய்தேன், கூலி வரவில்லை",so:"வேலை இல்லை",rcd:"பதிவு: {t}",edn:"{n} முறை மாற்றம்",eb:"மாற்று",sb:"சேமி",cb:"ரத்து",lg:"மாற்ற விவரம்",la:"பதிவு",le:"மாற்றம்",nh:"இன்னும் பதிவுகள் இல்லை.",fin:"இறுதி",sofar:"இதுவரை",tc:"விதிமுறைகள், நிபந்தனைகள்",d1:"வேலை நாட்கள் (இந்த மாதம்)",
tcs:["வயது 16–59. வருமான வரி செலுத்தாத, EPFO/ESIC உறுப்பினர் அல்லாத அமைப்புசாரா தொழிலாளர்களுக்கு. ஆதார், அதனுடன் இணைந்த மொபைல் எண் தேவை. பதிவு இலவசம்.","வயது 18–40, மாத வருமானம் ₹15,000 வரை, EPFO/ESIC/NPS உறுப்பினராக இருக்கக் கூடாது. வயதுக்கு ஏற்ற மாதத் தொகையை வங்கி தானியங்கிப் பற்று மூலம் நீங்கள் செலுத்துவீர்கள், அரசும் அதே தொகையைச் செலுத்தும். செலுத்துவதை நிறுத்தினால் பலன்கள் பாதிக்கப்படலாம்.","PMJJBY: வயது 18–50, எந்தக் காரணத்தாலும் இறந்தால் ₹2 லட்சம். PMSBY: வயது 18–70, விபத்துக் காப்பீடு. இரண்டுக்கும் தானியங்கிப் பற்றுடன் வங்கிக் கணக்கு தேவை, ஆண்டுதோறும் புதுப்பிக்க வேண்டும். ஆண்டு பிரீமியம் சிறியது; தற்போதைய தொகையை வங்கியில் உறுதி செய்யுங்கள்.","தகுதி உங்கள் வேலையைப் பொறுத்ததல்ல; உங்கள் குடும்பம் மாநில/மத்திய பயனாளர் பட்டியலில் இருப்பதைப் பொறுத்தது. பட்டியலிடப்பட்ட மருத்துவமனைகளில் குடும்பத்துக்கு ஆண்டுக்கு ₹5 லட்சம் வரை. ஆயுஷ்மான் அட்டை பெற்று அரசு மையத்தில் தகுதியைப் பாருங்கள்.","பொதுவாக கடந்த 12 மாதங்களில் குறைந்தது 90 நாட்கள் வேலை செய்த 18–60 வயது கட்டுமானத் தொழிலாளர்களுக்கு. விதிகளும் பலன்களும் மாநிலத்துக்கு மாநிலம் மாறும், உங்கள் மாநில வாரியத்தில் உறுதி செய்யுங்கள்."]},
kn:{off:"😴 ಇಂದು ಕೆಲಸ ಇಲ್ಲ",tdw:"ಇಂದು: ಕೆಲಸ ಮಾಡಿದೆ, {a} ದಾಖಲಾಗಿದೆ",tdo:"ಇಂದು: ಕೆಲಸ ಇಲ್ಲ ಎಂದು ದಾಖಲಾಗಿದೆ",ed:"ಇನ್ನೂ {t} (ಗಂ:ನಿ) ವರೆಗೆ ಬದಲಿಸಬಹುದು.",lk:"🔒 ಲಾಕ್ ಆಗಿದೆ – 6 ಗಂಟೆ ಕಳೆದಿದೆ.",fe:"💳 ಈ ತಿಂಗಳ ಇದುವರೆಗಿನ ಶುಲ್ಕ: <b>{f}</b><small>₹10 × {n} ಕೂಲಿ ಸಿಕ್ಕ ದಿನ ÷ 30. ಕೂಲಿ ಸಿಗದ ದಿನ ಮತ್ತು ಕೆಲಸ ಇಲ್ಲದ ದಿನ ಉಚಿತ. ತಿಂಗಳ ಕೊನೆಯಲ್ಲಿ ಅಂತಿಮ ಮೊತ್ತ ತಿಳಿಯುತ್ತದೆ.</small>",fef:"💳 ಈ ತಿಂಗಳ ಶುಲ್ಕ: <b>ಉಚಿತ</b><small>ಮೊದಲ 3 ತಿಂಗಳು ಉಚಿತ. ಇದುವರೆಗೆ ಕೂಲಿ ಸಿಕ್ಕ ದಿನ: {n}.</small>",fr:"ಉಚಿತ",lc:"ನಿಮ್ಮ ರಾಜ್ಯ",s0:"ರಾಜ್ಯ ಆಯ್ಕೆಮಾಡಿ",s1:"ತೆಲಂಗಾಣ",s2:"ಇತರ ರಾಜ್ಯ",zn:"ನಿಮ್ಮ ಪ್ರದೇಶ",z1:"ಮಹಾನಗರ ಪಾಲಿಕೆ",z2:"ಪುರಸಭೆ",z3:"ಗ್ರಾಮೀಣ / ಪಟ್ಟಣ ಪಂಚಾಯಿತಿ",sk:"ಕೌಶಲ ಮಟ್ಟ",k1:"ಕೌಶಲರಹಿತ",k2:"ಅರೆ ಕೌಶಲ",k3:"ಕುಶಲ",k4:"ಹೆಚ್ಚು ಕುಶಲ",mwa:"ನಿಮಗೆ ಕನಿಷ್ಠ ಕೂಲಿ: <b>{w}</b> ದಿನಕ್ಕೆ (ತಿಂಗಳಿಗೆ {m} ÷ 26), ತೆಲಂಗಾಣದ 1 ಜೂನ್ 2026 ಆದೇಶದಂತೆ. ಪ್ರತಿ ಏಪ್ರಿಲ್, ಅಕ್ಟೋಬರ್‌ನಲ್ಲಿ ಬದಲಾಗುವ VDA ಹೆಚ್ಚುವರಿಯಾಗಿ ಸೇರಬಹುದು. ಕೃಷಿ ಮತ್ತು ಕೆಲವು ಕ್ಷೇತ್ರಗಳಿಗೆ ಬೇರೆ ದರಗಳಿವೆ.",mwo:"ಈ ರಾಜ್ಯದ ಸ್ವಯಂಚಾಲಿತ ದರಗಳು ಇನ್ನೂ ಇಲ್ಲ. ಕೆಳಗೆ ದಿನದ ಕನಿಷ್ಠ ಕೂಲಿಯನ್ನು ನೀವೇ ನಮೂದಿಸಿ, ಅಥವಾ ಸಹಾಯಕ/ಗ್ರಾಹಕ ಸೇವೆಯನ್ನು ಕೇಳಿ.",n4:"ಇತಿಹಾಸ",hi:"ಇತಿಹಾಸ",hs:"ಪ್ರತಿ ದಾಖಲೆ ಮತ್ತು ಪ್ರತಿ ಬದಲಾವಣೆ ಉಳಿಯುತ್ತದೆ. ದಾಖಲಿಸಿದ 6 ಗಂಟೆವರೆಗೆ ಬದಲಿಸಬಹುದು.",m1:"ಕೂಲಿ ಸಿಕ್ಕ ದಿನ",m2:"ಕೂಲಿ ಸಿಗದ ದಿನ",m3:"ಕೆಲಸ ಇಲ್ಲದ ದಿನ",m4:"ಒಟ್ಟು ಗಳಿಕೆ",m5:"ಶುಲ್ಕ",m6:"ಉಳಿತಾಯ (10%)",sw:"ಕೆಲಸ ಮಾಡಿದೆ",su:"ಕೆಲಸ ಮಾಡಿದೆ, ಕೂಲಿ ಸಿಗಲಿಲ್ಲ",so:"ಕೆಲಸ ಇಲ್ಲ",rcd:"ದಾಖಲು: {t}",edn:"{n} ಬಾರಿ ಬದಲಾಯಿಸಲಾಗಿದೆ",eb:"ಬದಲಿಸಿ",sb:"ಉಳಿಸಿ",cb:"ರದ್ದು",lg:"ಬದಲಾವಣೆಯ ವಿವರ",la:"ದಾಖಲು",le:"ಬದಲಾವಣೆ",nh:"ಇನ್ನೂ ದಾಖಲೆಗಳಿಲ್ಲ.",fin:"ಅಂತಿಮ",sofar:"ಇದುವರೆಗೆ",tc:"ನಿಯಮಗಳು ಮತ್ತು ಷರತ್ತುಗಳು",d1:"ಕೆಲಸದ ದಿನಗಳು (ಈ ತಿಂಗಳು)",
tcs:["ವಯಸ್ಸು 16–59. ಆದಾಯ ತೆರಿಗೆ ಪಾವತಿಸದ, EPFO/ESIC ಸದಸ್ಯರಲ್ಲದ ಅಸಂಘಟಿತ ಕಾರ್ಮಿಕರಿಗೆ. ಆಧಾರ್ ಮತ್ತು ಅದಕ್ಕೆ ಜೋಡಿಸಿದ ಮೊಬೈಲ್ ಸಂಖ್ಯೆ ಬೇಕು. ನೋಂದಣಿ ಉಚಿತ.","ವಯಸ್ಸು 18–40, ಮಾಸಿಕ ಆದಾಯ ₹15,000 ವರೆಗೆ, EPFO/ESIC/NPS ಸದಸ್ಯರಾಗಿರಬಾರದು. ವಯಸ್ಸಿಗೆ ತಕ್ಕ ಮಾಸಿಕ ಮೊತ್ತವನ್ನು ಬ್ಯಾಂಕ್ ಆಟೋ-ಡೆಬಿಟ್ ಮೂಲಕ ನೀವು ಕಟ್ಟುತ್ತೀರಿ, ಸರ್ಕಾರವೂ ಅಷ್ಟೇ ಮೊತ್ತ ಕಟ್ಟುತ್ತದೆ. ಕಟ್ಟುವುದನ್ನು ನಿಲ್ಲಿಸಿದರೆ ಲಾಭಗಳ ಮೇಲೆ ಪರಿಣಾಮವಾಗಬಹುದು.","PMJJBY: ವಯಸ್ಸು 18–50, ಯಾವುದೇ ಕಾರಣದ ಮರಣಕ್ಕೆ ₹2 ಲಕ್ಷ. PMSBY: ವಯಸ್ಸು 18–70, ಅಪಘಾತ ವಿಮೆ. ಎರಡಕ್ಕೂ ಆಟೋ-ಡೆಬಿಟ್ ಇರುವ ಬ್ಯಾಂಕ್ ಖಾತೆ ಬೇಕು, ಪ್ರತಿ ವರ್ಷ ನವೀಕರಿಸಬೇಕು. ವಾರ್ಷಿಕ ಪ್ರೀಮಿಯಂ ಚಿಕ್ಕದು; ಈಗಿನ ಮೊತ್ತವನ್ನು ಬ್ಯಾಂಕ್‌ನಲ್ಲಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ.","ಅರ್ಹತೆ ನಿಮ್ಮ ಕೆಲಸದ ಮೇಲಲ್ಲ, ನಿಮ್ಮ ಕುಟುಂಬ ರಾಜ್ಯ/ಕೇಂದ್ರ ಫಲಾನುಭವಿ ಪಟ್ಟಿಯಲ್ಲಿ ಇರುವುದರ ಮೇಲೆ ಅವಲಂಬಿತ. ಪಟ್ಟಿಯಲ್ಲಿರುವ ಆಸ್ಪತ್ರೆಗಳಲ್ಲಿ ಕುಟುಂಬಕ್ಕೆ ವರ್ಷಕ್ಕೆ ₹5 ಲಕ್ಷದವರೆಗೆ. ಆಯುಷ್ಮಾನ್ ಕಾರ್ಡ್ ಪಡೆದು ಸರ್ಕಾರಿ ಕೇಂದ್ರದಲ್ಲಿ ಅರ್ಹತೆ ನೋಡಿ.","ಸಾಮಾನ್ಯವಾಗಿ ಕಳೆದ 12 ತಿಂಗಳಲ್ಲಿ ಕನಿಷ್ಠ 90 ದಿನ ಕೆಲಸ ಮಾಡಿದ 18–60 ವರ್ಷದ ಕಟ್ಟಡ ಕಾರ್ಮಿಕರಿಗೆ. ನಿಯಮ ಮತ್ತು ಲಾಭಗಳು ರಾಜ್ಯಕ್ಕೆ ತಕ್ಕಂತೆ ಬದಲಾಗುತ್ತವೆ, ನಿಮ್ಮ ರಾಜ್ಯ ಮಂಡಳಿಯಲ್ಲಿ ಖಚಿತಪಡಿಸಿಕೊಳ್ಳಿ."]},
mr:{off:"😴 आज काम नाही",tdw:"आज: काम केले, {a} नोंदवले",tdo:"आज: काम नाही असे नोंदवले",ed:"आणखी {t} (तास:मि) पर्यंत बदलता येईल.",lk:"🔒 लॉक – 6 तास उलटले.",fe:"💳 या महिन्याचे आतापर्यंतचे शुल्क: <b>{f}</b><small>₹10 × {n} मजुरी मिळालेले दिवस ÷ 30. मजुरी न मिळालेले आणि काम नसलेले दिवस मोफत. महिना संपल्यावर अंतिम रक्कम ठरेल.</small>",fef:"💳 या महिन्याचे शुल्क: <b>मोफत</b><small>पहिले 3 महिने मोफत. आतापर्यंत मजुरी मिळालेले दिवस: {n}.</small>",fr:"मोफत",lc:"तुमचे राज्य",s0:"राज्य निवडा",s1:"तेलंगणा",s2:"इतर राज्य",zn:"तुमचे क्षेत्र",z1:"महानगरपालिका",z2:"नगरपालिका",z3:"ग्रामीण / नगर पंचायत",sk:"कौशल्य पातळी",k1:"अकुशल",k2:"अर्धकुशल",k3:"कुशल",k4:"उच्च कुशल",mwa:"तुमच्यासाठी किमान मजुरी: <b>{w}</b> प्रतिदिन (महिन्याचे {m} ÷ 26), तेलंगणाच्या 1 जून 2026 च्या आदेशानुसार. दर एप्रिल आणि ऑक्टोबरमध्ये बदलणारा VDA आणखी जोडला जाऊ शकतो. शेती आणि काही क्षेत्रांचे दर वेगळे आहेत.",mwo:"या राज्याचे दर अजून आपोआप उपलब्ध नाहीत. खाली दैनिक किमान मजुरी स्वतः टाका, किंवा सहाय्यक/ग्राहक सेवेला विचारा.",n4:"इतिहास",hi:"इतिहास",hs:"प्रत्येक नोंद आणि प्रत्येक बदल जतन होतो. नोंद केल्यानंतर 6 तासांपर्यंत बदलता येते.",m1:"मजुरी मिळालेले दिवस",m2:"मजुरी न मिळालेले दिवस",m3:"काम नसलेले दिवस",m4:"एकूण कमाई",m5:"शुल्क",m6:"बचत (10%)",sw:"काम केले",su:"काम केले, मजुरी मिळाली नाही",so:"काम नाही",rcd:"नोंद: {t}",edn:"{n} वेळा बदलले",eb:"बदला",sb:"सेव्ह",cb:"रद्द",lg:"बदलांची नोंद",la:"नोंद",le:"बदल",nh:"अजून नोंदी नाहीत.",fin:"अंतिम",sofar:"आतापर्यंत",tc:"अटी आणि शर्ती",d1:"कामाचे दिवस (या महिन्यात)",
tcs:["वय 16–59. आयकर न भरणाऱ्या आणि EPFO/ESIC सदस्य नसलेल्या असंघटित कामगारांसाठी. आधार आणि त्याला जोडलेला मोबाइल नंबर लागतो. नोंदणी मोफत आहे.","वय 18–40, मासिक उत्पन्न ₹15,000 पर्यंत, EPFO/ESIC/NPS सदस्य नसावे. वयानुसार ठरलेली मासिक रक्कम तुम्ही बँक ऑटो-डेबिटने भरता आणि सरकार तितकीच रक्कम भरते. भरणे थांबवल्यास लाभांवर परिणाम होऊ शकतो.","PMJJBY: वय 18–50, कोणत्याही कारणाने मृत्यू झाल्यास ₹2 लाख. PMSBY: वय 18–70, अपघात विमा. दोन्हीसाठी ऑटो-डेबिट असलेले बँक खाते लागते आणि दरवर्षी नूतनीकरण करावे लागते. वार्षिक प्रीमियम लहान आहे; सध्याची रक्कम बँकेत खात्री करा.","पात्रता तुमच्या कामावर नाही, तर तुमचे कुटुंब राज्य/केंद्राच्या लाभार्थी यादीत असण्यावर अवलंबून आहे. नोंदणीकृत रुग्णालयांत कुटुंबाला वर्षाला ₹5 लाखांपर्यंत. आयुष्मान कार्ड काढा आणि सरकारी केंद्रात पात्रता तपासा.","सहसा गेल्या 12 महिन्यांत किमान 90 दिवस काम केलेल्या 18–60 वयाच्या बांधकाम कामगारांसाठी. नियम आणि लाभ राज्यानुसार वेगळे असतात, तुमच्या राज्य मंडळाकडे खात्री करा."]},

tcs:["বয়স 16–59। আয়কর না দেওয়া এবং EPFO/ESIC-র সদস্য নন এমন অসংগঠিত শ্রমিকদের জন্য। আধার ও তার সঙ্গে যুক্ত মোবাইল নম্বর লাগবে। নিবন্ধন বিনামূল্যে।","বয়স 18–40, মাসিক আয় ₹15,000 পর্যন্ত, EPFO/ESIC/NPS-এর সদস্য নন। বয়স অনুযায়ী মাসিক অঙ্ক আপনি ব্যাংক অটো-ডেবিটে দেন, সরকারও সমান অঙ্ক দেয়। দেওয়া বন্ধ করলে সুবিধা প্রভাবিত হতে পারে।","PMJJBY: বয়স 18–50, যেকোনো কারণে মৃত্যুতে ₹2 লক্ষ। PMSBY: বয়স 18–70, দুর্ঘটনা বিমা। দুটোর জন্য অটো-ডেবিটসহ ব্যাংক অ্যাকাউন্ট লাগে এবং প্রতি বছর নবায়ন করতে হয়। বার্ষিক প্রিমিয়াম অল্প; বর্তমান অঙ্ক ব্যাংকে নিশ্চিত করুন।","যোগ্যতা আপনার কাজের উপর নয়, আপনার পরিবার রাজ্য/কেন্দ্রের সুবিধাভোগী তালিকায় আছে কি না তার উপর নির্ভর করে। তালিকাভুক্ত হাসপাতালে পরিবার প্রতি বছর ₹5 লক্ষ পর্যন্ত। আয়ুষ্মান কার্ড নিন এবং সরকারি কেন্দ্রে যোগ্যতা দেখুন।","সাধারণত গত 12 মাসে অন্তত 90 দিন কাজ করা 18–60 বছরের নির্মাণ শ্রমিকদের জন্য। নিয়ম ও সুবিধা রাজ্যভেদে আলাদা, আপনার রাজ্য পর্ষদে নিশ্চিত করুন।"]},

tcs:["ବୟସ 16–59। ଆୟକର ନଦେଉଥିବା ଏବଂ EPFO/ESIC ସଦସ୍ୟ ନଥିବା ଅସଂଗଠିତ ଶ୍ରମିକଙ୍କ ପାଇଁ। ଆଧାର ଓ ତାହା ସହ ଯୋଡ଼ା ମୋବାଇଲ୍ ନମ୍ବର ଦରକାର। ପଞ୍ଜୀକରଣ ମାଗଣା।","ବୟସ 18–40, ମାସିକ ଆୟ ₹15,000 ପର୍ଯ୍ୟନ୍ତ, EPFO/ESIC/NPS ସଦସ୍ୟ ନହେବା। ବୟସ ଅନୁସାରେ ମାସିକ ରାଶି ଆପଣ ବ୍ୟାଙ୍କ୍ ଅଟୋ-ଡେବିଟ୍ ଦ୍ୱାରା ଦିଅନ୍ତି, ସରକାର ସମାନ ରାଶି ଦିଅନ୍ତି। ଦେବା ବନ୍ଦ କଲେ ସୁବିଧା ପ୍ରଭାବିତ ହୋଇପାରେ।","PMJJBY: ବୟସ 18–50, ଯେକୌଣସି କାରଣରୁ ମୃତ୍ୟୁ ହେଲେ ₹2 ଲକ୍ଷ। PMSBY: ବୟସ 18–70, ଦୁର୍ଘଟଣା ବୀମା। ଦୁଇଟି ପାଇଁ ଅଟୋ-ଡେବିଟ୍ ସହ ବ୍ୟାଙ୍କ୍ ଖାତା ଦରକାର ଏବଂ ପ୍ରତି ବର୍ଷ ନବୀକରଣ କରିବାକୁ ହେବ। ବାର୍ଷିକ ପ୍ରିମିୟମ୍ ଛୋଟ; ବର୍ତ୍ତମାନର ରାଶି ବ୍ୟାଙ୍କରେ ନିଶ୍ଚିତ କରନ୍ତୁ।","ଯୋଗ୍ୟତା ଆପଣଙ୍କ କାମ ଉପରେ ନୁହେଁ, ଆପଣଙ୍କ ପରିବାର ରାଜ୍ୟ/କେନ୍ଦ୍ର ହିତାଧିକାରୀ ତାଲିକାରେ ଥିବା ଉପରେ ନିର୍ଭର କରେ। ତାଲିକାଭୁକ୍ତ ହସ୍ପିଟାଲରେ ପରିବାରକୁ ବର୍ଷକୁ ₹5 ଲକ୍ଷ ପର୍ଯ୍ୟନ୍ତ। ଆୟୁଷ୍ମାନ କାର୍ଡ ନିଅନ୍ତୁ ଏବଂ ସରକାରୀ କେନ୍ଦ୍ରରେ ଯୋଗ୍ୟତା ଦେଖନ୍ତୁ।","ସାଧାରଣତଃ ଗତ 12 ମାସରେ ଅତିକମରେ 90 ଦିନ କାମ କରିଥିବା 18–60 ବର୍ଷର ନିର୍ମାଣ ଶ୍ରମିକଙ୍କ ପାଇଁ। ନିୟମ ଓ ସୁବିଧା ରାଜ୍ୟ ଅନୁସାରେ ଭିନ୍ନ, ଆପଣଙ୍କ ରାଜ୍ୟ ବୋର୍ଡରେ ନିଶ୍ଚିତ କରନ୍ତୁ।"]},

tcs:["വയസ്സ് 16–59. ആദായനികുതി അടയ്ക്കാത്ത, EPFO/ESIC അംഗമല്ലാത്ത അസംഘടിത തൊഴിലാളികൾക്ക്. ആധാറും അതുമായി ബന്ധിപ്പിച്ച മൊബൈൽ നമ്പറും വേണം. രജിസ്ട്രേഷൻ സൗജന്യം.","വയസ്സ് 18–40, പ്രതിമാസ വരുമാനം ₹15,000 വരെ, EPFO/ESIC/NPS അംഗമാകരുത്. വയസ്സിനനുസരിച്ചുള്ള പ്രതിമാസ തുക ബാങ്ക് ഓട്ടോ-ഡെബിറ്റ് വഴി നിങ്ങൾ അടയ്ക്കും, സർക്കാരും അതേ തുക അടയ്ക്കും. അടവ് നിർത്തിയാൽ ആനുകൂല്യങ്ങളെ ബാധിക്കാം.","PMJJBY: വയസ്സ് 18–50, ഏതു കാരണത്താലും മരിച്ചാൽ ₹2 ലക്ഷം. PMSBY: വയസ്സ് 18–70, അപകട ഇൻഷുറൻസ്. രണ്ടിനും ഓട്ടോ-ഡെബിറ്റ് ഉള്ള ബാങ്ക് അക്കൗണ്ട് വേണം, എല്ലാ വർഷവും പുതുക്കണം. വാർഷിക പ്രീമിയം ചെറുതാണ്; ഇപ്പോഴത്തെ തുക ബാങ്കിൽ ഉറപ്പാക്കുക.","യോഗ്യത നിങ്ങളുടെ ജോലിയെ അല്ല, നിങ്ങളുടെ കുടുംബം സംസ്ഥാന/കേന്ദ്ര ഗുണഭോക്തൃ പട്ടികയിൽ ഉണ്ടോ എന്നതിനെ ആശ്രയിച്ചാണ്. പട്ടികയിലുള്ള ആശുപത്രികളിൽ കുടുംബത്തിന് വർഷം ₹5 ലക്ഷം വരെ. ആയുഷ്മാൻ കാർഡ് എടുത്ത് സർക്കാർ കേന്ദ്രത്തിൽ യോഗ്യത പരിശോധിക്കുക.","സാധാരണയായി കഴിഞ്ഞ 12 മാസത്തിൽ കുറഞ്ഞത് 90 ദിവസം പണിയെടുത്ത 18–60 വയസ്സുള്ള നിർമ്മാണ തൊഴിലാളികൾക്ക്. നിയമങ്ങളും ആനുകൂല്യങ്ങളും സംസ്ഥാനം അനുസരിച്ച് വ്യത്യസ്തമാണ്, നിങ്ങളുടെ സംസ്ഥാന ബോർഡിൽ ഉറപ്പാക്കുക."]},
gu:{off:"😴 આજે કામ નથી",tdw:"આજે: કામ કર્યું, {a} નોંધાયું",tdo:"આજે: કામ નથી એવું નોંધાયું",ed:"હજુ {t} (કલાક:મિનિટ) સુધી બદલી શકો.",lk:"🔒 લૉક – 6 કલાક વીતી ગયા.",fe:"💳 આ મહિનાની અત્યાર સુધીની ફી: <b>{f}</b><small>₹10 × {n} મજૂરી મળેલા દિવસ ÷ 30. મજૂરી ન મળેલા અને કામ વગરના દિવસ મફત. મહિનાના અંતે અંતિમ રકમ નક્કી થશે.</small>",fef:"💳 આ મહિનાની ફી: <b>મફત</b><small>પહેલા 3 મહિના મફત. અત્યાર સુધી મજૂરી મળેલા દિવસ: {n}.</small>",fr:"મફત",lc:"તમારું રાજ્ય",s0:"રાજ્ય પસંદ કરો",s1:"તેલંગાણા",s2:"અન્ય રાજ્ય",zn:"તમારો વિસ્તાર",z1:"મહાનગરપાલિકા",z2:"નગરપાલિકા",z3:"ગ્રામીણ / નગર પંચાયત",sk:"કૌશલ્ય સ્તર",k1:"અકુશળ",k2:"અર્ધકુશળ",k3:"કુશળ",k4:"અતિ કુશળ",mwa:"તમારા માટે લઘુતમ મજૂરી: <b>{w}</b> દરરોજ (મહિને {m} ÷ 26), તેલંગાણાના 1 જૂન 2026ના આદેશ મુજબ. દર એપ્રિલ અને ઑક્ટોબરમાં બદલાતું VDA વધારે ઉમેરાઈ શકે છે. ખેતી અને કેટલાક ક્ષેત્રોના દર અલગ છે.",mwo:"આ રાજ્યના દર હજી આપોઆપ ઉપલબ્ધ નથી. નીચે દૈનિક લઘુતમ મજૂરી જાતે નાખો, અથવા સહાયક/કસ્ટમર કેરને પૂછો.",n4:"ઇતિહાસ",hi:"ઇતિહાસ",hs:"દરેક નોંધ અને દરેક ફેરફાર સચવાય છે. નોંધ્યાના 6 કલાક સુધી બદલી શકાય.",m1:"મજૂરી મળેલા દિવસ",m2:"મજૂરી ન મળેલા દિવસ",m3:"કામ વગરના દિવસ",m4:"કુલ કમાણી",m5:"ફી",m6:"બચત (10%)",sw:"કામ કર્યું",su:"કામ કર્યું, મજૂરી મળી નથી",so:"કામ નથી",rcd:"નોંધ: {t}",edn:"{n} વાર બદલ્યું",eb:"બદલો",sb:"સેવ",cb:"રદ",lg:"ફેરફારની વિગત",la:"નોંધ",le:"ફેરફાર",nh:"હજી કોઈ રેકોર્ડ નથી.",fin:"અંતિમ",sofar:"અત્યાર સુધી",tc:"નિયમો અને શરતો",d1:"કામના દિવસો (આ મહિનામાં)",
tcs:["ઉંમર 16–59. આવકવેરો ન ભરતા અને EPFO/ESICના સભ્ય ન હોય તેવા અસંગઠિત કામદારો માટે. આધાર અને તેની સાથે જોડાયેલો મોબાઇલ નંબર જોઈએ. નોંધણી મફત છે.","ઉંમર 18–40, માસિક આવક ₹15,000 સુધી, EPFO/ESIC/NPSના સભ્ય ન હોવા જોઈએ. ઉંમર પ્રમાણેની માસિક રકમ તમે બેંક ઑટો-ડેબિટથી ભરો છો અને સરકાર એટલી જ રકમ ભરે છે. ભરવાનું બંધ કરો તો લાભ પર અસર થઈ શકે.","PMJJBY: ઉંમર 18–50, કોઈ પણ કારણે મૃત્યુ થાય તો ₹2 લાખ. PMSBY: ઉંમર 18–70, અકસ્માત વીમો. બંને માટે ઑટો-ડેબિટવાળું બેંક ખાતું જોઈએ અને દર વર્ષે નવીકરણ કરવું પડે. વાર્ષિક પ્રીમિયમ નાનું છે; હાલની રકમ બેંકમાં ખાતરી કરો.","પાત્રતા તમારા કામ પર નહીં, પણ તમારું કુટુંબ રાજ્ય/કેન્દ્રની લાભાર્થી યાદીમાં હોય તેના પર આધારિત છે. યાદીબદ્ધ હોસ્પિટલોમાં કુટુંબને વર્ષે ₹5 લાખ સુધી. આયુષ્માન કાર્ડ કઢાવો અને સરકારી કેન્દ્રમાં પાત્રતા તપાસો.","સામાન્ય રીતે છેલ્લા 12 મહિનામાં ઓછામાં ઓછા 90 દિવસ કામ કરેલા 18–60 વર્ષના બાંધકામ કામદારો માટે. નિયમો અને લાભ રાજ્ય પ્રમાણે જુદા છે, તમારા રાજ્ય બોર્ડમાં ખાતરી કરો."]},

tcs:["ਉਮਰ 16–59। ਆਮਦਨ ਕਰ ਨਾ ਭਰਨ ਵਾਲੇ ਅਤੇ EPFO/ESIC ਦੇ ਮੈਂਬਰ ਨਾ ਹੋਣ ਵਾਲੇ ਗ਼ੈਰ-ਸੰਗਠਿਤ ਕਾਮਿਆਂ ਲਈ। ਆਧਾਰ ਅਤੇ ਉਸ ਨਾਲ ਜੁੜਿਆ ਮੋਬਾਈਲ ਨੰਬਰ ਚਾਹੀਦਾ ਹੈ। ਰਜਿਸਟ੍ਰੇਸ਼ਨ ਮੁਫ਼ਤ ਹੈ।","ਉਮਰ 18–40, ਮਾਸਿਕ ਆਮਦਨ ₹15,000 ਤੱਕ, EPFO/ESIC/NPS ਦੇ ਮੈਂਬਰ ਨਾ ਹੋਵੋ। ਉਮਰ ਅਨੁਸਾਰ ਮਾਸਿਕ ਰਕਮ ਤੁਸੀਂ ਬੈਂਕ ਆਟੋ-ਡੈਬਿਟ ਰਾਹੀਂ ਭਰਦੇ ਹੋ ਅਤੇ ਸਰਕਾਰ ਓਨੀ ਹੀ ਰਕਮ ਭਰਦੀ ਹੈ। ਭਰਨਾ ਬੰਦ ਕਰਨ ਨਾਲ ਲਾਭਾਂ 'ਤੇ ਅਸਰ ਪੈ ਸਕਦਾ ਹੈ।","PMJJBY: ਉਮਰ 18–50, ਕਿਸੇ ਵੀ ਕਾਰਨ ਮੌਤ ਹੋਣ 'ਤੇ ₹2 ਲੱਖ। PMSBY: ਉਮਰ 18–70, ਹਾਦਸਾ ਬੀਮਾ। ਦੋਵਾਂ ਲਈ ਆਟੋ-ਡੈਬਿਟ ਵਾਲਾ ਬੈਂਕ ਖਾਤਾ ਚਾਹੀਦਾ ਹੈ ਅਤੇ ਹਰ ਸਾਲ ਨਵਿਆਉਣਾ ਪੈਂਦਾ ਹੈ। ਸਾਲਾਨਾ ਪ੍ਰੀਮੀਅਮ ਛੋਟਾ ਹੈ; ਮੌਜੂਦਾ ਰਕਮ ਬੈਂਕ ਤੋਂ ਪੱਕੀ ਕਰੋ।","ਯੋਗਤਾ ਤੁਹਾਡੇ ਕੰਮ 'ਤੇ ਨਹੀਂ, ਸਗੋਂ ਤੁਹਾਡਾ ਪਰਿਵਾਰ ਰਾਜ/ਕੇਂਦਰ ਦੀ ਲਾਭਪਾਤਰੀ ਸੂਚੀ ਵਿੱਚ ਹੋਣ 'ਤੇ ਨਿਰਭਰ ਹੈ। ਸੂਚੀਬੱਧ ਹਸਪਤਾਲਾਂ ਵਿੱਚ ਪਰਿਵਾਰ ਨੂੰ ਸਾਲ ਵਿੱਚ ₹5 ਲੱਖ ਤੱਕ। ਆਯੁਸ਼ਮਾਨ ਕਾਰਡ ਬਣਵਾਓ ਅਤੇ ਸਰਕਾਰੀ ਕੇਂਦਰ ਵਿੱਚ ਯੋਗਤਾ ਜਾਂਚੋ।","ਆਮ ਤੌਰ 'ਤੇ ਪਿਛਲੇ 12 ਮਹੀਨਿਆਂ ਵਿੱਚ ਘੱਟੋ-ਘੱਟ 90 ਦਿਨ ਕੰਮ ਕਰਨ ਵਾਲੇ 18–60 ਸਾਲ ਦੇ ਉਸਾਰੀ ਕਾਮਿਆਂ ਲਈ। ਨਿਯਮ ਅਤੇ ਲਾਭ ਰਾਜ ਅਨੁਸਾਰ ਵੱਖਰੇ ਹਨ, ਆਪਣੇ ਰਾਜ ਬੋਰਡ ਤੋਂ ਪੁਸ਼ਟੀ ਕਰੋ।"]},

tcs:["বয়স 16–59। আয়কৰ নিদিয়া আৰু EPFO/ESICৰ সদস্য নোহোৱা অসংগঠিত শ্ৰমিকৰ বাবে। আধাৰ আৰু ইয়াৰ সৈতে সংযুক্ত মোবাইল নম্বৰ লাগিব। পঞ্জীয়ন বিনামূলীয়া।","বয়স 18–40, মাহিলী আয় ₹15,000লৈকে, EPFO/ESIC/NPSৰ সদস্য নহয়। বয়স অনুসৰি মাহিলী ধন আপুনি বেংক অটো-ডেবিটেৰে দিয়ে আৰু চৰকাৰেও সমান ধন দিয়ে। দিয়া বন্ধ কৰিলে সুবিধাত প্ৰভাৱ পৰিব পাৰে।","PMJJBY: বয়স 18–50, যিকোনো কাৰণত মৃত্যু হ'লে ₹2 লাখ। PMSBY: বয়স 18–70, দুৰ্ঘটনা বীমা। দুয়োটাৰ বাবে অটো-ডেবিট থকা বেংক একাউণ্ট লাগে আৰু প্ৰতি বছৰে নবীকৰণ কৰিব লাগে। বছৰেকীয়া প্ৰিমিয়াম সৰু; বৰ্তমানৰ পৰিমাণ বেংকত নিশ্চিত কৰক।","যোগ্যতা আপোনাৰ কামৰ ওপৰত নহয়, আপোনাৰ পৰিয়াল ৰাজ্য/কেন্দ্ৰৰ হিতাধিকাৰী তালিকাত থকাৰ ওপৰত নিৰ্ভৰ কৰে। তালিকাভুক্ত হাস্পতালত পৰিয়ালক বছৰি ₹5 লাখলৈকে। আয়ুষ্মান কাৰ্ড লওক আৰু চৰকাৰী কেন্দ্ৰত যোগ্যতা চাওক।","সাধাৰণতে যোৱা 12 মাহত অতি কমেও 90 দিন কাম কৰা 18–60 বছৰৰ নিৰ্মাণ শ্ৰমিকৰ বাবে। নিয়ম আৰু সুবিধা ৰাজ্য অনুসৰি বেলেগ, আপোনাৰ ৰাজ্যৰ ব'ৰ্ডত নিশ্চিত কৰক।"]}

tcs:["उमिर 16–59। आयकर ना देवे वाला आ EPFO/ESIC के सदस्य ना रहे वाला असंगठित मजूर खातिर। आधार आ ओकरा से जुड़ल मोबाइल नंबर चाहीं। पंजीकरण मुफ्त बा।","उमिर 18–40, महीना के आमदनी ₹15,000 तक, EPFO/ESIC/NPS के सदस्य ना होखे के चाहीं। उमिर के हिसाब से तय महीना के रकम रउआ बैंक ऑटो-डेबिट से देनी आ सरकारो ओतने रकम देले। भुगतान रोकला पर लाभ पर असर पड़ सकेला।","PMJJBY: उमिर 18–50, कवनो कारन से मउवत पर ₹2 लाख। PMSBY: उमिर 18–70, दुर्घटना बीमा। दूनो खातिर ऑटो-डेबिट वाला बैंक खाता चाहीं आ हर साल नवीनीकरण करे के पड़ेला। सालाना प्रीमियम छोट बा; अबहीं के रकम बैंक से पक्का कर लीं।","पात्रता रउआ के काम पर ना, रउआ के परिवार के राज्य/केंद्र के लाभार्थी सूची में रहे पर निर्भर करेला। सूची वाला अस्पताल में परिवार के साल में ₹5 लाख तक। आयुष्मान कार्ड बनवाईं आ सरकारी केंद्र पर पात्रता जाँच लीं।","आमतौर पर पिछला 12 महीना में कम से कम 90 दिन काम कइल 18–60 बरिस के निर्माण मजूर खातिर। नियम आ लाभ राज्य के हिसाब से अलग बा, आपन राज्य बोर्ड से पक्का कर लीं।"],
it1:"श्रम मित्र में रउआ के स्वागत बा",ib1:"दिहाड़ी मजूर खातिर एगो सहायक। आपन काम आ मजूरी के रिकॉर्ड रखीं, आपन अधिकार जानीं आ सरकारी योजना खोजीं – आपन भाषा में।",it2:"ई कइसे काम करेला",ib2:"रोज आपन मजूरी दर्ज करीं भा काम ना रहे वाला दिन चुनीं। ऐप रउआ के मजूरी के न्यूनतम मजूरी से मिलाके नियम देखावेला। सिकायत करे के बा कि ना, ई हमेशा रउआ के मर्जी ह। वॉइस सहायक से कुछुओ पूछीं; जरूरत पड़ी त कवनो आदमी मदद करी।",it3:"सही आ निजी",ib3:"रउआ ओही दिन खातिर भुगतान करीं जवना दिन मजूरी मिलल: 30 दिन के ₹10, एहसे बिना भुगतान आ काम बिना के दिन मुफ्त बा, आ पहिला 3 महीना भी मुफ्त। रउआ के रिकॉर्ड रउआ के फोन में सेव रहेला।",nx:"आगे",skp:"छोड़ीं",go:"शुरू करीं",ab:"ℹ ऐप के बारे में",

n5:"काम के अधिकार",wr_t:"काम के हालात",wr_s:"जानीं कि सही आ सुरक्षित काम के जगह कइसन होला।",wr_c:"रउआ के काम के जगह पर जवन सही बा ओकरा पर टिक करीं। जवन लागू ना होखे ओकरा छोड़ दीं।",wr_b:"हमार काम के जगह जाँचीं",wr_ok:"रउआ जवन टिक कइनी, सब मानक के हिसाब से बा। अइसहीं बनवले रहीं।",wr_no:"एह बात सब के फेर से देखीं:",wr_h:"अगिला कदम: पहिले नरमी से कहीं। बदलाव ना होखे त आपन जिला श्रम दफ्तर भा जिला विधिक सेवा प्राधिकरण (मुफ्त कानूनी मदद मिल सकेला) से संपर्क करीं, भा कस्टमर केयर के कॉल करीं। सिकायत करे के बा कि ना, ई हमेशा रउआ के मर्जी ह।",wr_src:"भारत के श्रम संहिता पर आधारित, OSH संहिता समेत (केंद्रीय नियम 8 मई 2026 के अधिसूचित)। रउआ के राज्य के आपन नियम हो सकेला।",
wr:[["हम दिन में 8 घंटा से जादा काम ना करेनी","दिहाड़ी मजूर खातिर आम काम दिन में 8 घंटा आ हफ्ता में 48 घंटा तक ह।"],["जादा घंटा हमार मर्जी से, दुगुना भुगतान","आम घंटा से जादा काम खातिर रउआ के सहमति चाहीं आ भुगतान आम दर से कम से कम दुगुना होखे के चाहीं।"],["हमरा हफ्ता में एक दिन आराम मिलेला","मजूर के हफ्ता में कम से कम एक दिन आराम के हक बा। तनखाह वाला छुट्टी के बारे में आपन राज्य के नियम पूछीं।"],["खतरा वाला काम खातिर सुरक्षा के सामान मिलेला","ऊँचाई, मशीन भा खुदाई जइसन खतरा वाला काम में मालिक के सुरक्षा के सामान आ सुरक्षित जगह देवे के चाहीं। असुरक्षित हालात के खबर करीं।"],["पीए के पानी, शौचालय आ साफ, अँजोर वाला जगह बा","साफ पीए के पानी, शौचालय आ साफ, अँजोर वाला काम के जगह जरूरी बा। बड़ जगह पर आराम कमरा आ कैंटीन जइसन सुविधा भी होखे के चाहीं।"],["एहिजा मेहरारू सुरक्षित काम करेली आ बराबर मजूरी पावेली","एके काम खातिर मेहरारू के मरद के बराबर मजूरी मिले के चाहीं। रात के काम खाली मेहरारू के सहमति आ बढ़िया अँजोर, सुरक्षित आवाजाही जइसन इंतजाम संगे।"],["एहिजा 14 बरिस से कम उमिर के कवनो लइका काम ना करेला","14 बरिस से कम उमिर के लइका से काम ना करवावल जा सकेला, आ 18 बरिस से कम उमिर के लोग खतरनाक काम ना करसु।"],["केहू घायल हो जाला त इलाज आ मदद मिलेला","काम पर चोट लागे त पहिले इलाज करावीं। तारीख, जगह आ केकरा देखल ई लिख लीं। रउआ मुआवजा के हक हो सकेला।"]],

gh:"कइसे इस्तेमाल करीं",bk:"पाछे",gt1:"आपन भाषा चुनीं",gb1:"ऊपर दहिना ओर के भाषा मेनू इस्तेमाल करीं। पूरा ऐप बदल जाला। कवनो कार्ड पर 🔊 दबाईं त ऐप ओकरा पढ़के सुना देला।",gt2:"आपन दिन दर्ज करीं",gb2:"मजूरी टैब में आज जेतना मजूरी मिलल ऊ लिखीं (काम कइनी बाकिर कुछ ना मिलल त 0 लिखीं) आ सेव दबाईं। काम ना रहे त 😴 बटन दबाईं। 6 घंटा तक बदल सकेनी।",gt3:"आपन राज्य चुनीं",gb3:"दर्ज के नीचे आपन राज्य चुनीं। तेलंगाना के न्यूनतम मजूरी अपने-आप भर जाला। दोसर राज्य खातिर अपने लिखीं। कम मिलल होखे त ऐप चेतावनी देला।",gt4:"आपन इतिहास देखीं",gb4:"इतिहास टैब में हर दिन, हर बदलाव आ हर महीना के कुल देखाला। रउआ ओही दिन के भुगतान करीं जवना दिन मजूरी मिलल; बिना भुगतान आ काम बिना के दिन मुफ्त बा।",gt5:"अधिकार, योजना आ मदद",gb5:"काम के अधिकार: आपन काम के जगह पर जवन सही बा ओकरा पर टिक करीं। योजना: अरजी देवे से पहिले नियम पढ़ीं। मदद: माइक दबाके आपन भाषा में पूछीं, भा कवनो आदमी के कॉल करीं।"},

tcs:["उमर 16–59। आयकर कोनी भरण वाळा अर EPFO/ESIC रा सदस्य कोनी हुवण वाळा असंगठित मजदूरां सारू। आधार अर उण सूं जुड़्योड़ो मोबाइल नंबर चाईजै। पंजीकरण मुफ्त है।","उमर 18–40, महीनै री कमाई ₹15,000 तांई, EPFO/ESIC/NPS रा सदस्य नीं हुवै। उमर मुजब तय महीनै री रकम थे बैंक ऑटो-डेबिट सूं देवो अर सरकार भी उत्ती ई रकम देवै। भुगतान रोकण सूं लाभ माथै असर पड़ सके है।","PMJJBY: उमर 18–50, किणी भी कारण सूं मौत माथै ₹2 लाख। PMSBY: उमर 18–70, दुर्घटना बीमो। दोनां सारू ऑटो-डेबिट वाळो बैंक खातो चाईजै अर हर बरस नवीनीकरण करणो पड़ै। सालाना प्रीमियम छोटो है; अबार री रकम बैंक सूं पक्की कर लो।","पात्रता थांरै काम माथै कोनी, थांरो परिवार राज्य/केंद्र री लाभार्थी सूची में हुवै जद ई निर्भर है। सूचीबद्ध अस्पतालां में परिवार नै साल में ₹5 लाख तांई। आयुष्मान कार्ड बणवावो अर सरकारी केंद्र माथै पात्रता जांच लो।","आम तौर माथै पिछला 12 महीनां में कम सूं कम 90 दिन काम करण वाळा 18–60 बरस रा निर्माण मजदूरां सारू। नियम अर लाभ राज्य मुजब न्यारा है, आपरै राज्य बोर्ड सूं पक्को कर लो।"],
it1:"श्रम मित्र में थांरो स्वागत है",ib1:"दिहाड़ी मजदूरां सारू एक सहायक। आपरै काम अर मजूरी रो रिकॉर्ड राखो, आपरा अधिकार जाणो अर सरकारी योजनावां खोजो – आपरी भाषा में।",it2:"ओ कियां काम करै है",ib2:"रोजीना आपरी मजूरी दर्ज करो या काम नीं हुवण वाळो दिन चुणो। ऐप थांरी मजूरी नै न्यूनतम मजूरी सूं मिळाय'र नियम दिखावै है। सिकायत करणी है कै कोनी, ओ हमेशा थांरी मरजी है। वॉइस सहायक सूं कीं भी पूछो; जरूरत पड़ै तो कोई मिनख मदद करसी।",it3:"ठीक अर निजी",ib3:"थे उणी दिनां रो भुगतान करो जिण दिन मजूरी मिली: 30 दिन रा ₹10, इण खातर बिना भुगतान अर बिना काम रा दिन मुफ्त है, अर पैला 3 महीना भी मुफ्त। थांरा रिकॉर्ड थांरै फोन में सेव रैवै है।",nx:"आगै",skp:"छोड़ो",go:"शुरू करो",ab:"ℹ ऐप रै बारै में",

te:{it1:"శ్రమ మిత్రకు స్వాగతం",ib1:"రోజువారీ కూలీల కోసం ఒక సహాయకుడు. మీ పని, కూలీ రికార్డు ఉంచుకోండి, మీ హక్కులు తెలుసుకోండి, ప్రభుత్వ పథకాలు కనుగొనండి – మీ భాషలోనే.",it2:"ఇది ఎలా పనిచేస్తుంది",ib2:"ప్రతి రోజు మీ కూలీ నమోదు చేయండి లేదా పని లేదని గుర్తించండి. యాప్ మీ కూలీని కనీస కూలీతో పోల్చి, నియమం చూపిస్తుంది. ఫిర్యాదు చేయాలా వద్దా అనేది ఎల్లప్పుడూ మీ ఇష్టం. వాయిస్ సహాయకుడిని ఏదైనా అడగండి; అవసరమైతే ఒక వ్యక్తి సహాయం చేస్తారు.",it3:"న్యాయమైనది, ప్రైవేట్",ib3:"కూలీ వచ్చిన రోజులకే మీరు చెల్లిస్తారు: 30 రోజులకు ₹10, కాబట్టి డబ్బు రాని రోజులు, పని లేని రోజులు ఉచితం, మొదటి 3 నెలలు కూడా ఉచితం. మీ రికార్డులు మీ ఫోన్‌లోనే ఉంటాయి.",nx:"తర్వాత",skp:"దాటవేయండి",go:"ప్రారంభించండి",ab:"ℹ యాప్ గురించి"},

hi:{it1:"श्रम मित्र में आपका स्वागत है",ib1:"दिहाड़ी मज़दूरों के लिए एक सहायक। अपने काम और मज़दूरी का रिकॉर्ड रखें, अपने अधिकार जानें और सरकारी योजनाएँ खोजें – अपनी भाषा में।",it2:"यह कैसे काम करता है",ib2:"हर दिन अपनी मज़दूरी दर्ज करें या काम न होने का दिन चुनें। ऐप आपकी मज़दूरी की तुलना न्यूनतम मज़दूरी से करके नियम दिखाता है। शिकायत करना या नहीं, यह हमेशा आपकी मर्ज़ी है। वॉइस सहायक से कुछ भी पूछें; ज़रूरत हो तो कोई व्यक्ति मदद करेगा।",it3:"निष्पक्ष और निजी",ib3:"आप सिर्फ़ उन्हीं दिनों का भुगतान करते हैं जिनकी मज़दूरी मिली: 30 दिन के ₹10, इसलिए बिना भुगतान और काम-रहित दिन मुफ़्त हैं, और पहले 3 महीने भी मुफ़्त हैं। आपके रिकॉर्ड आपके फ़ोन में सेव रहते हैं।",nx:"आगे",skp:"छोड़ें",go:"शुरू करें",ab:"ℹ ऐप के बारे में"},
ta:{it1:"ஸ்ரம் மித்ராவுக்கு வரவேற்பு",ib1:"தினக்கூலித் தொழிலாளர்களுக்கான உதவியாளர். உங்கள் வேலை, கூலியைப் பதிவு செய்யுங்கள், உரிமைகளை அறியுங்கள், அரசுத் திட்டங்களைக் கண்டறியுங்கள் – உங்கள் மொழியிலேயே.",it2:"இது எப்படி வேலை செய்கிறது",ib2:"ஒவ்வொரு நாளும் உங்கள் கூலியை உள்ளிடுங்கள் அல்லது வேலை இல்லாத நாளாகக் குறியுங்கள். ஆப் உங்கள் கூலியை குறைந்தபட்ச கூலியுடன் ஒப்பிட்டு விதியைக் காட்டும். புகார் செய்வதா வேண்டாமா என்பது எப்போதும் உங்கள் விருப்பம். குரல் உதவியாளரிடம் எதையும் கேளுங்கள்; தேவைப்பட்டால் ஒருவர் உதவுவார்.",it3:"நியாயமானது, தனிப்பட்டது",ib3:"கூலி கிடைத்த நாட்களுக்கு மட்டுமே கட்டணம்: 30 நாளுக்கு ₹10, எனவே கூலி கிடைக்காத நாட்களும் வேலை இல்லாத நாட்களும் இலவசம், முதல் 3 மாதங்களும் இலவசம். உங்கள் பதிவுகள் உங்கள் போனிலேயே சேமிக்கப்படும்.",nx:"அடுத்து",skp:"தவிர்",go:"தொடங்குங்கள்",ab:"ℹ ஆப் பற்றி"},
kn:{it1:"ಶ್ರಮ ಮಿತ್ರಕ್ಕೆ ಸ್ವಾಗತ",ib1:"ದಿನಗೂಲಿ ಕಾರ್ಮಿಕರಿಗೆ ಒಬ್ಬ ಸಹಾಯಕ. ನಿಮ್ಮ ಕೆಲಸ ಮತ್ತು ಕೂಲಿಯ ದಾಖಲೆ ಇಡಿ, ನಿಮ್ಮ ಹಕ್ಕುಗಳನ್ನು ತಿಳಿಯಿರಿ, ಸರ್ಕಾರಿ ಯೋಜನೆಗಳನ್ನು ಹುಡುಕಿ – ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲೇ.",it2:"ಇದು ಹೇಗೆ ಕೆಲಸ ಮಾಡುತ್ತದೆ",ib2:"ಪ್ರತಿ ದಿನ ನಿಮ್ಮ ಕೂಲಿ ನಮೂದಿಸಿ ಅಥವಾ ಕೆಲಸ ಇಲ್ಲದ ದಿನ ಎಂದು ಗುರುತಿಸಿ. ಆ್ಯಪ್ ನಿಮ್ಮ ಕೂಲಿಯನ್ನು ಕನಿಷ್ಠ ಕೂಲಿಯೊಂದಿಗೆ ಹೋಲಿಸಿ ನಿಯಮ ತೋರಿಸುತ್ತದೆ. ದೂರು ನೀಡಬೇಕೇ ಬೇಡವೇ ಎಂಬುದು ಯಾವಾಗಲೂ ನಿಮ್ಮ ಆಯ್ಕೆ. ಧ್ವನಿ ಸಹಾಯಕನನ್ನು ಏನು ಬೇಕಾದರೂ ಕೇಳಿ; ಬೇಕಾದರೆ ಒಬ್ಬ ವ್ಯಕ್ತಿ ಸಹಾಯ ಮಾಡುತ್ತಾರೆ.",it3:"ನ್ಯಾಯಯುತ ಮತ್ತು ಖಾಸಗಿ",ib3:"ಕೂಲಿ ಸಿಕ್ಕ ದಿನಗಳಿಗೆ ಮಾತ್ರ ಶುಲ್ಕ: 30 ದಿನಕ್ಕೆ ₹10, ಆದ್ದರಿಂದ ಕೂಲಿ ಸಿಗದ ದಿನ ಮತ್ತು ಕೆಲಸ ಇಲ್ಲದ ದಿನ ಉಚಿತ, ಮೊದಲ 3 ತಿಂಗಳೂ ಉಚಿತ. ನಿಮ್ಮ ದಾಖಲೆಗಳು ನಿಮ್ಮ ಫೋನ್‌ನಲ್ಲೇ ಉಳಿಯುತ್ತವೆ.",nx:"ಮುಂದೆ",skp:"ಬಿಟ್ಟುಬಿಡಿ",go:"ಪ್ರಾರಂಭಿಸಿ",ab:"ℹ ಆ್ಯಪ್ ಬಗ್ಗೆ"},
mr:{it1:"श्रम मित्रमध्ये स्वागत",ib1:"रोजंदारी कामगारांसाठी एक सहाय्यक. तुमच्या कामाची आणि मजुरीची नोंद ठेवा, तुमचे हक्क जाणून घ्या आणि सरकारी योजना शोधा – तुमच्या भाषेत.",it2:"हे कसे चालते",ib2:"दररोज तुमची मजुरी नोंदवा किंवा काम नसलेला दिवस निवडा. अॅप तुमच्या मजुरीची किमान मजुरीशी तुलना करून नियम दाखवते. तक्रार करायची की नाही हे नेहमी तुमच्या मर्जीवर असते. व्हॉइस सहाय्यकाला काहीही विचारा; गरज असल्यास एक व्यक्ती मदत करेल.",it3:"न्याय्य आणि खाजगी",ib3:"तुम्हाला मजुरी मिळालेल्या दिवसांसाठीच शुल्क: 30 दिवसांचे ₹10, त्यामुळे मजुरी न मिळालेले आणि काम नसलेले दिवस मोफत, आणि पहिले 3 महिनेही मोफत. तुमच्या नोंदी तुमच्या फोनमध्येच राहतात.",nx:"पुढे",skp:"वगळा",go:"सुरू करा",ab:"ℹ अॅपबद्दल"},
bn:{it1:"শ্রম মিত্রে স্বাগতম",ib1:"দিনমজুরদের জন্য একজন সহায়ক। আপনার কাজ ও মজুরির হিসাব রাখুন, অধিকার জানুন এবং সরকারি প্রকল্প খুঁজুন – নিজের ভাষায়।",it2:"এটি কীভাবে কাজ করে",ib2:"প্রতিদিন আপনার মজুরি লিখুন বা কাজ নেই বলে চিহ্নিত করুন। অ্যাপ আপনার মজুরিকে ন্যূনতম মজুরির সঙ্গে মিলিয়ে নিয়ম দেখায়। অভিযোগ করবেন কি না, সেটা সবসময় আপনার সিদ্ধান্ত। ভয়েস সহায়ককে যা খুশি জিজ্ঞাসা করুন; দরকার হলে একজন মানুষ সাহায্য করবেন।",it3:"ন্যায্য ও ব্যক্তিগত",ib3:"আপনি শুধু যে দিনগুলোর মজুরি পেয়েছেন সেগুলোর জন্য দেবেন: 30 দিনে ₹10, তাই মজুরি না পাওয়া ও কাজ না থাকা দিন বিনামূল্যে, প্রথম 3 মাসও বিনামূল্যে। আপনার রেকর্ড আপনার ফোনেই সংরক্ষিত থাকে।",nx:"পরের",skp:"বাদ দিন",go:"শুরু করুন",ab:"ℹ অ্যাপ সম্পর্কে"},
"or":{it1:"ଶ୍ରମ ମିତ୍ରକୁ ସ୍ୱାଗତ",ib1:"ଦିନମଜୁରିଆ ଶ୍ରମିକଙ୍କ ପାଇଁ ଏକ ସହାୟକ। ଆପଣଙ୍କ କାମ ଓ ମଜୁରିର ରେକର୍ଡ ରଖନ୍ତୁ, ଅଧିକାର ଜାଣନ୍ତୁ ଏବଂ ସରକାରୀ ଯୋଜନା ଖୋଜନ୍ତୁ – ନିଜ ଭାଷାରେ।",it2:"ଏହା କିପରି କାମ କରେ",ib2:"ପ୍ରତିଦିନ ଆପଣଙ୍କ ମଜୁରି ଲେଖନ୍ତୁ କିମ୍ବା କାମ ନାହିଁ ବୋଲି ଚିହ୍ନିତ କରନ୍ତୁ। ଆପ୍ ଆପଣଙ୍କ ମଜୁରିକୁ ସର୍ବନିମ୍ନ ମଜୁରି ସହ ତୁଳନା କରି ନିୟମ ଦେଖାଏ। ଅଭିଯୋଗ କରିବେ କି ନାହିଁ ତାହା ସବୁବେଳେ ଆପଣଙ୍କ ଇଚ୍ଛା। ଭଏସ୍ ସହାୟକକୁ ଯାହା ଇଚ୍ଛା ପଚାରନ୍ତୁ; ଦରକାର ହେଲେ ଜଣେ ବ୍ୟକ୍ତି ସାହାଯ୍ୟ କରିବେ।",it3:"ନ୍ୟାୟସଙ୍ଗତ ଓ ବ୍ୟକ୍ତିଗତ",ib3:"ଆପଣ ମଜୁରି ପାଇଥିବା ଦିନ ପାଇଁ ହିଁ ଦେବେ: 30 ଦିନକୁ ₹10, ତେଣୁ ମଜୁରି ନମିଳିଥିବା ଓ କାମ ନଥିବା ଦିନ ମାଗଣା, ପ୍ରଥମ 3 ମାସ ମଧ୍ୟ ମାଗଣା। ଆପଣଙ୍କ ରେକର୍ଡ ଆପଣଙ୍କ ଫୋନରେ ହିଁ ରହେ।",nx:"ପରବର୍ତ୍ତୀ",skp:"ଛାଡ଼ନ୍ତୁ",go:"ଆରମ୍ଭ କରନ୍ତୁ",ab:"ℹ ଆପ୍ ବିଷୟରେ"},
ml:{it1:"ശ്രമ മിത്രയിലേക്ക് സ്വാഗതം",ib1:"ദിവസക്കൂലി തൊഴിലാളികൾക്കുള്ള ഒരു സഹായി. നിങ്ങളുടെ പണിയുടെയും കൂലിയുടെയും രേഖ സൂക്ഷിക്കൂ, അവകാശങ്ങൾ അറിയൂ, സർക്കാർ പദ്ധതികൾ കണ്ടെത്തൂ – നിങ്ങളുടെ ഭാഷയിൽ.",it2:"ഇത് എങ്ങനെ പ്രവർത്തിക്കുന്നു",ib2:"ഓരോ ദിവസവും നിങ്ങളുടെ കൂലി രേഖപ്പെടുത്തൂ, അല്ലെങ്കിൽ പണിയില്ലാത്ത ദിവസമായി അടയാളപ്പെടുത്തൂ. ആപ്പ് നിങ്ങളുടെ കൂലിയെ മിനിമം കൂലിയുമായി താരതമ്യം ചെയ്ത് നിയമം കാണിക്കും. പരാതി നൽകണോ വേണ്ടയോ എന്നത് എപ്പോഴും നിങ്ങളുടെ തീരുമാനം. വോയ്സ് സഹായിയോട് എന്തും ചോദിക്കൂ; ആവശ്യമെങ്കിൽ ഒരാൾ സഹായിക്കും.",it3:"നീതിയുക്തം, സ്വകാര്യം",ib3:"കൂലി കിട്ടിയ ദിവസങ്ങൾക്ക് മാത്രം ഫീസ്: 30 ദിവസത്തിന് ₹10, അതിനാൽ കൂലി കിട്ടാത്തതും പണിയില്ലാത്തതുമായ ദിവസങ്ങൾ സൗജന്യം, ആദ്യ 3 മാസവും സൗജന്യം. നിങ്ങളുടെ രേഖകൾ നിങ്ങളുടെ ഫോണിൽ തന്നെ സൂക്ഷിക്കും.",nx:"അടുത്തത്",skp:"ഒഴിവാക്കുക",go:"തുടങ്ങാം",ab:"ℹ ആപ്പിനെക്കുറിച്ച്"},
gu:{it1:"શ્રમ મિત્રમાં આપનું સ્વાગત છે",ib1:"રોજમદાર કામદારો માટે એક સહાયક. તમારા કામ અને મજૂરીનો રેકોર્ડ રાખો, તમારા અધિકારો જાણો અને સરકારી યોજનાઓ શોધો – તમારી ભાષામાં.",it2:"તે કેવી રીતે કામ કરે છે",ib2:"દરરોજ તમારી મજૂરી નોંધો અથવા કામ ન હોય તે દિવસ તરીકે ચિહ્નિત કરો. એપ તમારી મજૂરીની લઘુતમ મજૂરી સાથે સરખામણી કરીને નિયમ બતાવે છે. ફરિયાદ કરવી કે નહીં એ હંમેશાં તમારી મરજી છે. વૉઇસ સહાયકને કંઈ પણ પૂછો; જરૂર પડે તો એક વ્યક્તિ મદદ કરશે.",it3:"ન્યાયી અને ખાનગી",ib3:"તમને મજૂરી મળી હોય તે દિવસો માટે જ ફી: 30 દિવસના ₹10, તેથી મજૂરી ન મળેલા અને કામ વગરના દિવસ મફત, અને પહેલા 3 મહિના પણ મફત. તમારા રેકોર્ડ તમારા ફોનમાં જ રહે છે.",nx:"આગળ",skp:"છોડો",go:"શરૂ કરો",ab:"ℹ એપ વિશે"},
pa:{it1:"ਸ਼੍ਰਮ ਮਿੱਤਰ ਵਿੱਚ ਜੀ ਆਇਆਂ ਨੂੰ",ib1:"ਦਿਹਾੜੀਦਾਰ ਕਾਮਿਆਂ ਲਈ ਇੱਕ ਸਹਾਇਕ। ਆਪਣੇ ਕੰਮ ਤੇ ਦਿਹਾੜੀ ਦਾ ਰਿਕਾਰਡ ਰੱਖੋ, ਆਪਣੇ ਹੱਕ ਜਾਣੋ ਅਤੇ ਸਰਕਾਰੀ ਯੋਜਨਾਵਾਂ ਲੱਭੋ – ਆਪਣੀ ਭਾਸ਼ਾ ਵਿੱਚ।",it2:"ਇਹ ਕਿਵੇਂ ਕੰਮ ਕਰਦਾ ਹੈ",ib2:"ਹਰ ਦਿਨ ਆਪਣੀ ਦਿਹਾੜੀ ਦਰਜ ਕਰੋ ਜਾਂ ਕੰਮ ਨਾ ਹੋਣ ਵਾਲਾ ਦਿਨ ਚੁਣੋ। ਐਪ ਤੁਹਾਡੀ ਦਿਹਾੜੀ ਦੀ ਘੱਟੋ-ਘੱਟ ਦਿਹਾੜੀ ਨਾਲ ਤੁਲਨਾ ਕਰ ਕੇ ਨਿਯਮ ਦਿਖਾਉਂਦੀ ਹੈ। ਸ਼ਿਕਾਇਤ ਕਰਨੀ ਹੈ ਜਾਂ ਨਹੀਂ, ਇਹ ਹਮੇਸ਼ਾ ਤੁਹਾਡੀ ਮਰਜ਼ੀ ਹੈ। ਵੌਇਸ ਸਹਾਇਕ ਤੋਂ ਕੁਝ ਵੀ ਪੁੱਛੋ; ਲੋੜ ਪਈ ਤਾਂ ਇੱਕ ਵਿਅਕਤੀ ਮਦਦ ਕਰੇਗਾ।",it3:"ਨਿਆਂਪੂਰਨ ਅਤੇ ਨਿੱਜੀ",ib3:"ਤੁਸੀਂ ਸਿਰਫ਼ ਉਨ੍ਹਾਂ ਦਿਨਾਂ ਦੀ ਫ਼ੀਸ ਦਿੰਦੇ ਹੋ ਜਿਨ੍ਹਾਂ ਦੀ ਦਿਹਾੜੀ ਮਿਲੀ: 30 ਦਿਨਾਂ ਦੇ ₹10, ਇਸ ਲਈ ਦਿਹਾੜੀ ਨਾ ਮਿਲੇ ਅਤੇ ਕੰਮ ਤੋਂ ਬਿਨਾਂ ਦਿਨ ਮੁਫ਼ਤ ਹਨ, ਅਤੇ ਪਹਿਲੇ 3 ਮਹੀਨੇ ਵੀ ਮੁਫ਼ਤ। ਤੁਹਾਡੇ ਰਿਕਾਰਡ ਤੁਹਾਡੇ ਫ਼ੋਨ ਵਿੱਚ ਹੀ ਰਹਿੰਦੇ ਹਨ।",nx:"ਅੱਗੇ",skp:"ਛੱਡੋ",go:"ਸ਼ੁਰੂ ਕਰੋ",ab:"ℹ ਐਪ ਬਾਰੇ"},
"as":{it1:"শ্ৰম মিত্ৰলৈ স্বাগতম",ib1:"দিনীয়া শ্ৰমিকৰ বাবে এজন সহায়ক। আপোনাৰ কাম আৰু মজুৰিৰ হিচাপ ৰাখক, অধিকাৰ জানক আৰু চৰকাৰী আঁচনি বিচাৰি উলিয়াওক – নিজৰ ভাষাত।",it2:"ই কেনেকৈ কাম কৰে",ib2:"প্ৰতিদিনে আপোনাৰ মজুৰি লিখক বা কাম নথকা দিন বুলি চিহ্নিত কৰক। এপে আপোনাৰ মজুৰিক ন্যূনতম মজুৰিৰ সৈতে তুলনা কৰি নিয়ম দেখুৱায়। অভিযোগ কৰিব নে নাই সেয়া সদায় আপোনাৰ ইচ্ছা। ভইচ সহায়কক যিকোনো কথা সোধক; প্ৰয়োজন হ'লে এজন ব্যক্তিয়ে সহায় কৰিব।",it3:"ন্যায্য আৰু ব্যক্তিগত",ib3:"আপুনি মজুৰি পোৱা দিনৰ বাবেহে ফী দিব: 30 দিনত ₹10, সেয়েহে মজুৰি নোপোৱা আৰু কাম নথকা দিন বিনামূলীয়া, প্ৰথম 3 মাহো বিনামূলীয়া। আপোনাৰ ৰেকৰ্ড আপোনাৰ ফোনতেই থাকে।",nx:"পিছত",skp:"এৰি দিয়ক",go:"আৰম্ভ কৰক",ab:"ℹ এপৰ বিষয়ে"}
};

te:{gh:"ఎలా ఉపయోగించాలి",bk:"వెనుకకు",gt1:"మీ భాషను ఎంచుకోండి",gb1:"పైన కుడివైపు ఉన్న భాష మెనూ వాడండి. యాప్ మొత్తం మారుతుంది. ఏ కార్డులోనైనా 🔊 నొక్కితే యాప్ దాన్ని చదివి వినిపిస్తుంది.",gt2:"మీ రోజును నమోదు చేయండి",gb2:"కూలీ ట్యాబ్‌లో ఈరోజు మీకు వచ్చిన కూలీ టైప్ చేయండి (పని చేసి డబ్బు రాకపోతే 0 టైప్ చేయండి), సేవ్ నొక్కండి. పని లేకపోతే 😴 బటన్ నొక్కండి. 6 గంటల వరకు మార్చవచ్చు.",gt3:"మీ రాష్ట్రాన్ని ఎంచుకోండి",gb3:"నమోదు కింద మీ రాష్ట్రాన్ని ఎంచుకోండి. తెలంగాణకు కనీస కూలీ దానంతట అదే వస్తుంది. ఇతర రాష్ట్రాలకు మీరే టైప్ చేయండి. మీకు తక్కువ వచ్చినట్లయితే యాప్ హెచ్చరిస్తుంది.",gt4:"మీ చరిత్ర చూడండి",gb4:"చరిత్ర ట్యాబ్‌లో ప్రతి రోజు, ప్రతి మార్పు, ప్రతి నెల మొత్తం కనిపిస్తాయి. కూలీ వచ్చిన రోజులకే మీరు చెల్లిస్తారు; డబ్బు రాని రోజులు, పని లేని రోజులు ఉచితం.",gt5:"హక్కులు, పథకాలు, సహాయం",gb5:"పని హక్కులు: మీ పని ప్రదేశంలో నిజమైనవి టిక్ చేయండి. పథకాలు: దరఖాస్తుకు ముందు నియమాలు చదవండి. సహాయం: మైక్ నొక్కి మీ భాషలో అడగండి, లేదా ఒక వ్యక్తికి కాల్ చేయండి."},
en:{gh:"How to use",bk:"Back",gt1:"Choose your language",gb1:"Use the language menu at the top right. The whole app changes. Tap 🔊 on any card and the app reads it aloud.",gt2:"Record your day",gb2:"On the Wages tab, type what you were paid today (type 0 if you worked but got nothing) and tap Save. If there was no work, tap the 😴 button. You can change it for 6 hours.",gt3:"Pick your state",gb3:"Choose your state below your entry. For Telangana the minimum wage fills in by itself. For other states, type it in. The app warns you if you were paid less.",gt4:"See your history",gb4:"The History tab shows every day, every change, and each month's total. You pay only for days you were paid; unpaid and no-work days are free.",gt5:"Rights, schemes and help",gb5:"Work rights: tick what is true at your workplace. Schemes: read the rules before applying. Help: tap the mic and ask in your language, or call a person."},
hi:{gh:"कैसे इस्तेमाल करें",bk:"पीछे",gt1:"अपनी भाषा चुनें",gb1:"ऊपर दाईं ओर भाषा मेनू का इस्तेमाल करें। पूरा ऐप बदल जाता है। किसी भी कार्ड पर 🔊 दबाएँ तो ऐप उसे पढ़कर सुनाता है।",gt2:"अपना दिन दर्ज करें",gb2:"मज़दूरी टैब में आज जितनी मज़दूरी मिली वह लिखें (काम किया पर कुछ नहीं मिला तो 0 लिखें) और सेव दबाएँ। काम न हो तो 😴 बटन दबाएँ। 6 घंटे तक बदल सकते हैं।",gt3:"अपना राज्य चुनें",gb3:"प्रविष्टि के नीचे अपना राज्य चुनें। तेलंगाना की न्यूनतम मज़दूरी अपने-आप भर जाती है। दूसरे राज्यों के लिए खुद लिखें। कम मज़दूरी मिली हो तो ऐप चेतावनी देता है।",gt4:"अपना इतिहास देखें",gb4:"इतिहास टैब में हर दिन, हर बदलाव और हर महीने का कुल दिखता है। आप सिर्फ़ उन्हीं दिनों का भुगतान करते हैं जिनकी मज़दूरी मिली; बिना भुगतान और काम-रहित दिन मुफ़्त हैं।",gt5:"अधिकार, योजनाएँ और मदद",gb5:"काम के अधिकार: अपने कार्यस्थल पर जो सही है उस पर टिक करें। योजनाएँ: आवेदन से पहले नियम पढ़ें। मदद: माइक दबाकर अपनी भाषा में पूछें, या किसी व्यक्ति को कॉल करें।"},
ta:{gh:"எப்படிப் பயன்படுத்துவது",bk:"பின்",gt1:"உங்கள் மொழியைத் தேர்வு செய்யுங்கள்",gb1:"மேலே வலப்பக்கம் உள்ள மொழி மெனுவைப் பயன்படுத்துங்கள். ஆப் முழுவதும் மாறும். எந்த அட்டையிலும் 🔊 அழுத்தினால் ஆப் அதை வாசித்துக் காட்டும்.",gt2:"உங்கள் நாளைப் பதிவு செய்யுங்கள்",gb2:"கூலி தாவலில் இன்று கிடைத்த கூலியை உள்ளிடுங்கள் (வேலை செய்தும் பணம் கிடைக்கவில்லை என்றால் 0 உள்ளிடுங்கள்), சேமி அழுத்துங்கள். வேலை இல்லையெனில் 😴 பொத்தானை அழுத்துங்கள். 6 மணி நேரம் வரை மாற்றலாம்.",gt3:"உங்கள் மாநிலத்தைத் தேர்வு செய்யுங்கள்",gb3:"பதிவுக்குக் கீழே உங்கள் மாநிலத்தைத் தேர்வு செய்யுங்கள். தெலங்கானாவுக்கு குறைந்தபட்ச கூலி தானாக நிரம்பும். மற்ற மாநிலங்களுக்கு நீங்களே உள்ளிடுங்கள். உங்களுக்கு குறைவாகக் கிடைத்தால் ஆப் எச்சரிக்கும்.",gt4:"உங்கள் வரலாற்றைப் பாருங்கள்",gb4:"வரலாறு தாவலில் ஒவ்வொரு நாளும், ஒவ்வொரு மாற்றமும், ஒவ்வொரு மாத மொத்தமும் தெரியும். கூலி கிடைத்த நாட்களுக்கு மட்டுமே கட்டணம்; கூலி கிடைக்காத நாட்களும் வேலை இல்லாத நாட்களும் இலவசம்.",gt5:"உரிமைகள், திட்டங்கள், உதவி",gb5:"பணி உரிமைகள்: உங்கள் பணியிடத்தில் உண்மையானதைக் குறியிடுங்கள். திட்டங்கள்: விண்ணப்பிக்கும் முன் விதிகளைப் படியுங்கள். உதவி: மைக்கை அழுத்தி உங்கள் மொழியில் கேளுங்கள், அல்லது ஒருவரை அழையுங்கள்."},
kn:{gh:"ಬಳಸುವುದು ಹೇಗೆ",bk:"ಹಿಂದೆ",gt1:"ನಿಮ್ಮ ಭಾಷೆ ಆಯ್ಕೆಮಾಡಿ",gb1:"ಮೇಲೆ ಬಲಭಾಗದ ಭಾಷಾ ಮೆನು ಬಳಸಿ. ಇಡೀ ಆ್ಯಪ್ ಬದಲಾಗುತ್ತದೆ. ಯಾವುದೇ ಕಾರ್ಡ್‌ನಲ್ಲಿ 🔊 ಒತ್ತಿದರೆ ಆ್ಯಪ್ ಅದನ್ನು ಓದಿ ಹೇಳುತ್ತದೆ.",gt2:"ನಿಮ್ಮ ದಿನವನ್ನು ದಾಖಲಿಸಿ",gb2:"ಕೂಲಿ ಟ್ಯಾಬ್‌ನಲ್ಲಿ ಇಂದು ಸಿಕ್ಕ ಕೂಲಿ ಟೈಪ್ ಮಾಡಿ (ಕೆಲಸ ಮಾಡಿ ಹಣ ಸಿಗದಿದ್ದರೆ 0 ಟೈಪ್ ಮಾಡಿ), ಉಳಿಸಿ ಒತ್ತಿ. ಕೆಲಸ ಇಲ್ಲದಿದ್ದರೆ 😴 ಬಟನ್ ಒತ್ತಿ. 6 ಗಂಟೆವರೆಗೆ ಬದಲಿಸಬಹುದು.",gt3:"ನಿಮ್ಮ ರಾಜ್ಯ ಆಯ್ಕೆಮಾಡಿ",gb3:"ದಾಖಲೆಯ ಕೆಳಗೆ ನಿಮ್ಮ ರಾಜ್ಯ ಆಯ್ಕೆಮಾಡಿ. ತೆಲಂಗಾಣಕ್ಕೆ ಕನಿಷ್ಠ ಕೂಲಿ ತಾನೇ ತುಂಬುತ್ತದೆ. ಇತರ ರಾಜ್ಯಗಳಿಗೆ ನೀವೇ ಟೈಪ್ ಮಾಡಿ. ನಿಮಗೆ ಕಡಿಮೆ ಸಿಕ್ಕಿದರೆ ಆ್ಯಪ್ ಎಚ್ಚರಿಸುತ್ತದೆ.",gt4:"ನಿಮ್ಮ ಇತಿಹಾಸ ನೋಡಿ",gb4:"ಇತಿಹಾಸ ಟ್ಯಾಬ್‌ನಲ್ಲಿ ಪ್ರತಿ ದಿನ, ಪ್ರತಿ ಬದಲಾವಣೆ ಮತ್ತು ಪ್ರತಿ ತಿಂಗಳ ಒಟ್ಟು ಕಾಣುತ್ತದೆ. ಕೂಲಿ ಸಿಕ್ಕ ದಿನಗಳಿಗೆ ಮಾತ್ರ ಶುಲ್ಕ; ಕೂಲಿ ಸಿಗದ ದಿನ ಮತ್ತು ಕೆಲಸ ಇಲ್ಲದ ದಿನ ಉಚಿತ.",gt5:"ಹಕ್ಕುಗಳು, ಯೋಜನೆಗಳು, ಸಹಾಯ",gb5:"ಕೆಲಸದ ಹಕ್ಕುಗಳು: ನಿಮ್ಮ ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ನಿಜವಾದವುಗಳನ್ನು ಟಿಕ್ ಮಾಡಿ. ಯೋಜನೆಗಳು: ಅರ್ಜಿ ಹಾಕುವ ಮುನ್ನ ನಿಯಮ ಓದಿ. ಸಹಾಯ: ಮೈಕ್ ಒತ್ತಿ ನಿಮ್ಮ ಭಾಷೆಯಲ್ಲಿ ಕೇಳಿ, ಅಥವಾ ಒಬ್ಬ ವ್ಯಕ್ತಿಗೆ ಕರೆ ಮಾಡಿ."},
mr:{gh:"कसे वापरायचे",bk:"मागे",gt1:"तुमची भाषा निवडा",gb1:"वर उजवीकडील भाषा मेनू वापरा. संपूर्ण अॅप बदलते. कोणत्याही कार्डवर 🔊 दाबल्यास अॅप ते वाचून दाखवते.",gt2:"तुमचा दिवस नोंदवा",gb2:"मजुरी टॅबमध्ये आज मिळालेली मजुरी टाइप करा (काम केले पण काही मिळाले नाही तर 0 टाइप करा) आणि सेव्ह दाबा. काम नसेल तर 😴 बटण दाबा. 6 तासांपर्यंत बदलता येते.",gt3:"तुमचे राज्य निवडा",gb3:"नोंदीखाली तुमचे राज्य निवडा. तेलंगणासाठी किमान मजुरी आपोआप भरते. इतर राज्यांसाठी स्वतः टाइप करा. तुम्हाला कमी मिळाले तर अॅप इशारा देते.",gt4:"तुमचा इतिहास पहा",gb4:"इतिहास टॅबमध्ये प्रत्येक दिवस, प्रत्येक बदल आणि प्रत्येक महिन्याची बेरीज दिसते. मजुरी मिळालेल्या दिवसांसाठीच शुल्क; मजुरी न मिळालेले आणि काम नसलेले दिवस मोफत.",gt5:"हक्क, योजना आणि मदत",gb5:"कामाचे हक्क: तुमच्या कामाच्या ठिकाणी जे खरे आहे त्यावर टिक करा. योजना: अर्ज करण्यापूर्वी नियम वाचा. मदत: माइक दाबून तुमच्या भाषेत विचारा, किंवा एका व्यक्तीला कॉल करा."},
bn:{gh:"কীভাবে ব্যবহার করবেন",bk:"পিছনে",gt1:"আপনার ভাষা বেছে নিন",gb1:"উপরে ডানদিকের ভাষা মেনু ব্যবহার করুন। পুরো অ্যাপ বদলে যায়। যেকোনো কার্ডে 🔊 চাপলে অ্যাপ তা পড়ে শোনায়।",gt2:"আপনার দিনটি লিখুন",gb2:"মজুরি ট্যাবে আজ যা মজুরি পেয়েছেন তা লিখুন (কাজ করেও কিছু না পেলে 0 লিখুন) এবং সেভ চাপুন। কাজ না থাকলে 😴 বোতাম চাপুন। 6 ঘণ্টা পর্যন্ত বদলানো যায়।",gt3:"আপনার রাজ্য বেছে নিন",gb3:"এন্ট্রির নিচে আপনার রাজ্য বেছে নিন। তেলেঙ্গানার ন্যূনতম মজুরি নিজে থেকে ভরে যায়। অন্য রাজ্যের জন্য নিজে লিখুন। কম পেলে অ্যাপ সতর্ক করে।",gt4:"আপনার ইতিহাস দেখুন",gb4:"ইতিহাস ট্যাবে প্রতিটি দিন, প্রতিটি পরিবর্তন ও প্রতি মাসের মোট দেখা যায়। যে দিনগুলোর মজুরি পেয়েছেন শুধু সেগুলোর জন্য ফি; মজুরি না পাওয়া ও কাজ না থাকা দিন বিনামূল্যে।",gt5:"অধিকার, প্রকল্প ও সাহায্য",gb5:"কাজের অধিকার: আপনার কর্মস্থলে যা সত্যি তাতে টিক দিন। প্রকল্প: আবেদনের আগে নিয়ম পড়ুন। সাহায্য: মাইক চেপে নিজের ভাষায় জিজ্ঞাসা করুন, বা একজন মানুষকে ফোন করুন।"},
"or":{gh:"କିପରି ବ୍ୟବହାର କରିବେ",bk:"ପଛକୁ",gt1:"ଆପଣଙ୍କ ଭାଷା ବାଛନ୍ତୁ",gb1:"ଉପର ଡାହାଣରେ ଥିବା ଭାଷା ମେନୁ ବ୍ୟବହାର କରନ୍ତୁ। ପୂରା ଆପ୍ ବଦଳିଯାଏ। ଯେକୌଣସି କାର୍ଡରେ 🔊 ଦାବିଲେ ଆପ୍ ତାହା ପଢ଼ି ଶୁଣାଏ।",gt2:"ଆପଣଙ୍କ ଦିନ ଲେଖନ୍ତୁ",gb2:"ମଜୁରି ଟ୍ୟାବରେ ଆଜି ମିଳିଥିବା ମଜୁରି ଲେଖନ୍ତୁ (କାମ କରି କିଛି ନମିଳିଲେ 0 ଲେଖନ୍ତୁ) ଏବଂ ସେଭ୍ ଦାବନ୍ତୁ। କାମ ନଥିଲେ 😴 ବଟନ୍ ଦାବନ୍ତୁ। 6 ଘଣ୍ଟା ପର୍ଯ୍ୟନ୍ତ ବଦଳାଇ ପାରିବେ।",gt3:"ଆପଣଙ୍କ ରାଜ୍ୟ ବାଛନ୍ତୁ",gb3:"ଏଣ୍ଟ୍ରି ତଳେ ଆପଣଙ୍କ ରାଜ୍ୟ ବାଛନ୍ତୁ। ତେଲେଙ୍ଗାନା ପାଇଁ ସର୍ବନିମ୍ନ ମଜୁରି ନିଜେ ଭର୍ତ୍ତି ହୁଏ। ଅନ୍ୟ ରାଜ୍ୟ ପାଇଁ ନିଜେ ଲେଖନ୍ତୁ। କମ୍ ମିଳିଲେ ଆପ୍ ସତର୍କ କରେ।",gt4:"ଆପଣଙ୍କ ଇତିହାସ ଦେଖନ୍ତୁ",gb4:"ଇତିହାସ ଟ୍ୟାବରେ ପ୍ରତ୍ୟେକ ଦିନ, ପ୍ରତ୍ୟେକ ବଦଳ ଓ ପ୍ରତି ମାସର ମୋଟ ଦେଖାଯାଏ। ମଜୁରି ମିଳିଥିବା ଦିନ ପାଇଁ ହିଁ ଶୁଳ୍କ; ମଜୁରି ନମିଳିଥିବା ଓ କାମ ନଥିବା ଦିନ ମାଗଣା।",gt5:"ଅଧିକାର, ଯୋଜନା ଓ ସହାୟତା",gb5:"କାମ ଅଧିକାର: ଆପଣଙ୍କ କାମ ସ୍ଥାନରେ ଯାହା ସତ୍ୟ ତାହାକୁ ଟିକ୍ କରନ୍ତୁ। ଯୋଜନା: ଆବେଦନ ପୂର୍ବରୁ ନିୟମ ପଢ଼ନ୍ତୁ। ସହାୟତା: ମାଇକ୍ ଦାବି ନିଜ ଭାଷାରେ ପଚାରନ୍ତୁ, କିମ୍ବା ଜଣକୁ କଲ୍ କରନ୍ତୁ।"},
ml:{gh:"എങ്ങനെ ഉപയോഗിക്കാം",bk:"പിന്നോട്ട്",gt1:"നിങ്ങളുടെ ഭാഷ തിരഞ്ഞെടുക്കൂ",gb1:"മുകളിൽ വലതുവശത്തെ ഭാഷാ മെനു ഉപയോഗിക്കൂ. ആപ്പ് മുഴുവൻ മാറും. ഏതു കാർഡിലും 🔊 അമർത്തിയാൽ ആപ്പ് അത് വായിച്ചു കേൾപ്പിക്കും.",gt2:"നിങ്ങളുടെ ദിവസം രേഖപ്പെടുത്തൂ",gb2:"കൂലി ടാബിൽ ഇന്ന് കിട്ടിയ കൂലി ടൈപ്പ് ചെയ്യൂ (പണിയെടുത്തിട്ടും ഒന്നും കിട്ടിയില്ലെങ്കിൽ 0 ടൈപ്പ് ചെയ്യൂ), സേവ് അമർത്തൂ. പണിയില്ലെങ്കിൽ 😴 ബട്ടൺ അമർത്തൂ. 6 മണിക്കൂർ വരെ മാറ്റാം.",gt3:"നിങ്ങളുടെ സംസ്ഥാനം തിരഞ്ഞെടുക്കൂ",gb3:"രേഖയ്ക്ക് താഴെ നിങ്ങളുടെ സംസ്ഥാനം തിരഞ്ഞെടുക്കൂ. തെലങ്കാനയുടെ മിനിമം കൂലി സ്വയം നിറയും. മറ്റ് സംസ്ഥാനങ്ങൾക്ക് നിങ്ങൾ തന്നെ ടൈപ്പ് ചെയ്യൂ. കുറച്ച് കിട്ടിയാൽ ആപ്പ് മുന്നറിയിപ്പ് നൽകും.",gt4:"നിങ്ങളുടെ ചരിത്രം കാണൂ",gb4:"ചരിത്രം ടാബിൽ ഓരോ ദിവസവും ഓരോ മാറ്റവും ഓരോ മാസത്തെ ആകെയും കാണാം. കൂലി കിട്ടിയ ദിവസങ്ങൾക്ക് മാത്രം ഫീസ്; കൂലി കിട്ടാത്തതും പണിയില്ലാത്തതുമായ ദിവസങ്ങൾ സൗജന്യം.",gt5:"അവകാശങ്ങൾ, പദ്ധതികൾ, സഹായം",gb5:"പണി അവകാശങ്ങൾ: നിങ്ങളുടെ ജോലിസ്ഥലത്ത് ശരിയായത് ടിക്ക് ചെയ്യൂ. പദ്ധതികൾ: അപേക്ഷിക്കും മുമ്പ് നിയമങ്ങൾ വായിക്കൂ. സഹായം: മൈക്ക് അമർത്തി നിങ്ങളുടെ ഭാഷയിൽ ചോദിക്കൂ, അല്ലെങ്കിൽ ഒരാളെ വിളിക്കൂ."},
gu:{gh:"કેવી રીતે વાપરવું",bk:"પાછળ",gt1:"તમારી ભાષા પસંદ કરો",gb1:"ઉપર જમણી બાજુના ભાષા મેનુનો ઉપયોગ કરો. આખી એપ બદલાઈ જાય છે. કોઈ પણ કાર્ડ પર 🔊 દબાવો તો એપ તે વાંચી સંભળાવે છે.",gt2:"તમારો દિવસ નોંધો",gb2:"મજૂરી ટૅબમાં આજે મળેલી મજૂરી લખો (કામ કર્યું પણ કંઈ ન મળ્યું તો 0 લખો) અને સેવ દબાવો. કામ ન હોય તો 😴 બટન દબાવો. 6 કલાક સુધી બદલી શકાય.",gt3:"તમારું રાજ્ય પસંદ કરો",gb3:"નોંધની નીચે તમારું રાજ્ય પસંદ કરો. તેલંગાણા માટે લઘુતમ મજૂરી આપોઆપ ભરાય છે. બીજા રાજ્યો માટે જાતે લખો. તમને ઓછું મળ્યું હોય તો એપ ચેતવણી આપે છે.",gt4:"તમારો ઇતિહાસ જુઓ",gb4:"ઇતિહાસ ટૅબમાં દરેક દિવસ, દરેક ફેરફાર અને દરેક મહિનાનો કુલ દેખાય છે. મજૂરી મળેલા દિવસો માટે જ ફી; મજૂરી ન મળેલા અને કામ વગરના દિવસ મફત.",gt5:"અધિકારો, યોજનાઓ અને મદદ",gb5:"કામના અધિકારો: તમારી કામની જગ્યાએ જે સાચું હોય તેના પર ટિક કરો. યોજનાઓ: અરજી કરતાં પહેલાં નિયમો વાંચો. મદદ: માઇક દબાવી તમારી ભાષામાં પૂછો, અથવા કોઈ વ્યક્તિને કૉલ કરો."},
pa:{gh:"ਕਿਵੇਂ ਵਰਤਣਾ ਹੈ",bk:"ਪਿੱਛੇ",gt1:"ਆਪਣੀ ਭਾਸ਼ਾ ਚੁਣੋ",gb1:"ਉੱਪਰ ਸੱਜੇ ਪਾਸੇ ਭਾਸ਼ਾ ਮੀਨੂ ਵਰਤੋ। ਪੂਰੀ ਐਪ ਬਦਲ ਜਾਂਦੀ ਹੈ। ਕਿਸੇ ਵੀ ਕਾਰਡ 'ਤੇ 🔊 ਦਬਾਓ ਤਾਂ ਐਪ ਉਸਨੂੰ ਪੜ੍ਹ ਕੇ ਸੁਣਾਉਂਦੀ ਹੈ।",gt2:"ਆਪਣਾ ਦਿਨ ਦਰਜ ਕਰੋ",gb2:"ਦਿਹਾੜੀ ਟੈਬ ਵਿੱਚ ਅੱਜ ਮਿਲੀ ਦਿਹਾੜੀ ਲਿਖੋ (ਕੰਮ ਕੀਤਾ ਪਰ ਕੁਝ ਨਾ ਮਿਲਿਆ ਤਾਂ 0 ਲਿਖੋ) ਅਤੇ ਸੇਵ ਦਬਾਓ। ਕੰਮ ਨਾ ਹੋਵੇ ਤਾਂ 😴 ਬਟਨ ਦਬਾਓ। 6 ਘੰਟੇ ਤੱਕ ਬਦਲ ਸਕਦੇ ਹੋ।",gt3:"ਆਪਣਾ ਰਾਜ ਚੁਣੋ",gb3:"ਐਂਟਰੀ ਦੇ ਹੇਠਾਂ ਆਪਣਾ ਰਾਜ ਚੁਣੋ। ਤੇਲੰਗਾਨਾ ਲਈ ਘੱਟੋ-ਘੱਟ ਦਿਹਾੜੀ ਆਪਣੇ-ਆਪ ਭਰ ਜਾਂਦੀ ਹੈ। ਹੋਰ ਰਾਜਾਂ ਲਈ ਆਪ ਲਿਖੋ। ਘੱਟ ਮਿਲੀ ਹੋਵੇ ਤਾਂ ਐਪ ਚੇਤਾਵਨੀ ਦਿੰਦੀ ਹੈ।",gt4:"ਆਪਣਾ ਇਤਿਹਾਸ ਵੇਖੋ",gb4:"ਇਤਿਹਾਸ ਟੈਬ ਵਿੱਚ ਹਰ ਦਿਨ, ਹਰ ਬਦਲਾਅ ਅਤੇ ਹਰ ਮਹੀਨੇ ਦਾ ਕੁੱਲ ਦਿਸਦਾ ਹੈ। ਦਿਹਾੜੀ ਮਿਲੇ ਦਿਨਾਂ ਦੀ ਹੀ ਫ਼ੀਸ; ਦਿਹਾੜੀ ਨਾ ਮਿਲੇ ਅਤੇ ਕੰਮ ਤੋਂ ਬਿਨਾਂ ਦਿਨ ਮੁਫ਼ਤ।",gt5:"ਹੱਕ, ਯੋਜਨਾਵਾਂ ਅਤੇ ਮਦਦ",gb5:"ਕੰਮ ਦੇ ਹੱਕ: ਆਪਣੀ ਕੰਮ ਦੀ ਥਾਂ 'ਤੇ ਜੋ ਸੱਚ ਹੈ ਉਸ 'ਤੇ ਟਿੱਕ ਕਰੋ। ਯੋਜਨਾਵਾਂ: ਅਰਜ਼ੀ ਤੋਂ ਪਹਿਲਾਂ ਨਿਯਮ ਪੜ੍ਹੋ। ਮਦਦ: ਮਾਈਕ ਦਬਾ ਕੇ ਆਪਣੀ ਭਾਸ਼ਾ ਵਿੱਚ ਪੁੱਛੋ, ਜਾਂ ਕਿਸੇ ਵਿਅਕਤੀ ਨੂੰ ਕਾਲ ਕਰੋ।"},
