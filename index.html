te:{n5:"పని హక్కులు",wr_t:"పని పరిస్థితులు",wr_s:"న్యాయమైన, సురక్షితమైన పని ప్రదేశం ఎలా ఉండాలో తెలుసుకోండి.",wr_c:"మీ పని ప్రదేశంలో ఏవి నిజమో వాటిని టిక్ చేయండి. మీకు వర్తించనివి వదిలేయండి.",wr_b:"నా పని ప్రదేశాన్ని తనిఖీ చేయండి",wr_ok:"మీరు టిక్ చేసినవన్నీ ప్రమాణాలకు తగ్గట్టే ఉన్నాయి. ఇలాగే కొనసాగించండి.",wr_no:"ఈ అంశాలను మళ్లీ చూడండి:",wr_h:"తర్వాతి అడుగు: ముందు మర్యాదగా అడగండి. మార్పు రాకపోతే మీ జిల్లా కార్మిక శాఖ కార్యాలయాన్ని లేదా జిల్లా న్యాయ సేవా సంస్థను (ఉచిత న్యాయ సహాయం ఉండవచ్చు) సంప్రదించండి, లేదా కస్టమర్ కేర్‌కు కాల్ చేయండి. ఫిర్యాదు చేయాలా వద్దా అనేది ఎల్లప్పుడూ మీ ఇష్టం.",wr_src:"భారత లేబర్ కోడ్‌ల ఆధారంగా, OSH కోడ్ సహా (కేంద్ర నిబంధనలు 8 మే 2026న నోటిఫై అయ్యాయి). మీ రాష్ట్రానికి సొంత నిబంధనలు ఉండవచ్చు.",
wr:[["నేను రోజుకు 8 గంటల కంటే ఎక్కువ పని చేయను","రోజువారీ కూలీలకు సాధారణ పని రోజుకు 8 గంటలు, వారానికి 48 గంటల వరకు."],["అదనపు గంటలు నా ఇష్టం, రెట్టింపు చెల్లింపు","సాధారణ గంటల కంటే ఎక్కువ పనికి మీ అంగీకారం కావాలి, సాధారణ రేటుకు కనీసం రెండింతలు చెల్లించాలి."],["నాకు వారానికి ఒక రోజు విశ్రాంతి ఉంది","కార్మికులకు వారానికి కనీసం ఒక రోజు విశ్రాంతికి హక్కు ఉంది. చెల్లింపు సెలవుల గురించి మీ రాష్ట్ర నియమాలు ఏమంటున్నాయో అడగండి."],["ప్రమాదకర పనికి రక్షణ సామగ్రి ఇస్తారు","ఎత్తు, యంత్రాలు, తవ్వకం వంటి ప్రమాదకర పనికి యజమాని రక్షణ సామగ్రి, సురక్షిత ప్రదేశం ఇవ్వాలి. అసురక్షిత పరిస్థితులను తెలియజేయండి."],["తాగునీరు, మరుగుదొడ్డి, శుభ్రమైన వెలుతురు ఉన్న చోటు ఉన్నాయి","శుభ్రమైన తాగునీరు, మరుగుదొడ్లు, శుభ్రమైన, వెలుతురు ఉన్న పని ప్రదేశం తప్పనిసరి. పెద్ద ప్రదేశాల్లో విశ్రాంతి గదులు, క్యాంటీన్ వంటివి కూడా ఉండాలి."],["ఇక్కడ మహిళలు సురక్షితంగా పని చేస్తారు, సమాన వేతనం పొందుతారు","ఒకే పనికి మహిళలకు పురుషులతో సమానంగా చెల్లించాలి. రాత్రి పని మహిళ అంగీకారంతో, మంచి వెలుతురు, సురక్షిత ప్రయాణం వంటి ఏర్పాట్లతో మాత్రమే."],["ఇక్కడ 14 ఏళ్ల లోపు పిల్లలు పని చేయరు","14 ఏళ్ల లోపు పిల్లలను పనిలో పెట్టకూడదు, 18 ఏళ్ల లోపు వారు ప్రమాదకరమైన పని చేయకూడదు."],["ఎవరైనా గాయపడితే చికిత్స, సహాయం అందుతాయి","పనిలో గాయమైతే ముందు చికిత్స తీసుకోండి. తేదీ, చోటు, చూసిన వారిని నోట్ చేయండి. మీకు పరిహారం పొందే హక్కు ఉండవచ్చు."]],
spb:"📊 స్పాన్సర్ వ్యూ (నమూనా)",sp_t:"స్పాన్సర్ వ్యూ",sp_n:"ఇవి నమూనా అంకెలు మాత్రమే, నిజమైన డేటా కాదు.",sp1:"నమోదైన కూలీలు",sp2:"ఈ నెల చురుకుగా ఉన్నవారు",sp3:"తక్కువ చెల్లింపు గుర్తించినవారు",sp4:"సహాయంతో e-శ్రమలో నమోదైనవారు",sp5:"సహాయకుడితో చాట్‌లు",sp6:"కస్టమర్ కేర్‌కు వెళ్లినవి",sp7:"నెలకు చురుకైన కూలీలు",sp_p:"గోప్యత హామీ: స్పాన్సర్లకు కలిపిన అంకెలు మాత్రమే కనిపిస్తాయి; కూలీ పేరు, కూలీ వివరాలు, ఫిర్యాదులు ఎప్పుడూ కనిపించవు.",sp_b:"← వెనుకకు"},
en:{n5:"Work rights",wr_t:"Working conditions",wr_s:"Know what a fair and safe workplace looks like.",wr_c:"Tick what is true at your workplace. Skip what does not apply to you.",wr_b:"Check my workplace",wr_ok:"Everything you ticked meets the standard. Keep it up.",wr_no:"Look at these points again:",wr_h:"Next step: ask politely first. If nothing changes, contact your district labour office or the District Legal Services Authority (free legal aid may be available), or call customer care. Whether to complain is always your choice.",wr_src:"Based on India's Labour Codes, including the OSH Code (central rules notified 8 May 2026). Your state may have its own rules.",
wr:[["I work no more than 8 hours a day","Normal work for daily wage workers is up to 8 hours a day and 48 hours a week."],["Extra hours are my choice and paid double","Work beyond normal hours needs your consent and must be paid at least twice the normal rate."],["I get a weekly day of rest","Workers are entitled to at least one weekly day of rest. Ask what your state's rules say about paid holidays."],["I get safety gear for risky work","For risky work like heights, machines or digging, the employer should provide safety equipment and a safe site. Report unsafe conditions."],["There is drinking water, a toilet and a clean, well-lit place","Clean drinking water, toilets and a clean, well-lit workplace are required. Bigger workplaces must provide more, such as rest rooms and a canteen."],["Women here work safely and are paid equally","Women should get the same pay as men for the same work. Night work only with the woman's consent and safe arrangements such as good lighting and safe transport."],["No child under 14 works here","Children under 14 must not be employed, and young people under 18 must not do dangerous work."],["If someone is hurt, they get treatment and help","After a work injury, get treatment first. Note the date, place and who saw it. You may be entitled to compensation."]],
spb:"📊 Sponsor view (sample)",sp_t:"Sponsor view",sp_n:"SAMPLE figures for illustration only. These are not real data.",sp1:"Workers enrolled",sp2:"Active this month",sp3:"Found underpaid days",sp4:"Registered for e-Shram with help",sp5:"Assistant chats",sp6:"Passed to customer care",sp7:"Active workers per month",sp_p:"Privacy promise: sponsors see only combined numbers, never a worker's name, wages or complaints.",sp_b:"← Back"},
hi:{n5:"काम के अधिकार",wr_t:"काम की परिस्थितियाँ",wr_s:"जानें कि न्यायपूर्ण और सुरक्षित कार्यस्थल कैसा होता है।",wr_c:"जो आपके कार्यस्थल पर सही है उस पर टिक करें। जो लागू नहीं होता उसे छोड़ दें।",wr_b:"मेरा कार्यस्थल जाँचें",wr_ok:"आपने जो टिक किया वह सब मानक के अनुसार है। ऐसे ही बनाए रखें।",wr_no:"इन बातों को फिर देखें:",wr_h:"अगला कदम: पहले विनम्रता से कहें। बदलाव न हो तो अपने ज़िला श्रम कार्यालय या ज़िला विधिक सेवा प्राधिकरण (मुफ़्त कानूनी सहायता मिल सकती है) से संपर्क करें, या कस्टमर केयर को कॉल करें। शिकायत करना या नहीं, यह हमेशा आपकी मर्ज़ी है।",wr_src:"भारत के श्रम संहिताओं पर आधारित, OSH संहिता सहित (केंद्रीय नियम 8 मई 2026 को अधिसूचित)। आपके राज्य के अपने नियम हो सकते हैं।",
wr:[["मैं दिन में 8 घंटे से ज़्यादा काम नहीं करता/करती","दिहाड़ी मज़दूरों के लिए सामान्य काम दिन में 8 घंटे और हफ़्ते में 48 घंटे तक है।"],["अतिरिक्त घंटे मेरी मर्ज़ी से हैं और दोगुना भुगतान मिलता है","सामान्य घंटों से ज़्यादा काम के लिए आपकी सहमति ज़रूरी है और भुगतान सामान्य दर से कम से कम दोगुना होना चाहिए।"],["मुझे हफ़्ते में एक दिन आराम मिलता है","मज़दूरों को हफ़्ते में कम से कम एक दिन आराम का हक़ है। सवेतन छुट्टियों के बारे में अपने राज्य के नियम पूछें।"],["जोखिम वाले काम के लिए सुरक्षा सामान मिलता है","ऊँचाई, मशीन या खुदाई जैसे जोखिम वाले काम में मालिक को सुरक्षा सामान और सुरक्षित जगह देनी चाहिए। असुरक्षित हालात की सूचना दें।"],["पीने का पानी, शौचालय और साफ़, रोशनी वाली जगह है","साफ़ पीने का पानी, शौचालय और साफ़, रोशनी वाला कार्यस्थल ज़रूरी है। बड़े कार्यस्थलों में आराम कक्ष और कैंटीन जैसी सुविधाएँ भी होनी चाहिए।"],["यहाँ महिलाएँ सुरक्षित काम करती हैं और बराबर वेतन पाती हैं","एक जैसे काम के लिए महिलाओं को पुरुषों के बराबर वेतन मिलना चाहिए। रात का काम केवल महिला की सहमति और अच्छी रोशनी, सुरक्षित आवागमन जैसे इंतज़ाम के साथ।"],["यहाँ 14 साल से कम उम्र का कोई बच्चा काम नहीं करता","14 साल से कम उम्र के बच्चों से काम नहीं करवाया जा सकता, और 18 साल से कम उम्र के लोग खतरनाक काम नहीं कर सकते।"],["कोई घायल हो तो इलाज और मदद मिलती है","काम पर चोट लगे तो पहले इलाज कराएँ। तारीख, जगह और किसने देखा, यह नोट करें। आपको मुआवज़े का हक़ हो सकता है।"]],
spb:"📊 स्पॉन्सर व्यू (नमूना)",sp_t:"स्पॉन्सर व्यू",sp_n:"ये केवल नमूना आँकड़े हैं, असली डेटा नहीं।",sp1:"पंजीकृत मज़दूर",sp2:"इस महीने सक्रिय",sp3:"कम भुगतान पहचानने वाले",sp4:"मदद से e-श्रम में पंजीकृत",sp5:"सहायक से चैट",sp6:"कस्टमर केयर को भेजे गए",sp7:"हर महीने सक्रिय मज़दूर",sp_p:"गोपनीयता वादा: स्पॉन्सर को केवल जोड़े हुए आँकड़े दिखते हैं, किसी मज़दूर का नाम, मज़दूरी या शिकायतें कभी नहीं।",sp_b:"← वापस"},
ta:{n5:"பணி உரிமைகள்",wr_t:"பணிச் சூழல்",wr_s:"நியாயமான, பாதுகாப்பான பணியிடம் எப்படி இருக்கும் என்பதை அறியுங்கள்.",wr_c:"உங்கள் பணியிடத்தில் உண்மையானதைக் குறியிடுங்கள். பொருந்தாததை விட்டுவிடுங்கள்.",wr_b:"என் பணியிடத்தைச் சரிபார்",wr_ok:"நீங்கள் குறியிட்ட அனைத்தும் தரத்துக்கு ஏற்றவை. தொடருங்கள்.",wr_no:"இந்த விஷயங்களை மீண்டும் பாருங்கள்:",wr_h:"அடுத்த படி: முதலில் மரியாதையாகக் கேளுங்கள். மாற்றம் இல்லையெனில் உங்கள் மாவட்டத் தொழிலாளர் அலுவலகம் அல்லது மாவட்ட சட்ட உதவி ஆணையத்தை (இலவச சட்ட உதவி கிடைக்கலாம்) தொடர்பு கொள்ளுங்கள், அல்லது வாடிக்கையாளர் சேவையை அழையுங்கள். புகார் செய்வதா வேண்டாமா என்பது எப்போதும் உங்கள் விருப்பம்.",wr_src:"இந்தியத் தொழிலாளர் சட்டத் தொகுப்புகளை அடிப்படையாகக் கொண்டது, OSH தொகுப்பு உட்பட (மத்திய விதிகள் 8 மே 2026 அறிவிப்பு). உங்கள் மாநிலத்துக்கு தனி விதிகள் இருக்கலாம்.",
wr:[["நான் ஒரு நாளில் 8 மணி நேரத்துக்கு மேல் வேலை செய்வதில்லை","தினக்கூலித் தொழிலாளர்களுக்கு சாதாரண வேலை நாளுக்கு 8 மணி நேரம், வாரத்துக்கு 48 மணி நேரம் வரை."],["கூடுதல் நேரம் என் விருப்பம், இரட்டிப்பு கூலி","சாதாரண நேரத்துக்கு மேல் வேலைக்கு உங்கள் சம்மதம் தேவை, சாதாரண விகிதத்தின் குறைந்தது இரு மடங்கு கூலி தர வேண்டும்."],["எனக்கு வாரத்தில் ஒரு நாள் ஓய்வு உண்டு","தொழிலாளர்களுக்கு வாரத்தில் குறைந்தது ஒரு நாள் ஓய்வு உரிமை உண்டு. ஊதிய விடுப்பு பற்றி உங்கள் மாநில விதிகளைக் கேளுங்கள்."],["ஆபத்தான வேலைக்கு பாதுகாப்புக் கருவிகள் தரப்படுகின்றன","உயரம், இயந்திரம், தோண்டுதல் போன்ற ஆபத்தான வேலைக்கு முதலாளி பாதுகாப்புக் கருவிகளும் பாதுகாப்பான இடமும் தர வேண்டும். பாதுகாப்பற்ற நிலையைத் தெரிவியுங்கள்."],["குடிநீர், கழிவறை, சுத்தமான வெளிச்சமான இடம் உள்ளது","சுத்தமான குடிநீர், கழிவறைகள், சுத்தமான வெளிச்சமான பணியிடம் கட்டாயம். பெரிய பணியிடங்களில் ஓய்வறை, உணவகம் போன்றவையும் வேண்டும்."],["இங்கே பெண்கள் பாதுகாப்பாக வேலை செய்கிறார்கள், சம ஊதியம் பெறுகிறார்கள்","ஒரே வேலைக்கு ஆண்களுக்குச் சமமாக பெண்களுக்கும் ஊதியம் தர வேண்டும். இரவு வேலை பெண்ணின் சம்மதத்துடனும் நல்ல வெளிச்சம், பாதுகாப்பான பயணம் போன்ற ஏற்பாடுகளுடனும் மட்டுமே."],["இங்கே 14 வயதுக்குட்பட்ட குழந்தை வேலை செய்வதில்லை","14 வயதுக்குட்பட்ட குழந்தைகளை வேலையில் அமர்த்தக் கூடாது; 18 வயதுக்குட்பட்டவர்கள் ஆபத்தான வேலை செய்யக் கூடாது."],["யாராவது காயமடைந்தால் சிகிச்சையும் உதவியும் கிடைக்கும்","வேலையில் காயம் ஏற்பட்டால் முதலில் சிகிச்சை பெறுங்கள். தேதி, இடம், பார்த்தவர்களைக் குறித்துக் கொள்ளுங்கள். உங்களுக்கு இழப்பீடு பெற உரிமை இருக்கலாம்."]],
spb:"📊 ஸ்பான்சர் பார்வை (மாதிரி)",sp_t:"ஸ்பான்சர் பார்வை",sp_n:"இவை மாதிரி எண்கள் மட்டுமே, உண்மையான தரவு அல்ல.",sp1:"பதிவு செய்த தொழிலாளர்கள்",sp2:"இந்த மாதம் செயலில் உள்ளவர்கள்",sp3:"குறைவான கூலியைக் கண்டறிந்தவர்கள்",sp4:"உதவியுடன் e-ஸ்ரமில் பதிவு செய்தவர்கள்",sp5:"உதவியாளருடன் உரையாடல்கள்",sp6:"வாடிக்கையாளர் சேவைக்கு அனுப்பப்பட்டவை",sp7:"மாதந்தோறும் செயலில் உள்ள தொழிலாளர்கள்",sp_p:"தனியுரிமை உறுதி: ஸ்பான்சர்களுக்கு சேர்த்த எண்கள் மட்டுமே தெரியும்; தொழிலாளரின் பெயர், கூலி, புகார்கள் ஒருபோதும் தெரியாது.",sp_b:"← பின்செல்"},
kn:{n5:"ಕೆಲಸದ ಹಕ್ಕುಗಳು",wr_t:"ಕೆಲಸದ ಪರಿಸ್ಥಿತಿಗಳು",wr_s:"ನ್ಯಾಯಯುತ ಮತ್ತು ಸುರಕ್ಷಿತ ಕೆಲಸದ ಸ್ಥಳ ಹೇಗಿರಬೇಕು ತಿಳಿಯಿರಿ.",wr_c:"ನಿಮ್ಮ ಕೆಲಸದ ಸ್ಥಳದಲ್ಲಿ ನಿಜವಾದವುಗಳನ್ನು ಟಿಕ್ ಮಾಡಿ. ಅನ್ವಯಿಸದವುಗಳನ್ನು ಬಿಟ್ಟುಬಿಡಿ.",wr_b:"ನನ್ನ ಕೆಲಸದ ಸ್ಥಳ ಪರಿಶೀಲಿಸಿ",wr_ok:"ನೀವು ಟಿಕ್ ಮಾಡಿದ್ದೆಲ್ಲವೂ ಮಾನದಂಡಕ್ಕೆ ತಕ್ಕಂತಿದೆ. ಹೀಗೇ ಮುಂದುವರಿಸಿ.",wr_no:"ಈ ಅಂಶಗಳನ್ನು ಮತ್ತೊಮ್ಮೆ ನೋಡಿ:",wr_h:"ಮುಂದಿನ ಹೆಜ್ಜೆ: ಮೊದಲು ಸೌಜನ್ಯದಿಂದ ಕೇಳಿ. ಬದಲಾವಣೆ ಆಗದಿದ್ದರೆ ನಿಮ್ಮ ಜಿಲ್ಲಾ ಕಾರ್ಮಿಕ ಕಚೇರಿ ಅಥವಾ ಜಿಲ್ಲಾ ಕಾನೂನು ಸೇವಾ ಪ್ರಾಧಿಕಾರವನ್ನು (ಉಚಿತ ಕಾನೂನು ಸಹಾಯ ಸಿಗಬಹುದು) ಸಂಪರ್ಕಿಸಿ, ಅಥವಾ ಗ್ರಾಹಕ ಸೇವೆಗೆ ಕರೆ ಮಾಡಿ. ದೂರು ನೀಡಬೇಕೇ ಬೇಡವೇ ಎಂಬುದು ಯಾವಾಗಲೂ ನಿಮ್ಮ ಆಯ್ಕೆ.",wr_src:"ಭಾರತದ ಕಾರ್ಮಿಕ ಸಂಹಿತೆಗಳ ಆಧಾರದ ಮೇಲೆ, OSH ಸಂಹಿತೆ ಸೇರಿ (ಕೇಂದ್ರ ನಿಯಮಗಳು 8 ಮೇ 2026ರಂದು ಅಧಿಸೂಚನೆ). ನಿಮ್ಮ ರಾಜ್ಯಕ್ಕೆ ಸ್ವಂತ ನಿಯಮಗಳಿರಬಹುದು.",
wr:[["ನಾನು ದಿನಕ್ಕೆ 8 ಗಂಟೆಗಿಂತ ಹೆಚ್ಚು ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ","ದಿನಗೂಲಿ ಕಾರ್ಮಿಕರಿಗೆ ಸಾಮಾನ್ಯ ಕೆಲಸ ದಿನಕ್ಕೆ 8 ಗಂಟೆ, ವಾರಕ್ಕೆ 48 ಗಂಟೆ ವರೆಗೆ."],["ಹೆಚ್ಚುವರಿ ಗಂಟೆ ನನ್ನ ಆಯ್ಕೆ, ದುಪ್ಪಟ್ಟು ಕೂಲಿ","ಸಾಮಾನ್ಯ ಗಂಟೆಗಳಿಗಿಂತ ಹೆಚ್ಚು ಕೆಲಸಕ್ಕೆ ನಿಮ್ಮ ಒಪ್ಪಿಗೆ ಬೇಕು, ಸಾಮಾನ್ಯ ದರದ ಕನಿಷ್ಠ ಎರಡು ಪಟ್ಟು ಕೊಡಬೇಕು."],["ನನಗೆ ವಾರಕ್ಕೆ ಒಂದು ದಿನ ವಿಶ್ರಾಂತಿ ಇದೆ","ಕಾರ್ಮಿಕರಿಗೆ ವಾರಕ್ಕೆ ಕನಿಷ್ಠ ಒಂದು ದಿನ ವಿಶ್ರಾಂತಿಯ ಹಕ್ಕಿದೆ. ವೇತನ ಸಹಿತ ರಜೆ ಬಗ್ಗೆ ನಿಮ್ಮ ರಾಜ್ಯದ ನಿಯಮ ಕೇಳಿ."],["ಅಪಾಯಕಾರಿ ಕೆಲಸಕ್ಕೆ ಸುರಕ್ಷತಾ ಸಾಧನ ಕೊಡುತ್ತಾರೆ","ಎತ್ತರ, ಯಂತ್ರ, ಅಗೆತದಂತಹ ಅಪಾಯಕಾರಿ ಕೆಲಸಕ್ಕೆ ಮಾಲೀಕರು ಸುರಕ್ಷತಾ ಸಾಧನ ಮತ್ತು ಸುರಕ್ಷಿತ ಸ್ಥಳ ಕೊಡಬೇಕು. ಅಸುರಕ್ಷಿತ ಸ್ಥಿತಿಯನ್ನು ತಿಳಿಸಿ."],["ಕುಡಿಯುವ ನೀರು, ಶೌಚಾಲಯ, ಸ್ವಚ್ಛ ಬೆಳಕಿರುವ ಜಾಗ ಇದೆ","ಸ್ವಚ್ಛ ಕುಡಿಯುವ ನೀರು, ಶೌಚಾಲಯ, ಸ್ವಚ್ಛ ಬೆಳಕಿರುವ ಕೆಲಸದ ಸ್ಥಳ ಕಡ್ಡಾಯ. ದೊಡ್ಡ ಸ್ಥಳಗಳಲ್ಲಿ ವಿಶ್ರಾಂತಿ ಕೊಠಡಿ, ಕ್ಯಾಂಟೀನ್ ಕೂಡ ಇರಬೇಕು."],["ಇಲ್ಲಿ ಮಹಿಳೆಯರು ಸುರಕ್ಷಿತವಾಗಿ ಕೆಲಸ ಮಾಡುತ್ತಾರೆ, ಸಮಾನ ವೇತನ ಪಡೆಯುತ್ತಾರೆ","ಒಂದೇ ಕೆಲಸಕ್ಕೆ ಮಹಿಳೆಯರಿಗೂ ಪುರುಷರಷ್ಟೇ ವೇತನ ಸಿಗಬೇಕು. ರಾತ್ರಿ ಕೆಲಸ ಮಹಿಳೆಯ ಒಪ್ಪಿಗೆ ಮತ್ತು ಉತ್ತಮ ಬೆಳಕು, ಸುರಕ್ಷಿತ ಪ್ರಯಾಣದಂತಹ ವ್ಯವಸ್ಥೆಯೊಂದಿಗೆ ಮಾತ್ರ."],["ಇಲ್ಲಿ 14 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳು ಕೆಲಸ ಮಾಡುವುದಿಲ್ಲ","14 ವರ್ಷದೊಳಗಿನ ಮಕ್ಕಳನ್ನು ಕೆಲಸಕ್ಕೆ ಇಟ್ಟುಕೊಳ್ಳಬಾರದು, 18 ವರ್ಷದೊಳಗಿನವರು ಅಪಾಯಕಾರಿ ಕೆಲಸ ಮಾಡಬಾರದು."],["ಯಾರಿಗಾದರೂ ಗಾಯವಾದರೆ ಚಿಕಿತ್ಸೆ ಮತ್ತು ಸಹಾಯ ಸಿಗುತ್ತದೆ","ಕೆಲಸದಲ್ಲಿ ಗಾಯವಾದರೆ ಮೊದಲು ಚಿಕಿತ್ಸೆ ಪಡೆಯಿರಿ. ದಿನಾಂಕ, ಸ್ಥಳ, ನೋಡಿದವರನ್ನು ಬರೆದಿಟ್ಟುಕೊಳ್ಳಿ. ನಿಮಗೆ ಪರಿಹಾರ ಪಡೆಯುವ ಹಕ್ಕಿರಬಹುದು."]],
spb:"📊 ಸ್ಪಾನ್ಸರ್ ನೋಟ (ಮಾದರಿ)",sp_t:"ಸ್ಪಾನ್ಸರ್ ನೋಟ",sp_n:"ಇವು ಮಾದರಿ ಅಂಕಿಗಳು ಮಾತ್ರ, ನಿಜವಾದ ಡೇಟಾ ಅಲ್ಲ.",sp1:"ನೋಂದಾಯಿತ ಕಾರ್ಮಿಕರು",sp2:"ಈ ತಿಂಗಳು ಸಕ್ರಿಯರು",sp3:"ಕಡಿಮೆ ಕೂಲಿ ಗುರುತಿಸಿದವರು",sp4:"ಸಹಾಯದಿಂದ e-ಶ್ರಮ ನೋಂದಣಿ",sp5:"ಸಹಾಯಕನೊಂದಿಗೆ ಚಾಟ್‌ಗಳು",sp6:"ಗ್ರಾಹಕ ಸೇವೆಗೆ ಕಳುಹಿಸಿದ್ದು",sp7:"ತಿಂಗಳಿಗೆ ಸಕ್ರಿಯ ಕಾರ್ಮಿಕರು",sp_p:"ಗೌಪ್ಯತೆ ಭರವಸೆ: ಸ್ಪಾನ್ಸರ್‌ಗಳಿಗೆ ಕೂಡಿಸಿದ ಅಂಕಿಗಳು ಮಾತ್ರ ಕಾಣುತ್ತವೆ; ಕಾರ್ಮಿಕರ ಹೆಸರು, ಕೂಲಿ, ದೂರುಗಳು ಎಂದಿಗೂ ಕಾಣುವುದಿಲ್ಲ.",sp_b:"← ಹಿಂದೆ"},
mr:{n5:"कामाचे हक्क",wr_t:"कामाची परिस्थिती",wr_s:"न्याय्य आणि सुरक्षित कामाचे ठिकाण कसे असते ते जाणून घ्या.",wr_c:"तुमच्या कामाच्या ठिकाणी जे खरे आहे त्यावर टिक करा. जे लागू नाही ते सोडा.",wr_b:"माझे कामाचे ठिकाण तपासा",wr_ok:"तुम्ही टिक केलेले सर्व मानकानुसार आहे. असेच ठेवा.",wr_no:"या मुद्द्यांकडे पुन्हा पहा:",wr_h:"पुढची पायरी: आधी नम्रपणे विचारा. बदल झाला नाही तर तुमच्या जिल्हा कामगार कार्यालयाशी किंवा जिल्हा विधी सेवा प्राधिकरणाशी (मोफत कायदेशीर मदत मिळू शकते) संपर्क करा, किंवा ग्राहक सेवेला कॉल करा. तक्रार करायची की नाही हे नेहमी तुमच्या मर्जीवर आहे.",wr_src:"भारताच्या श्रम संहितांवर आधारित, OSH संहितेसह (केंद्रीय नियम 8 मे 2026 रोजी अधिसूचित). तुमच्या राज्याचे स्वतःचे नियम असू शकतात.",
wr:[["मी दिवसाला 8 तासांपेक्षा जास्त काम करत नाही","रोजंदारी कामगारांसाठी सामान्य काम दिवसाला 8 तास आणि आठवड्याला 48 तासांपर्यंत."],["जादा तास माझ्या मर्जीने, दुप्पट मोबदला","सामान्य तासांपेक्षा जास्त कामासाठी तुमची संमती लागते आणि सामान्य दराच्या किमान दुप्पट मोबदला द्यावा लागतो."],["मला आठवड्यातून एक दिवस विश्रांती मिळते","कामगारांना आठवड्यात किमान एक दिवस विश्रांतीचा हक्क आहे. सवेतन सुट्टीबद्दल तुमच्या राज्याचे नियम विचारा."],["धोकादायक कामासाठी सुरक्षा साधने मिळतात","उंचीवर, यंत्रांजवळ किंवा खोदकाम अशा धोकादायक कामासाठी मालकाने सुरक्षा साधने आणि सुरक्षित जागा द्यावी. असुरक्षित परिस्थिती कळवा."],["पिण्याचे पाणी, शौचालय आणि स्वच्छ, प्रकाशमान जागा आहे","स्वच्छ पिण्याचे पाणी, शौचालये आणि स्वच्छ, प्रकाशमान कामाची जागा आवश्यक आहे. मोठ्या ठिकाणी विश्रांती कक्ष, कँटीन यांसारख्या सोयीही हव्यात."],["येथे महिला सुरक्षितपणे काम करतात आणि समान वेतन मिळवतात","एकाच कामासाठी महिलांना पुरुषांइतकेच वेतन मिळावे. रात्रीचे काम महिलेच्या संमतीने आणि चांगला प्रकाश, सुरक्षित प्रवास अशा व्यवस्थेसह फक्त."],["येथे 14 वर्षांखालील कोणतेही मूल काम करत नाही","14 वर्षांखालील मुलांना कामावर ठेवू नये, आणि 18 वर्षांखालील व्यक्तींनी धोकादायक काम करू नये."],["कोणी जखमी झाल्यास उपचार आणि मदत मिळते","कामावर इजा झाल्यास आधी उपचार घ्या. तारीख, ठिकाण आणि कोणी पाहिले ते नोंदवा. तुम्हाला भरपाईचा हक्क असू शकतो."]],
spb:"📊 प्रायोजक दृश्य (नमुना)",sp_t:"प्रायोजक दृश्य",sp_n:"हे फक्त नमुना आकडे आहेत, खरा डेटा नाही.",sp1:"नोंदणीकृत कामगार",sp2:"या महिन्यात सक्रिय",sp3:"कमी मजुरी ओळखलेले",sp4:"मदतीने e-श्रम नोंदणी",sp5:"सहाय्यकाशी चॅट",sp6:"ग्राहक सेवेकडे पाठवलेले",sp7:"दरमहा सक्रिय कामगार",sp_p:"गोपनीयतेचे वचन: प्रायोजकांना फक्त एकत्रित आकडे दिसतात, कामगाराचे नाव, मजुरी किंवा तक्रारी कधीच नाही.",sp_b:"← मागे"},
bn:{n5:"কাজের অধিকার",wr_t:"কাজের পরিবেশ",wr_s:"ন্যায্য ও নিরাপদ কর্মস্থল কেমন হয় তা জানুন।",wr_c:"আপনার কর্মস্থলে যা সত্যি তাতে টিক দিন। যা প্রযোজ্য নয় তা বাদ দিন।",wr_b:"আমার কর্মস্থল যাচাই করুন",wr_ok:"আপনি যা টিক দিয়েছেন সবই মান অনুযায়ী। এভাবেই চালিয়ে যান।",wr_no:"এই বিষয়গুলো আবার দেখুন:",wr_h:"পরের ধাপ: আগে বিনয়ের সঙ্গে বলুন। পরিবর্তন না হলে আপনার জেলা শ্রম দপ্তর বা জেলা আইনি পরিষেবা কর্তৃপক্ষের (বিনামূল্যে আইনি সহায়তা মিলতে পারে) সঙ্গে যোগাযোগ করুন, অথবা কাস্টমার কেয়ারে ফোন করুন। অভিযোগ করবেন কি না, সেটা সবসময় আপনার সিদ্ধান্ত।",wr_src:"ভারতের শ্রম বিধিমালার ভিত্তিতে, OSH কোডসহ (কেন্দ্রীয় নিয়ম 8 মে 2026-এ প্রকাশিত)। আপনার রাজ্যের নিজস্ব নিয়ম থাকতে পারে।",
wr:[["আমি দিনে 8 ঘণ্টার বেশি কাজ করি না","দিনমজুরদের জন্য স্বাভাবিক কাজ দিনে 8 ঘণ্টা ও সপ্তাহে 48 ঘণ্টা পর্যন্ত।"],["বাড়তি ঘণ্টা আমার ইচ্ছায়, দ্বিগুণ মজুরি","স্বাভাবিক সময়ের বেশি কাজে আপনার সম্মতি লাগবে এবং স্বাভাবিক হারের অন্তত দ্বিগুণ মজুরি দিতে হবে।"],["আমি সপ্তাহে একদিন বিশ্রাম পাই","শ্রমিকদের সপ্তাহে অন্তত একদিন বিশ্রামের অধিকার আছে। বেতনসহ ছুটি নিয়ে আপনার রাজ্যের নিয়ম জিজ্ঞাসা করুন।"],["ঝুঁকির কাজে সুরক্ষা সরঞ্জাম দেওয়া হয়","উঁচুতে, যন্ত্রের কাছে বা খোঁড়ার মতো ঝুঁকির কাজে মালিককে সুরক্ষা সরঞ্জাম ও নিরাপদ জায়গা দিতে হবে। অনিরাপদ অবস্থার কথা জানান।"],["খাওয়ার জল, শৌচালয় ও পরিষ্কার আলোকিত জায়গা আছে","পরিষ্কার পানীয় জল, শৌচালয় ও পরিষ্কার আলোকিত কর্মস্থল বাধ্যতামূলক। বড় কর্মস্থলে বিশ্রামঘর, ক্যান্টিনের মতো সুবিধাও থাকতে হবে।"],["এখানে মহিলারা নিরাপদে কাজ করেন ও সমান মজুরি পান","একই কাজে মহিলারা পুরুষদের সমান মজুরি পাবেন। রাতের কাজ কেবল মহিলার সম্মতিতে এবং ভালো আলো, নিরাপদ যাতায়াতের মতো ব্যবস্থাসহ।"],["এখানে 14 বছরের কম বয়সী কোনো শিশু কাজ করে না","14 বছরের কম বয়সী শিশুদের কাজে লাগানো যাবে না, এবং 18 বছরের কমদের বিপজ্জনক কাজ করানো যাবে না।"],["কেউ আহত হলে চিকিৎসা ও সাহায্য মেলে","কাজে আঘাত পেলে আগে চিকিৎসা নিন। তারিখ, জায়গা ও কে দেখেছে তা লিখে রাখুন। আপনি ক্ষতিপূরণের অধিকারী হতে পারেন।"]],
spb:"📊 স্পনসর ভিউ (নমুনা)",sp_t:"স্পনসর ভিউ",sp_n:"এগুলো শুধু নমুনা সংখ্যা, আসল তথ্য নয়।",sp1:"নথিভুক্ত শ্রমিক",sp2:"এই মাসে সক্রিয়",sp3:"কম মজুরি শনাক্ত করেছেন",sp4:"সাহায্যে e-শ্রমে নিবন্ধিত",sp5:"সহায়কের সঙ্গে চ্যাট",sp6:"কাস্টমার কেয়ারে পাঠানো",sp7:"প্রতি মাসে সক্রিয় শ্রমিক",sp_p:"গোপনীয়তার প্রতিশ্রুতি: স্পনসররা শুধু মোট সংখ্যা দেখেন, কোনো শ্রমিকের নাম, মজুরি বা অভিযোগ কখনও নয়।",sp_b:"← ফিরে যান"},
"or":{n5:"କାମ ଅଧିକାର",wr_t:"କାମର ପରିସ୍ଥିତି",wr_s:"ନ୍ୟାୟସଙ୍ଗତ ଓ ସୁରକ୍ଷିତ କାମ ସ୍ଥାନ କେମିତି ହୁଏ ଜାଣନ୍ତୁ।",wr_c:"ଆପଣଙ୍କ କାମ ସ୍ଥାନରେ ଯାହା ସତ୍ୟ ତାହାକୁ ଟିକ୍ କରନ୍ତୁ। ଯାହା ଲାଗୁ ନୁହେଁ ତାହା ଛାଡ଼ନ୍ତୁ।",wr_b:"ମୋ କାମ ସ୍ଥାନ ଯାଞ୍ଚ କରନ୍ତୁ",wr_ok:"ଆପଣ ଟିକ୍ କରିଥିବା ସବୁ ମାନ ଅନୁସାରେ ଅଛି। ଏହିପରି ରଖନ୍ତୁ।",wr_no:"ଏହି ବିଷୟଗୁଡ଼ିକୁ ପୁଣି ଦେଖନ୍ତୁ:",wr_h:"ପରବର୍ତ୍ତୀ ପଦକ୍ଷେପ: ପ୍ରଥମେ ନମ୍ରତାର ସହ ପଚାରନ୍ତୁ। ବଦଳ ନହେଲେ ଆପଣଙ୍କ ଜିଲ୍ଲା ଶ୍ରମ କାର୍ଯ୍ୟାଳୟ କିମ୍ବା ଜିଲ୍ଲା ଆଇନ ସେବା ପ୍ରାଧିକରଣ (ମାଗଣା ଆଇନ ସହାୟତା ମିଳିପାରେ) ସହ ଯୋଗାଯୋଗ କରନ୍ତୁ, କିମ୍ବା ଗ୍ରାହକ ସେବାକୁ କଲ୍ କରନ୍ତୁ। ଅଭିଯୋଗ କରିବେ କି ନାହିଁ ତାହା ସବୁବେଳେ ଆପଣଙ୍କ ଇଚ୍ଛା।",wr_src:"ଭାରତର ଶ୍ରମ ସଂହିତା ଆଧାରରେ, OSH ସଂହିତା ସହ (କେନ୍ଦ୍ର ନିୟମ 8 ମଇ 2026ରେ ଜାରି)। ଆପଣଙ୍କ ରାଜ୍ୟର ନିଜସ୍ୱ ନିୟମ ଥାଇପାରେ।",
wr:[["ମୁଁ ଦିନକୁ 8 ଘଣ୍ଟାରୁ ଅଧିକ କାମ କରେ ନାହିଁ","ଦିନମଜୁରିଆଙ୍କ ପାଇଁ ସାଧାରଣ କାମ ଦିନକୁ 8 ଘଣ୍ଟା ଓ ସପ୍ତାହକୁ 48 ଘଣ୍ଟା ପର୍ଯ୍ୟନ୍ତ।"],["ଅତିରିକ୍ତ ଘଣ୍ଟା ମୋ ଇଚ୍ଛା, ଦୁଇଗୁଣ ମଜୁରି","ସାଧାରଣ ଘଣ୍ଟାଠାରୁ ଅଧିକ କାମ ପାଇଁ ଆପଣଙ୍କ ସମ୍ମତି ଦରକାର ଏବଂ ସାଧାରଣ ହାରର ଅତିକମରେ ଦୁଇଗୁଣ ଦେବାକୁ ହେବ।"],["ମୁଁ ସପ୍ତାହକୁ ଏକ ଦିନ ବିଶ୍ରାମ ପାଏ","ଶ୍ରମିକଙ୍କୁ ସପ୍ତାହରେ ଅତିକମରେ ଏକ ଦିନ ବିଶ୍ରାମର ଅଧିକାର ଅଛି। ବେତନ ସହ ଛୁଟି ବିଷୟରେ ଆପଣଙ୍କ ରାଜ୍ୟର ନିୟମ ପଚାରନ୍ତୁ।"],["ବିପଜ୍ଜନକ କାମ ପାଇଁ ସୁରକ୍ଷା ସାମଗ୍ରୀ ମିଳେ","ଉଚ୍ଚରେ, ଯନ୍ତ୍ର ପାଖରେ କିମ୍ବା ଖୋଳିବା ଭଳି ବିପଜ୍ଜନକ କାମରେ ମାଲିକ ସୁରକ୍ଷା ସାମଗ୍ରୀ ଓ ସୁରକ୍ଷିତ ସ୍ଥାନ ଦେବା ଉଚିତ। ଅସୁରକ୍ଷିତ ପରିସ୍ଥିତି ଜଣାନ୍ତୁ।"],["ପିଇବା ପାଣି, ଶୌଚାଳୟ ଓ ସ୍ୱଚ୍ଛ ଆଲୋକିତ ସ୍ଥାନ ଅଛି","ସ୍ୱଚ୍ଛ ପିଇବା ପାଣି, ଶୌଚାଳୟ ଓ ସ୍ୱଚ୍ଛ ଆଲୋକିତ କାମ ସ୍ଥାନ ବାଧ୍ୟତାମୂଳକ। ବଡ଼ ସ୍ଥାନରେ ବିଶ୍ରାମ କକ୍ଷ, କ୍ୟାଣ୍ଟିନ ଭଳି ସୁବିଧା ମଧ୍ୟ ଥିବା ଉଚିତ।"],["ଏଠାରେ ମହିଳାମାନେ ସୁରକ୍ଷିତ ଭାବେ କାମ କରନ୍ତି ଓ ସମାନ ମଜୁରି ପାଆନ୍ତି","ଏକା କାମ ପାଇଁ ମହିଳାମାନେ ପୁରୁଷଙ୍କ ସହ ସମାନ ମଜୁରି ପାଇବେ। ରାତି କାମ କେବଳ ମହିଳାଙ୍କ ସମ୍ମତି ଓ ଭଲ ଆଲୋକ, ସୁରକ୍ଷିତ ଯାତାୟାତ ଭଳି ବ୍ୟବସ୍ଥା ସହ।"],["ଏଠାରେ 14 ବର୍ଷରୁ କମ୍ ବୟସର କୌଣସି ପିଲା କାମ କରେ ନାହିଁ","14 ବର୍ଷରୁ କମ୍ ପିଲାଙ୍କୁ କାମରେ ଲଗାଇବା ଉଚିତ ନୁହେଁ, ଏବଂ 18 ବର୍ଷରୁ କମ୍ ବ୍ୟକ୍ତି ବିପଜ୍ଜନକ କାମ କରିବେ ନାହିଁ।"],["କେହି ଆହତ ହେଲେ ଚିକିତ୍ସା ଓ ସାହାଯ୍ୟ ମିଳେ","କାମରେ ଆଘାତ ଲାଗିଲେ ପ୍ରଥମେ ଚିକିତ୍ସା ନିଅନ୍ତୁ। ତାରିଖ, ସ୍ଥାନ ଓ କିଏ ଦେଖିଲା ତାହା ଲେଖି ରଖନ୍ତୁ। ଆପଣଙ୍କୁ କ୍ଷତିପୂରଣର ଅଧିକାର ଥାଇପାରେ।"]],
spb:"📊 ପ୍ରାୟୋଜକ ଦୃଶ୍ୟ (ନମୁନା)",sp_t:"ପ୍ରାୟୋଜକ ଦୃଶ୍ୟ",sp_n:"ଏହା କେବଳ ନମୁନା ସଂଖ୍ୟା, ପ୍ରକୃତ ତଥ୍ୟ ନୁହେଁ।",sp1:"ପଞ୍ଜୀକୃତ ଶ୍ରମିକ",sp2:"ଏହି ମାସରେ ସକ୍ରିୟ",sp3:"କମ୍ ମଜୁରି ଚିହ୍ନଟ କରିଥିବା",sp4:"ସହାୟତାରେ e-ଶ୍ରମ ପଞ୍ଜୀକରଣ",sp5:"ସହାୟକ ସହ ଚାଟ୍",sp6:"ଗ୍ରାହକ ସେବାକୁ ପଠାଯାଇଥିବା",sp7:"ମାସକୁ ସକ୍ରିୟ ଶ୍ରମିକ",sp_p:"ଗୋପନୀୟତା ପ୍ରତିଶ୍ରୁତି: ପ୍ରାୟୋଜକମାନେ କେବଳ ମିଳିତ ସଂଖ୍ୟା ଦେଖନ୍ତି, ଶ୍ରମିକଙ୍କ ନାମ, ମଜୁରି କିମ୍ବା ଅଭିଯୋଗ କେବେ ନୁହେଁ।",sp_b:"← ପଛକୁ"},
ml:{n5:"പണി അവകാശങ്ങൾ",wr_t:"ജോലി സാഹചര്യങ്ങൾ",wr_s:"നീതിയുക്തവും സുരക്ഷിതവുമായ ജോലിസ്ഥലം എങ്ങനെയിരിക്കണം എന്നറിയൂ.",wr_c:"നിങ്ങളുടെ ജോലിസ്ഥലത്ത് ശരിയായത് ടിക്ക് ചെയ്യൂ. ബാധകമല്ലാത്തത് ഒഴിവാക്കൂ.",wr_b:"എന്റെ ജോലിസ്ഥലം പരിശോധിക്കുക",wr_ok:"നിങ്ങൾ ടിക്ക് ചെയ്തതെല്ലാം നിലവാരത്തിനനുസരിച്ചാണ്. ഇങ്ങനെ തുടരൂ.",wr_no:"ഈ കാര്യങ്ങൾ ഒന്നുകൂടി നോക്കൂ:",wr_h:"അടുത്ത ചുവട്: ആദ്യം മാന്യമായി ചോദിക്കൂ. മാറ്റമില്ലെങ്കിൽ നിങ്ങളുടെ ജില്ലാ തൊഴിൽ ഓഫീസിനെയോ ജില്ലാ നിയമസേവന അതോറിറ്റിയെയോ (സൗജന്യ നിയമസഹായം ലഭിച്ചേക്കാം) സമീപിക്കൂ, അല്ലെങ്കിൽ കസ്റ്റമർ കെയറിനെ വിളിക്കൂ. പരാതി നൽകണോ വേണ്ടയോ എന്നത് എപ്പോഴും നിങ്ങളുടെ തീരുമാനം.",wr_src:"ഇന്ത്യയിലെ ലേബർ കോഡുകളെ അടിസ്ഥാനമാക്കി, OSH കോഡ് ഉൾപ്പെടെ (കേന്ദ്ര ചട്ടങ്ങൾ 2026 മേയ് 8-ന് വിജ്ഞാപനം ചെയ്തു). നിങ്ങളുടെ സംസ്ഥാനത്തിന് സ്വന്തം ചട്ടങ്ങൾ ഉണ്ടാകാം.",
wr:[["ഞാൻ ദിവസം 8 മണിക്കൂറിൽ കൂടുതൽ പണിയെടുക്കുന്നില്ല","ദിവസക്കൂലിക്കാർക്ക് സാധാരണ പണി ദിവസം 8 മണിക്കൂറും ആഴ്ചയിൽ 48 മണിക്കൂറും വരെ."],["അധിക മണിക്കൂർ എന്റെ ഇഷ്ടപ്രകാരം, ഇരട്ടി കൂലി","സാധാരണ സമയത്തിന് മുകളിലുള്ള പണിക്ക് നിങ്ങളുടെ സമ്മതം വേണം, സാധാരണ നിരക്കിന്റെ കുറഞ്ഞത് ഇരട്ടി നൽകണം."],["എനിക്ക് ആഴ്ചയിൽ ഒരു ദിവസം വിശ്രമം കിട്ടുന്നു","തൊഴിലാളികൾക്ക് ആഴ്ചയിൽ കുറഞ്ഞത് ഒരു ദിവസം വിശ്രമത്തിന് അവകാശമുണ്ട്. ശമ്പളത്തോടെയുള്ള അവധിയെക്കുറിച്ച് നിങ്ങളുടെ സംസ്ഥാനത്തെ ചട്ടം ചോദിക്കൂ."],["അപകടകരമായ പണിക്ക് സുരക്ഷാ ഉപകരണങ്ങൾ തരുന്നു","ഉയരത്തിലോ യന്ത്രങ്ങൾക്കടുത്തോ കുഴിക്കുന്നതോ പോലുള്ള അപകടകരമായ പണിക്ക് തൊഴിലുടമ സുരക്ഷാ ഉപകരണങ്ങളും സുരക്ഷിത സ്ഥലവും നൽകണം. സുരക്ഷിതമല്ലാത്ത അവസ്ഥ അറിയിക്കൂ."],["കുടിവെള്ളം, ശൗചാലയം, വൃത്തിയുള്ള വെളിച്ചമുള്ള സ്ഥലം ഉണ്ട്","ശുദ്ധമായ കുടിവെള്ളം, ശൗചാലയങ്ങൾ, വൃത്തിയുള്ള വെളിച്ചമുള്ള ജോലിസ്ഥലം നിർബന്ധമാണ്. വലിയ സ്ഥലങ്ങളിൽ വിശ്രമമുറി, കാന്റീൻ പോലുള്ളവയും വേണം."],["ഇവിടെ സ്ത്രീകൾ സുരക്ഷിതമായി പണിയെടുക്കുന്നു, തുല്യ കൂലി ലഭിക്കുന്നു","ഒരേ പണിക്ക് സ്ത്രീകൾക്കും പുരുഷന്മാർക്കു തുല്യമായ കൂലി ലഭിക്കണം. രാത്രി പണി സ്ത്രീയുടെ സമ്മതത്തോടെയും നല്ല വെളിച്ചം, സുരക്ഷിത യാത്ര പോലുള്ള ഏർപ്പാടുകളോടെയും മാത്രം."],["ഇവിടെ 14 വയസ്സിൽ താഴെയുള്ള കുട്ടികൾ പണിയെടുക്കുന്നില്ല","14 വയസ്സിൽ താഴെയുള്ള കുട്ടികളെ ജോലിക്ക് നിർത്തരുത്, 18 വയസ്സിൽ താഴെയുള്ളവർ അപകടകരമായ പണി ചെയ്യരുത്."],["ആർക്കെങ്കിലും പരിക്കേറ്റാൽ ചികിത്സയും സഹായവും കിട്ടുന്നു","പണിസ്ഥലത്ത് പരിക്കേറ്റാൽ ആദ്യം ചികിത്സ തേടൂ. തീയതി, സ്ഥലം, കണ്ടവർ എന്നിവ കുറിച്ചുവയ്ക്കൂ. നിങ്ങൾക്ക് നഷ്ടപരിഹാരത്തിന് അവകാശമുണ്ടാകാം."]],
spb:"📊 സ്പോൺസർ കാഴ്ച (സാമ്പിൾ)",sp_t:"സ്പോൺസർ കാഴ്ച",sp_n:"ഇവ സാമ്പിൾ കണക്കുകൾ മാത്രമാണ്, യഥാർത്ഥ ഡാറ്റയല്ല.",sp1:"രജിസ്റ്റർ ചെയ്ത തൊഴിലാളികൾ",sp2:"ഈ മാസം സജീവം",sp3:"കുറഞ്ഞ കൂലി കണ്ടെത്തിയവർ",sp4:"സഹായത്തോടെ e-ശ്രം രജിസ്ട്രേഷൻ",sp5:"സഹായിയുമായുള്ള ചാറ്റുകൾ",sp6:"കസ്റ്റമർ കെയറിലേക്ക് കൈമാറിയത്",sp7:"മാസംതോറും സജീവ തൊഴിലാളികൾ",sp_p:"സ്വകാര്യത ഉറപ്പ്: സ്പോൺസർമാർക്ക് ആകെ കണക്കുകൾ മാത്രം കാണാം; തൊഴിലാളിയുടെ പേര്, കൂലി, പരാതികൾ ഒരിക്കലും കാണില്ല.",sp_b:"← തിരികെ"},
gu:{n5:"કામના અધિકારો",wr_t:"કામની પરિસ્થિતિ",wr_s:"ન્યાયી અને સલામત કામની જગ્યા કેવી હોય તે જાણો.",wr_c:"તમારી કામની જગ્યાએ જે સાચું હોય તેના પર ટિક કરો. જે લાગુ ન પડે તે છોડો.",wr_b:"મારી કામની જગ્યા તપાસો",wr_ok:"તમે ટિક કરેલું બધું ધોરણ મુજબ છે. આમ જ રાખો.",wr_no:"આ મુદ્દા ફરી જુઓ:",wr_h:"આગળનું પગલું: પહેલાં નમ્રતાથી પૂછો. ફેરફાર ન થાય તો તમારી જિલ્લા શ્રમ કચેરી કે જિલ્લા કાનૂની સેવા સત્તામંડળ (મફત કાનૂની મદદ મળી શકે) નો સંપર્ક કરો, અથવા કસ્ટમર કેરને કૉલ કરો. ફરિયાદ કરવી કે નહીં એ હંમેશાં તમારી મરજી છે.",wr_src:"ભારતના શ્રમ સંહિતાઓ પર આધારિત, OSH સંહિતા સહિત (કેન્દ્રીય નિયમો 8 મે 2026ના રોજ જાહેર). તમારા રાજ્યના પોતાના નિયમો હોઈ શકે.",
wr:[["હું દિવસના 8 કલાકથી વધુ કામ કરતો/કરતી નથી","રોજમદાર કામદારો માટે સામાન્ય કામ દિવસના 8 કલાક અને અઠવાડિયાના 48 કલાક સુધી."],["વધારાના કલાક મારી મરજીથી, બમણું વેતન","સામાન્ય કલાકથી વધુ કામ માટે તમારી સંમતિ જોઈએ અને સામાન્ય દરથી ઓછામાં ઓછું બમણું ચૂકવવું પડે."],["મને અઠવાડિયામાં એક દિવસ આરામ મળે છે","કામદારોને અઠવાડિયામાં ઓછામાં ઓછા એક દિવસના આરામનો અધિકાર છે. પગારસહિત રજા વિશે તમારા રાજ્યના નિયમ પૂછો."],["જોખમી કામ માટે સલામતી સાધનો મળે છે","ઊંચાઈ, મશીન કે ખોદકામ જેવા જોખમી કામમાં માલિકે સલામતી સાધનો અને સલામત જગ્યા આપવી જોઈએ. અસલામત સ્થિતિ જણાવો."],["પીવાનું પાણી, શૌચાલય અને સ્વચ્છ, અજવાળાવાળી જગ્યા છે","સ્વચ્છ પીવાનું પાણી, શૌચાલય અને સ્વચ્છ, અજવાળાવાળી કામની જગ્યા ફરજિયાત છે. મોટી જગ્યાએ આરામ ખંડ, કેન્ટીન જેવી સુવિધા પણ હોવી જોઈએ."],["અહીં મહિલાઓ સલામત રીતે કામ કરે છે અને સમાન વેતન મેળવે છે","સમાન કામ માટે મહિલાઓને પુરુષો જેટલું જ વેતન મળવું જોઈએ. રાત્રિનું કામ ફક્ત મહિલાની સંમતિ અને સારું અજવાળું, સલામત અવરજવર જેવી વ્યવસ્થા સાથે."],["અહીં 14 વર્ષથી નાની ઉંમરનું કોઈ બાળક કામ કરતું નથી","14 વર્ષથી નાનાં બાળકોને કામે રાખી શકાય નહીં, અને 18 વર્ષથી નાની વ્યક્તિ જોખમી કામ ન કરે."],["કોઈ ઘાયલ થાય તો સારવાર અને મદદ મળે છે","કામ પર ઈજા થાય તો પહેલાં સારવાર લો. તારીખ, જગ્યા અને કોણે જોયું તે નોંધો. તમને વળતરનો અધિકાર હોઈ શકે."]],
spb:"📊 સ્પોન્સર વ્યૂ (નમૂનો)",sp_t:"સ્પોન્સર વ્યૂ",sp_n:"આ ફક્ત નમૂના આંકડા છે, સાચો ડેટા નથી.",sp1:"નોંધાયેલા કામદારો",sp2:"આ મહિને સક્રિય",sp3:"ઓછી મજૂરી ઓળખનારા",sp4:"મદદથી e-શ્રમ નોંધણી",sp5:"સહાયક સાથે ચેટ",sp6:"કસ્ટમર કેરને મોકલેલા",sp7:"દર મહિને સક્રિય કામદારો",sp_p:"ગોપનીયતા વચન: સ્પોન્સરને ફક્ત કુલ આંકડા દેખાય છે, કામદારનું નામ, મજૂરી કે ફરિયાદ ક્યારેય નહીં.",sp_b:"← પાછા"},
pa:{n5:"ਕੰਮ ਦੇ ਹੱਕ",wr_t:"ਕੰਮ ਦੀਆਂ ਹਾਲਤਾਂ",wr_s:"ਜਾਣੋ ਕਿ ਨਿਆਂਪੂਰਨ ਅਤੇ ਸੁਰੱਖਿਅਤ ਕੰਮ ਦੀ ਥਾਂ ਕਿਹੋ ਜਿਹੀ ਹੁੰਦੀ ਹੈ।",wr_c:"ਆਪਣੀ ਕੰਮ ਦੀ ਥਾਂ 'ਤੇ ਜੋ ਸੱਚ ਹੈ ਉਸ 'ਤੇ ਟਿੱਕ ਕਰੋ। ਜੋ ਲਾਗੂ ਨਹੀਂ ਉਹ ਛੱਡ ਦਿਓ।",wr_b:"ਮੇਰੀ ਕੰਮ ਦੀ ਥਾਂ ਜਾਂਚੋ",wr_ok:"ਤੁਸੀਂ ਜੋ ਟਿੱਕ ਕੀਤਾ ਉਹ ਸਭ ਮਿਆਰ ਅਨੁਸਾਰ ਹੈ। ਇਸੇ ਤਰ੍ਹਾਂ ਰੱਖੋ।",wr_no:"ਇਨ੍ਹਾਂ ਨੁਕਤਿਆਂ ਨੂੰ ਮੁੜ ਵੇਖੋ:",wr_h:"ਅਗਲਾ ਕਦਮ: ਪਹਿਲਾਂ ਨਿਮਰਤਾ ਨਾਲ ਪੁੱਛੋ। ਬਦਲਾਅ ਨਾ ਹੋਵੇ ਤਾਂ ਆਪਣੇ ਜ਼ਿਲ੍ਹਾ ਕਿਰਤ ਦਫ਼ਤਰ ਜਾਂ ਜ਼ਿਲ੍ਹਾ ਕਾਨੂੰਨੀ ਸੇਵਾਵਾਂ ਅਥਾਰਟੀ (ਮੁਫ਼ਤ ਕਾਨੂੰਨੀ ਮਦਦ ਮਿਲ ਸਕਦੀ ਹੈ) ਨਾਲ ਸੰਪਰਕ ਕਰੋ, ਜਾਂ ਕਸਟਮਰ ਕੇਅਰ ਨੂੰ ਕਾਲ ਕਰੋ। ਸ਼ਿਕਾਇਤ ਕਰਨੀ ਹੈ ਜਾਂ ਨਹੀਂ, ਇਹ ਹਮੇਸ਼ਾ ਤੁਹਾਡੀ ਮਰਜ਼ੀ ਹੈ।",wr_src:"ਭਾਰਤ ਦੇ ਕਿਰਤ ਕੋਡਾਂ 'ਤੇ ਆਧਾਰਿਤ, OSH ਕੋਡ ਸਮੇਤ (ਕੇਂਦਰੀ ਨਿਯਮ 8 ਮਈ 2026 ਨੂੰ ਨੋਟੀਫਾਈ)। ਤੁਹਾਡੇ ਰਾਜ ਦੇ ਆਪਣੇ ਨਿਯਮ ਹੋ ਸਕਦੇ ਹਨ।",
wr:[["ਮੈਂ ਦਿਨ ਵਿੱਚ 8 ਘੰਟਿਆਂ ਤੋਂ ਵੱਧ ਕੰਮ ਨਹੀਂ ਕਰਦਾ/ਕਰਦੀ","ਦਿਹਾੜੀਦਾਰ ਕਾਮਿਆਂ ਲਈ ਆਮ ਕੰਮ ਦਿਨ ਵਿੱਚ 8 ਘੰਟੇ ਅਤੇ ਹਫ਼ਤੇ ਵਿੱਚ 48 ਘੰਟੇ ਤੱਕ।"],["ਵਾਧੂ ਘੰਟੇ ਮੇਰੀ ਮਰਜ਼ੀ ਨਾਲ, ਦੁੱਗਣੀ ਅਦਾਇਗੀ","ਆਮ ਘੰਟਿਆਂ ਤੋਂ ਵੱਧ ਕੰਮ ਲਈ ਤੁਹਾਡੀ ਸਹਿਮਤੀ ਚਾਹੀਦੀ ਹੈ ਅਤੇ ਆਮ ਦਰ ਤੋਂ ਘੱਟੋ-ਘੱਟ ਦੁੱਗਣੀ ਅਦਾਇਗੀ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ।"],["ਮੈਨੂੰ ਹਫ਼ਤੇ ਵਿੱਚ ਇੱਕ ਦਿਨ ਆਰਾਮ ਮਿਲਦਾ ਹੈ","ਕਾਮਿਆਂ ਨੂੰ ਹਫ਼ਤੇ ਵਿੱਚ ਘੱਟੋ-ਘੱਟ ਇੱਕ ਦਿਨ ਆਰਾਮ ਦਾ ਹੱਕ ਹੈ। ਤਨਖ਼ਾਹ ਸਮੇਤ ਛੁੱਟੀ ਬਾਰੇ ਆਪਣੇ ਰਾਜ ਦੇ ਨਿਯਮ ਪੁੱਛੋ।"],["ਖ਼ਤਰਨਾਕ ਕੰਮ ਲਈ ਸੁਰੱਖਿਆ ਸਾਮਾਨ ਮਿਲਦਾ ਹੈ","ਉਚਾਈ, ਮਸ਼ੀਨਾਂ ਜਾਂ ਪੁਟਾਈ ਵਰਗੇ ਖ਼ਤਰਨਾਕ ਕੰਮ ਵਿੱਚ ਮਾਲਕ ਨੂੰ ਸੁਰੱਖਿਆ ਸਾਮਾਨ ਅਤੇ ਸੁਰੱਖਿਅਤ ਥਾਂ ਦੇਣੀ ਚਾਹੀਦੀ ਹੈ। ਅਸੁਰੱਖਿਅਤ ਹਾਲਤ ਬਾਰੇ ਦੱਸੋ।"],["ਪੀਣ ਦਾ ਪਾਣੀ, ਪਖਾਨਾ ਅਤੇ ਸਾਫ਼, ਰੌਸ਼ਨੀ ਵਾਲੀ ਥਾਂ ਹੈ","ਸਾਫ਼ ਪੀਣ ਦਾ ਪਾਣੀ, ਪਖਾਨੇ ਅਤੇ ਸਾਫ਼, ਰੌਸ਼ਨੀ ਵਾਲੀ ਕੰਮ ਦੀ ਥਾਂ ਲਾਜ਼ਮੀ ਹੈ। ਵੱਡੀਆਂ ਥਾਵਾਂ 'ਤੇ ਆਰਾਮ ਕਮਰਾ, ਕੰਟੀਨ ਵਰਗੀਆਂ ਸਹੂਲਤਾਂ ਵੀ ਹੋਣੀਆਂ ਚਾਹੀਦੀਆਂ ਹਨ।"],["ਇੱਥੇ ਔਰਤਾਂ ਸੁਰੱਖਿਅਤ ਕੰਮ ਕਰਦੀਆਂ ਹਨ ਅਤੇ ਬਰਾਬਰ ਤਨਖ਼ਾਹ ਪਾਉਂਦੀਆਂ ਹਨ","ਇੱਕੋ ਕੰਮ ਲਈ ਔਰਤਾਂ ਨੂੰ ਮਰਦਾਂ ਦੇ ਬਰਾਬਰ ਤਨਖ਼ਾਹ ਮਿਲਣੀ ਚਾਹੀਦੀ ਹੈ। ਰਾਤ ਦਾ ਕੰਮ ਸਿਰਫ਼ ਔਰਤ ਦੀ ਸਹਿਮਤੀ ਅਤੇ ਚੰਗੀ ਰੌਸ਼ਨੀ, ਸੁਰੱਖਿਅਤ ਆਵਾਜਾਈ ਵਰਗੇ ਪ੍ਰਬੰਧਾਂ ਨਾਲ।"],["ਇੱਥੇ 14 ਸਾਲ ਤੋਂ ਛੋਟਾ ਕੋਈ ਬੱਚਾ ਕੰਮ ਨਹੀਂ ਕਰਦਾ","14 ਸਾਲ ਤੋਂ ਛੋਟੇ ਬੱਚਿਆਂ ਨੂੰ ਕੰਮ 'ਤੇ ਨਹੀਂ ਰੱਖਿਆ ਜਾ ਸਕਦਾ, ਅਤੇ 18 ਸਾਲ ਤੋਂ ਛੋਟੇ ਖ਼ਤਰਨਾਕ ਕੰਮ ਨਾ ਕਰਨ।"],["ਕੋਈ ਜ਼ਖ਼ਮੀ ਹੋਵੇ ਤਾਂ ਇਲਾਜ ਅਤੇ ਮਦਦ ਮਿਲਦੀ ਹੈ","ਕੰਮ 'ਤੇ ਸੱਟ ਲੱਗੇ ਤਾਂ ਪਹਿਲਾਂ ਇਲਾਜ ਕਰਵਾਓ। ਤਾਰੀਖ਼, ਥਾਂ ਅਤੇ ਕਿਸ ਨੇ ਵੇਖਿਆ ਇਹ ਨੋਟ ਕਰੋ। ਤੁਹਾਨੂੰ ਮੁਆਵਜ਼ੇ ਦਾ ਹੱਕ ਹੋ ਸਕਦਾ ਹੈ।"]],
spb:"📊 ਸਪਾਂਸਰ ਵਿਊ (ਨਮੂਨਾ)",sp_t:"ਸਪਾਂਸਰ ਵਿਊ",sp_n:"ਇਹ ਸਿਰਫ਼ ਨਮੂਨਾ ਅੰਕੜੇ ਹਨ, ਅਸਲੀ ਡਾਟਾ ਨਹੀਂ।",sp1:"ਦਰਜ ਕਾਮੇ",sp2:"ਇਸ ਮਹੀਨੇ ਸਰਗਰਮ",sp3:"ਘੱਟ ਦਿਹਾੜੀ ਪਛਾਣਨ ਵਾਲੇ",sp4:"ਮਦਦ ਨਾਲ e-ਸ਼੍ਰਮ ਰਜਿਸਟ੍ਰੇਸ਼ਨ",sp5:"ਸਹਾਇਕ ਨਾਲ ਚੈਟ",sp6:"ਕਸਟਮਰ ਕੇਅਰ ਨੂੰ ਭੇਜੇ",sp7:"ਹਰ ਮਹੀਨੇ ਸਰਗਰਮ ਕਾਮੇ",sp_p:"ਨਿੱਜਤਾ ਵਾਅਦਾ: ਸਪਾਂਸਰਾਂ ਨੂੰ ਸਿਰਫ਼ ਜੋੜੇ ਹੋਏ ਅੰਕੜੇ ਦਿਸਦੇ ਹਨ, ਕਿਸੇ ਕਾਮੇ ਦਾ ਨਾਮ, ਦਿਹਾੜੀ ਜਾਂ ਸ਼ਿਕਾਇਤਾਂ ਕਦੇ ਨਹੀਂ।",sp_b:"← ਪਿੱਛੇ"},
"as":{n5:"কামৰ অধিকাৰ",wr_t:"কামৰ পৰিস্থিতি",wr_s:"ন্যায্য আৰু সুৰক্ষিত কৰ্মস্থান কেনেকুৱা হয় জানক।",wr_c:"আপোনাৰ কৰ্মস্থানত যি সঁচা তাত টিক দিয়ক। যি প্ৰযোজ্য নহয় সেয়া এৰি দিয়ক।",wr_b:"মোৰ কৰ্মস্থান পৰীক্ষা কৰক",wr_ok:"আপুনি টিক দিয়া সকলো মান অনুসৰি। এনেদৰেই চলাই যাওক।",wr_no:"এই কথাবোৰ আকৌ চাওক:",wr_h:"পৰৱৰ্তী খোজ: প্ৰথমে বিনয়েৰে সোধক। সলনি নহ'লে আপোনাৰ জিলা শ্ৰম কাৰ্যালয় বা জিলা আইনী সেৱা কৰ্তৃপক্ষৰ (বিনামূলীয়া আইনী সহায় পাব পাৰে) সৈতে যোগাযোগ কৰক, বা কাষ্টমাৰ কেয়াৰক ফোন কৰক। অভিযোগ কৰিব নে নাই সেয়া সদায় আপোনাৰ ইচ্ছা।",wr_src:"ভাৰতৰ শ্ৰম সংহিতাৰ ওপৰত আধাৰিত, OSH সংহিতাকে ধৰি (কেন্দ্ৰীয় নিয়ম 8 মে 2026ত জাননী)। আপোনাৰ ৰাজ্যৰ নিজা নিয়ম থাকিব পাৰে।",
